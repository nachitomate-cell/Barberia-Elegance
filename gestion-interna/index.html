<!doctype html>
<html lang="es">
<head>

  <title>Panel Admin | Barbería SaaS</title>

  <!-- Anti-FOUC. Debe ir inline y antes del CSS: aplica el tema guardado en el
       mismo tick en que el parser llega acá, o sea antes del primer paint. Si
       esto lo hiciera React (al montar el Sidebar), el usuario en modo claro
       vería el panel oscuro un instante en cada carga. Duplica a propósito la
       key de ThemeContext.jsx — no se puede importar sin volverse asíncrono. -->
  <script>
    try {
      if (localStorage.getItem('gestion-theme') === 'light') {
        document.documentElement.classList.add('light');
      }
    } catch (_) {}
  </script>

  <!-- DEV sin cache TOTAL (espejo de _devserver.py): en localhost el service
       worker del build anterior sirve un index.html precacheado que apunta a
       chunks que ya no existen tras cada rebuild → pantalla blanca con error
       de MIME. Aqui se desregistra todo SW y se purgan sus caches. En
       produccion (hostname real) no corre jamas. -->
  <script>
    (function () {
      var h = location.hostname;
      if (h !== 'localhost' && h !== '127.0.0.1') return;
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (rs) {
            rs.forEach(function (r) { r.unregister(); });
          }).catch(function () {});
        }
        if (window.caches && caches.keys) {
          caches.keys().then(function (ks) {
            ks.forEach(function (k) { caches.delete(k); });
          }).catch(function () {});
        }
      } catch (_) {}
    })();
  </script>

<script id="vite-plugin-pwa:register-sw" src="/gestion-interna/registerSW.js"></script></head>
<body class="bg-slate-900 text-primary antialiased">
  <div id="root"></div>

  <!-- ══ Splash de inicio (animación de arranque) ══════════════════════════
       Solo en el hub app.synaptechspa.cl = la app SynapTech Studio (iOS/Android).
       En subdominios de tenant NO se muestra (respeta el white-label).
       CSS/SVG puro: aparece antes de que cargue React y se desvanece al montar.
       Recrea el ícono: el calendario se dibuja, los nodos se encienden como
       sinapsis, las líneas los conectan y el check confirma. ── -->
  <div id="app-splash" aria-hidden="true">
    <svg viewBox="0 0 120 120" fill="none" role="img" aria-label="SynapTech Studio">
      <defs>
        <linearGradient id="sp-grad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#9CCC3C"/>
          <stop offset="1" stop-color="#C6F94E"/>
        </linearGradient>
      </defs>
      <!-- Marco del calendario -->
      <rect class="sp-draw sp-cal" x="22" y="40" width="76" height="66" rx="9"
        stroke="#F5F1E8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
      <rect class="sp-ring sp-r1" x="41" y="27" width="7.5" height="20" rx="3.75" fill="#F5F1E8"/>
      <rect class="sp-ring sp-r2" x="71" y="27" width="7.5" height="20" rx="3.75" fill="#F5F1E8"/>
      <!-- Líneas de la grilla -->
      <g stroke="url(#sp-grad)" stroke-width="3.5" stroke-linecap="round">
        <line class="sp-draw sp-l0" x1="40" y1="61" x2="80" y2="61" pathLength="1"/>
        <line class="sp-draw sp-l1" x1="40" y1="77" x2="80" y2="77" pathLength="1"/>
        <line class="sp-draw sp-l2" x1="40" y1="93" x2="62" y2="93" pathLength="1"/>
        <line class="sp-draw sp-l3" x1="40" y1="61" x2="40" y2="93" pathLength="1"/>
        <line class="sp-draw sp-l4" x1="60" y1="61" x2="60" y2="93" pathLength="1"/>
        <line class="sp-draw sp-l5" x1="80" y1="61" x2="80" y2="77" pathLength="1"/>
      </g>
      <!-- Nodos -->
      <g fill="url(#sp-grad)">
        <circle class="sp-node sp-n0" cx="40" cy="61" r="6"/>
        <circle class="sp-node sp-n1" cx="60" cy="61" r="6"/>
        <circle class="sp-node sp-n2" cx="80" cy="61" r="6"/>
        <circle class="sp-node sp-n3" cx="40" cy="77" r="6"/>
        <circle class="sp-node sp-n4" cx="60" cy="77" r="6"/>
        <circle class="sp-node sp-n5" cx="80" cy="77" r="6"/>
        <circle class="sp-node sp-n6" cx="40" cy="93" r="6"/>
        <circle class="sp-node sp-n7" cx="60" cy="93" r="6"/>
      </g>
      <!-- Check "cita confirmada" -->
      <path class="sp-check" d="M74 93 L79 98 L88 86" stroke="#F5F1E8" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>
    </svg>
    <!-- Firma de marca SynapTech (aparece al final) -->
    <div class="sp-brand">
      <img src="/gestion-interna/synaptech/ig.png" alt="" class="sp-brand-logo"/>
      <span class="sp-brand-text">SynapTech Studio</span>
    </div>
  </div>
  <style>
    #app-splash{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:#0D1522;transition:opacity .5s ease;}
    #app-splash svg{width:42vmin;height:42vmin;max-width:240px;max-height:240px;}
    #app-splash .sp-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw .7s ease forwards;}
    #app-splash .sp-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp-pop .4s ease forwards;}
    #app-splash .sp-node{transform-box:fill-box;transform-origin:center;opacity:0;animation:sp-pop .45s cubic-bezier(.2,1.4,.4,1) forwards;filter:drop-shadow(0 0 4px rgba(198,249,78,.45));}
    #app-splash .sp-check{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:sp-check .5s ease forwards;}
    #app-splash .sp-cal{animation-delay:.1s;}
    #app-splash .sp-r1{animation-delay:.5s;} #app-splash .sp-r2{animation-delay:.57s;}
    #app-splash .sp-n0{animation-delay:.7s;} #app-splash .sp-n1{animation-delay:.78s;} #app-splash .sp-n2{animation-delay:.86s;}
    #app-splash .sp-n3{animation-delay:.94s;} #app-splash .sp-n4{animation-delay:1.02s;} #app-splash .sp-n5{animation-delay:1.1s;}
    #app-splash .sp-n6{animation-delay:1.18s;} #app-splash .sp-n7{animation-delay:1.26s;}
    #app-splash .sp-l0{animation-delay:.88s;} #app-splash .sp-l1{animation-delay:.98s;} #app-splash .sp-l2{animation-delay:1.08s;}
    #app-splash .sp-l3{animation-delay:.98s;} #app-splash .sp-l4{animation-delay:1.08s;} #app-splash .sp-l5{animation-delay:1.18s;}
    #app-splash .sp-check{animation-delay:1.5s;}
    @keyframes sp-draw{to{stroke-dashoffset:0;}}
    @keyframes sp-check{0%{stroke-dashoffset:1;opacity:0;}25%{opacity:1;}100%{stroke-dashoffset:0;opacity:1;}}
    @keyframes sp-pop{0%{transform:scale(0);opacity:0;}70%{transform:scale(1.18);opacity:1;}100%{transform:scale(1);opacity:1;}}
    #app-splash .sp-brand{position:absolute;bottom:8.5%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:9px;opacity:0;transform:translateY(10px);animation:sp-brand-in .6s ease 2.15s forwards;}
    #app-splash .sp-brand-logo{width:24px;height:24px;-o-object-fit:contain;object-fit:contain;}
    #app-splash .sp-brand-text{color:#F5F1E8;font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;font-weight:600;letter-spacing:.02em;}
    @keyframes sp-brand-in{to{opacity:1;transform:translateY(0);}}
    @media (prefers-reduced-motion: reduce){
      #app-splash .sp-draw,#app-splash .sp-check{stroke-dashoffset:0;animation:none;opacity:1;}
      #app-splash .sp-ring,#app-splash .sp-node{opacity:1;animation:none;transform:none;}
      #app-splash .sp-brand{opacity:1;transform:none;animation:none;}
    }
  </style>
  <script>
    (function(){
      // Solo la app SynapTech Studio (hub). En tenants NO (white-label intacto).
      // En dev (localhost) se emula el hub con ?local=sandbox — igual que el
      // DOMAIN_MAP resuelve el hub pre-login — para poder revisar el flujo
      // completo de la app de las tiendas sin desplegar.
      var _h = location.hostname;
      var _esHub = _h === 'app.synaptechspa.cl' ||
        ((_h === 'localhost' || _h === '127.0.0.1') && /[?&]local=sandbox(?:&|$)/.test(location.search));
      if (!_esHub) return;
      // Una sola vez por sesión: evita mostrarlo de nuevo en el reload que hace
      // el selector de tenant (HubTenantGate) tras el login.
      try { if (sessionStorage.getItem('_splash_shown')) return; sessionStorage.setItem('_splash_shown', '1'); } catch (_) {}
      var s = document.getElementById('app-splash');
      if (!s) return;
      s.style.display = 'flex';
      var start = Date.now();
      function hide(){ s.style.opacity = '0'; setTimeout(function(){ if (s && s.parentNode) s.parentNode.removeChild(s); }, 550); }
      var iv = setInterval(function(){
        var root = document.getElementById('root');
        var mounted = root && root.children.length > 0;
        if (mounted && (Date.now() - start) > 3200){ clearInterval(iv); hide(); }
      }, 120);
      setTimeout(function(){ clearInterval(iv); hide(); }, 6000); // red de seguridad
    })();
  </script>

</body>
