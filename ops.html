                const rec = med(completos.slice(-3)), ant = med(completos.slice(-6,-3));
                const cambio = ant > 0 ? Math.round(100*(rec-ant)/ant) : 0;
                if (cambio <= -40) aviso = `<div class="alerta ambar" style="margin:8px 0 0"><span>🟡</span><span>
                  El alcance cayó <b>${Math.abs(cambio)}%</b> respecto de los tres días anteriores (${num(Math.round(rec))} vs ${num(Math.round(ant))} cuentas/día).</span></div>`;
                else if (cambio >= 60) aviso = `<div class="alerta info" style="margin:8px 0 0"><span>🔵</span><span>
                  El alcance subió <b>${cambio}%</b> respecto de los tres días anteriores. Mira qué publicaste.</span></div>`;
              }
              return `<div class="spark">${d.map((x,k) => {
                const esHoy = parcial && k === d.length-1;
                const alto = Math.max(2, Math.round(100*x.valor/tope));
                return `<i class="${esHoy?'hoy parcial':''}" style="height:${Math.min(100,alto)}%" title="${esc(`${x.fecha}: ${num(x.valor)} cuentas${esHoy?' — el día va en curso, este número todavía sube':''}`)}"></i>`;
              }).join('')}</div>
                <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-top:4px">
                  <span>${d[0].fecha}</span><span>alcance diario${parcial?' · hoy va a medias':''}</span><span>${d[d.length-1].fecha}</span></div>
                ${aviso}`;
            })() : '<p class="muted">Instagram todavía no devuelve serie de alcance para esta cuenta.</p>'}
            <div class="row"><span>${tip('Interacciones', 'Likes, comentarios, guardados y compartidos sumados.')}</span><span class="v tnum">${n(i.interacciones7d)}</span></div>
            ${(() => {
              // Lo único que paga: DM que terminaron en reunión pedida. Sin
              // esta fila la pestaña medía alcance y likes, que no son plata,
              // y no se podía saber si Instagram trae negocio o solo ruido.
              if (!i.leads) return '';
              const conv = i.dm7d ? Math.round(100 * i.leads.semana / i.dm7d) : null;
              return `<div class="row"><span>${tip('DM que pidieron reunión (7d)',
                'De los DM que entraron esta semana, cuántos terminaron con el lead aceptando una reunión. Es lo único de esta pestaña que se convierte en plata; el resto es alcance.')}</span>
                <span class="v tnum">${num(i.leads.semana)}${conv !== null ? ` <span class="muted" style="font-weight:400">· ${conv}% de los DM</span>` : ''}</span></div>
              <div class="row"><span>${tip('Leads de Instagram (histórico)',
                'Total acumulado de reuniones pedidas que entraron por DM de Instagram, desde que se conectó la cuenta.')}</span>
                <span class="v tnum">${num(i.leads.total)}</span></div>`;
            })()}
            ${(() => {
              // "0 comentarios" es ambiguo: ¿no hubo, o dejaron de llegar? La
              // fecha del último lo resuelve y solo cuesta 1 lectura.
              const hace = (ms) => { if (!ms) return null; const d = Math.round((Date.now()-ms)/86400000);
                return d < 1 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`; };
              const filas = [];
              if (!i.comentarios7d) filas.push(['Último comentario recibido', hace(i.ultimoComentarioEn),
                'Con 0 comentarios en la semana no se distingue "no hubo" de "dejaron de llegar". Si acá dice «nunca» y la automatización está encendida, el problema es la suscripción al webhook, no la cuenta.']);
              if (!i.dm7d) filas.push(['Último DM recibido', hace(i.ultimoDmEn),
                'Lo mismo para los mensajes directos: un 0 en la semana con «nunca» acá significa que no está entrando nada.']);
              return filas.map(([et, val, ayuda]) => `<div class="row"><span>${tip(et, ayuda)}</span>
                <span class="v" style="color:${val ? 'var(--ink)' : 'var(--amber)'}">${val || 'nunca'}</span></div>`).join('');
            })()}
            <div class="row"><span>${tip('Visitas al perfil', 'Gente que entró a mirar tu perfil. Es la señal más cercana a intención de compra que da Instagram gratis.')}</span><span class="v tnum">${n(i.visitasPerfil7d)}</span></div>
            <div class="row"><span>${tip('Publicaciones', 'Total de posts en la cuenta.')}</span><span class="v tnum">${n(i.publicaciones)}</span></div>
            <div class="row"><span>${tip('Webhook suscrito', 'Meta solo entrega DMs y comentarios si la cuenta está suscrita por API — configurar la URL en el panel de desarrolladores no alcanza. Si esto dice que no, el bot está sordo.')}</span>${
              // Tres estados, no dos: `undefined` es un snapshot viejo que
              // todavía no traía el campo. Pintarlo de rojo como si estuviera
              // caído es una falsa alarma, justo lo que un panel no puede hacer.
              i.suscripcionOk === undefined
                ? '<span class="v muted">sin dato aún</span>'
                : `<span class="v" style="color:${i.suscripcionOk ? 'var(--green)' : 'var(--red)'}">${i.suscripcionOk ? ((i.suscripcionCampos || []).join(' + ') || 'sí') : 'NO'}</span>`
            }</div>
          </div>

          <div class="panel">
            <h3>✍️ Publicar</h3>
            <p class="hint">Sube una foto o un reel a @${i.username} sin abrir la app. Elige el archivo con el botón y queda alojado solo; si ya tienes la media en internet, pega su URL <b>https pública</b> (Instagram la descarga desde sus servidores, así que tiene que abrirse sin contraseña).</p>
            ${i.cupoPublicacion ? `<div class="row"><span>${tip('Cupo de hoy', 'Publicaciones usadas hoy contra el tope que reporta Instagram para esta cuenta en las últimas 24 horas. El tope lo fija Meta y lo trae la API, no está escrito a mano acá.')}</span><span class="v tnum">${i.cupoPublicacion.usado}/${i.cupoPublicacion.tope}</span></div>` : ''}
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
              <select id="igTipo" class="inp">
                <option value="IMAGE">Foto en el feed</option>
                <option value="REELS">Reel</option>
                <option value="STORIES">Historia</option>
                <option value="CAROUSEL">Carrusel (varias URLs, una por línea)</option>
              </select>
              <div style="display:flex;gap:8px;align-items:center">
                <input id="igArchivo" type="file" accept="image/*,video/*" multiple style="display:none">
                <button class="mini" id="igSubir" style="flex:0 0 auto">📎 Subir desde el computador</button>
                <span class="muted" id="igSubirMsg" style="font-size:11px;flex:1"></span>
              </div>
              <textarea id="igUrl" rows="1" class="inp" placeholder="https://… URL pública, o usa el botón de arriba"></textarea>
              <textarea id="igCaption" rows="3" class="inp" placeholder="Texto del post" style="resize:vertical"></textarea>
              <label style="font-size:11.5px;color:var(--soft)">Cuándo publicar
                <input id="igCuando" type="datetime-local" class="inp" style="margin-top:4px">
              </label>
              <div style="display:flex;gap:8px">
                <button class="primary" id="igProgramar" style="flex:1">Programar</button>
                <button id="igPublicar" title="Salta la cola y publica en este instante">Publicar ahora</button>
              </div>
              <button class="mini" id="igVerPosts" style="margin-top:4px">📱 …o resubir una publicación mía como historia</button>
              <div id="igGaleria"></div>
            </div>
          </div>
        </div>

        ${conversacionesHtml(i.conversaciones)}
        ${colaHtml(i.programadas)}`;
    }

    /* Quién habla por DM y quién le contesta. El bot atiende a los desconocidos
       (son leads); los locales que ya son clientes se detectan solos por su @ y
       quedan para Ignacio. Los barberos que escriben desde su cuenta PERSONAL
       no hay forma de adivinarlos: para esos está el botón. */
    function conversacionesHtml(cs){
      if(!cs || !cs.length) return '';
      const hace = (ms) => { if(!ms) return ''; const m = Math.round((Date.now()-ms)/60000);
        return m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m/60)} h` : `hace ${Math.round(m/1440)} d`; };
      return `<div class="panel" style="margin-top:14px">
        <h3>💬 Quién te escribe por DM</h3>
        <p class="hint">Los locales que ya son clientes se reconocen solos por su @ y el bot no les contesta — te avisa a ti por WhatsApp. Si un barbero te escribe desde su cuenta personal, márcalo acá y el bot no vuelve a responderle nunca.</p>
        ${cs.map(c => `<div class="loc">
          <span class="dot ${c.esSoporte ? 'off' : 'on'}"></span>
          <span style="flex:1">@${c.username || c.igsid}${c.nombre ? ` <span class="muted">· ${c.nombre}</span>` : ''}</span>
          <span class="tag ${c.esSoporte ? '' : 'g'}">${c.esSoporte ? '🛟 soporte tuyo' : '🤖 contesta el bot'}</span>
          ${c.username ? `<a class="mini" href="https://ig.me/m/${encodeURIComponent(c.username)}" target="_blank" rel="noopener"
             style="text-decoration:none;display:inline-flex;align-items:center"
             title="Abre este chat en Instagram. Los que marcas como tuyos los tienes que contestar a mano, y buscarlos uno por uno era el paso lento.">abrir chat ↗</a>` : ''}
          <button class="mini" data-igsop="${c.igsid}" data-val="${c.esSoporte ? '0' : '1'}">${c.esSoporte ? 'que conteste el bot' : 'es cliente, lo atiendo yo'}</button>
          <span class="sub2">${String(c.texto || '').replace(/</g,'&lt;')} <span class="muted">· ${hace(c.cuando)}</span></span>
        </div>`).join('')}
      </div>`;
    }

    /* La cola no es decoración: un creativo programado que falló en silencio es
       una publicación que nunca salió y que nadie echa de menos hasta que
       revisa. Por eso los errores van primero y en rojo. */
    function colaHtml(p){
      if(!p) return '';
      const cuando = (ms) => {
        if(!ms) return '—';
        const d = new Date(ms), falta = Math.round((ms - Date.now())/60000);
        const txt = d.toLocaleString('es-CL', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' });
        return falta < 0 ? `${txt} (vencida)` : falta < 60 ? `${txt} · en ${falta} min`
             : falta < 1440 ? `${txt} · en ${Math.round(falta/60)} h` : `${txt} · en ${Math.round(falta/1440)} d`;
      };
      const pend = p.pendientes || [], err = p.conError || [];
      if(!pend.length && !err.length) {
        return `<div class="panel" style="margin-top:14px"><h3>🗓️ Cola de publicación</h3>
          <p class="muted">Nada programado. Carga los creativos de la semana y salen solos.</p></div>`;
      }
      return `<div class="panel" style="margin-top:14px">
        <h3>🗓️ Cola de publicación</h3>
        <p class="hint">El cron revisa cada 5 minutos y publica lo que venció. Si algo falla, reintenta 3 veces y después te avisa por WhatsApp.</p>
        ${err.map(e => `<div class="loc">
          <span class="dot warn"></span>
          <span style="flex:1">${e.tipo} · <span style="color:var(--red)">detenida tras 3 intentos</span></span>
          <button class="mini danger" data-igdel="${e.id}">quitar</button>
          <span class="sub2" style="color:var(--red)">${String(e.error).replace(/</g,'&lt;').slice(0,160)}</span>
        </div>`).join('')}
        ${pend.map(x => {
          // Una programada que pasó su hora y sigue pendiente es una que NO
          // salió. Antes se pintaba con el punto verde y un "(vencida)" en
          // texto plano: se veía igual de sana que una programada para mañana,
          // que es justo lo que este panel dice querer evitar.
          // El margen de 15 min evita el falso positivo del snapshot: el cron
          // publica cada 5 min y el panel puede traer datos de hace un rato.
          const atrasada = x.publicarEn && x.publicarEn < Date.now() - 15*60*1000;
          return `<div class="loc">
          <span class="dot ${atrasada ? 'warn' : 'on'}"></span>
          ${x.vistaPrevia ? `<img src="${esc(x.vistaPrevia)}" alt="" loading="lazy"
             style="width:34px;height:34px;border-radius:7px;object-fit:cover;flex:0 0 auto;border:1px solid var(--hairline)">` : ''}
          <span style="flex:1">${x.tipo}${x.caption ? ' · <span class="muted">' + String(x.caption).replace(/</g,'&lt;') + '…</span>' : ''}</span>
          <span class="tnum" style="font-size:12px;color:${atrasada ? 'var(--red)' : '#fff'}">${atrasada ? '⚠️ ' : ''}${cuando(x.publicarEn)}</span>
          <button class="mini danger" data-igdel="${x.id}">cancelar</button>
          ${atrasada ? '<span class="sub2" style="color:var(--red)">Pasó su hora y no salió. El cron corre cada 5 min: si sigue así, algo está trabado.</span>' : ''}
        </div>`;
        }).join('')}
      </div>`;
    }

    function seccionInstagram(){
      return `<div class="full" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="muted" style="font-size:12px">${ESTADO.instagram && ESTADO.instagram.conectado ? '@' + ESTADO.instagram.username : 'sin conectar'}</span>
        </div>${instagramPanel(ESTADO.instagram)}${asistenteLocalesHtml()}`;
    }

    /* ── Asistente de reservas en la cuenta de cada LOCAL ──
       Nada que ver con el bot de arriba: ese atiende @synaptechspa y vende.
       Este contesta los DM que le llegan a la barbería y agenda cortes.

       No se carga con el resto del panel a propósito: verificar la suscripción
       es una llamada a la API de Meta POR LOCAL, y hacerlas todas cada vez que
       alguien abre ops es caro para algo que se mira una vez al mes. */
    function asistenteLocalesHtml(){
      return `<div class="panel" style="margin-top:14px">
        <h3>🤖 Asistente de reservas en los locales</h3>
        <p class="hint">El bot que contesta los mensajes directos <b>de la barbería</b> y agenda con su disponibilidad real. Encenderlo hace las tres cosas que hacen falta: habilita el permiso, suscribe la cuenta a los avisos de Meta y lo deja activo en su panel.</p>
        <button class="mini" id="igLocCargar">Ver estado de los locales</button>
        <div id="igLocales"></div>
      </div>`;
    }

    async function igLocalesCargar(btn){
      const cont = document.getElementById('igLocales');
      if (cont.innerHTML) { cont.innerHTML = ''; btn.textContent = 'Ver estado de los locales'; return; }
      cont.innerHTML = '<p class="muted" style="font-size:12px;margin-top:10px">Consultando a Meta local por local…</p>';
      btn.disabled = true;
      try {
        const r = await _fn('instagramAsistenteEstado')({});
        const ls = r.data.locales || [];
        if (!ls.length) { cont.innerHTML = '<p class="muted" style="margin-top:10px">Ningún local tiene Instagram conectado todavía.</p>'; return; }
        cont.innerHTML = ls.map(l => {
          /* El motivo del silencio, con nombre. Las tres condiciones fallan
             igual de calladas desde afuera, así que se dicen en el orden en que
             hay que resolverlas: primero autorizar, después habilitar. */
          let estado, punto;
          if (l.error)                    { estado = 'error: ' + l.error;                          punto = 'warn'; }
          else if (l.cuentaPrestada)      { estado = 'usa la cuenta de SynapTech, no la suya';     punto = ''; }
          else if (!l.entitlement)        { estado = 'no habilitado';                              punto = ''; }
          else if (l.desconectada)        { estado = 'desconectó su Instagram';                    punto = 'warn'; }
          else if (!l.conectado)          { estado = 'habilitado pero sin cuenta conectada';       punto = 'warn'; }
          else if (l.permisos.length && !l.permisoMensajes)
                                          { estado = 'autorizó sin permiso de mensajes';           punto = 'warn'; }
          else if (l.suscripcion && !l.suscripcion.ok)
                                          { estado = 'no suscrita: ' + (l.suscripcion.error || ''); punto = 'warn'; }
          else if (!l.encendidoPorElLocal) { estado = 'el local lo apagó';                          punto = 'warn'; }
          else                            { estado = 'contestando';                                punto = 'on'; }
          return `<div class="loc">
            <span class="dot ${punto}"></span>
            <span style="flex:1">${esc(l.tenantId)}${l.username ? ` <span class="muted">· @${esc(l.username)}</span>` : ''}</span>
            <span class="tag ${l.operativo ? 'g' : ''}">${estado}</span>
            <button class="mini" data-igauth="${esc(l.tenantId)}" title="Abre Instagram para que el local autorice los 5 permisos. Es el link que hay que mandarle al dueño.">link de permisos</button>
            <button class="mini${l.entitlement ? ' danger' : ''}" data-igbot="${esc(l.tenantId)}" data-val="${l.entitlement ? '0' : '1'}">${l.entitlement ? 'apagar' : 'encender'}</button>
            ${l.cuentaPrestada ? '<span class="sub2">Conectó el lookbook con @synaptechspa antes de tener cuenta propia. Hasta que autorice la suya, el asistente no puede encenderse acá.</span>'
              : l.permisosDesconocidos ? '<span class="sub2">Se conectó antes de que se guardaran los permisos: si no contesta, hay que reautorizar con el link.</span>' : ''}
          </div>`;
        }).join('');
        cont.querySelectorAll('[data-igbot]').forEach(b =>
          b.onclick = () => igLocalActivar(b.dataset.igbot, b.dataset.val === '1', b));
        cont.querySelectorAll('[data-igauth]').forEach(b =>
          b.onclick = () => igLinkLocal(b.dataset.igauth, b));
        btn.textContent = 'Ocultar';
      } catch(e){
        cont.innerHTML = `<p style="color:var(--red);font-size:12px;margin-top:10px">${esc(e.message || e)}</p>`;
      } finally { btn.disabled = false; }
    }

    async function igLocalActivar(tenantId, activo, btn){
      if (activo && !confirm(`Encender el asistente de reservas en ${tenantId}. Desde ese momento contesta solo los DM que le lleguen a su Instagram. ¿Confirmas?`)) return;
      btn.disabled = true;
      try {
        const r = await _fn('instagramAsistenteActivar')({ tenantId, activo });
        const av = (r.data && r.data.advertencias) || [];
        if (av.length) alert('Quedó guardado, pero:\n\n· ' + av.join('\n· '));
        const cargar = document.getElementById('igLocCargar');
        document.getElementById('igLocales').innerHTML = '';
        await igLocalesCargar(cargar);
      } catch(e){ alert('No se pudo: ' + (e.message || e)); }
      finally { btn.disabled = false; }
    }

    /* El link con los 5 permisos para UN local. Se copia en vez de abrirse:
       lo tiene que autorizar el dueño de la cuenta desde su propio Instagram,
       no el operador desde la sesión de acá. */
    async function igLinkLocal(tenantId, btn){
      const antes = btn.textContent;
      btn.disabled = true; btn.textContent = 'generando…';
      try {
        const r = await _fn('instagramPlataformaLink')({ tenantId, origen: location.origin });
        await navigator.clipboard.writeText(r.data.url);
        btn.textContent = '✓ copiado, mándaselo';
        setTimeout(() => { btn.textContent = antes; }, 4000);
      } catch(e){
        btn.textContent = antes;
        prompt('Cópialo a mano y mándaselo al local:', (e && e.url) || '');
        alert('No pude copiarlo solo: ' + (e.message || e));
      } finally { btn.disabled = false; }
    }

    /** Abre el flujo de autorización de Instagram en una pestaña nueva. */
    async function igConectar(btn){
      if (btn) { btn.textContent = 'Preparando…'; btn.disabled = true; }
      try {
        const r = await _fn('instagramPlataformaLink')({ origen: location.origin });
        // window.open y no location.href: si el operador cancela en Instagram,
        // vuelve a encontrar el panel donde lo dejó en vez de una pantalla vacía.
        window.open(r.data.url, '_blank', 'noopener');
        if (btn) { btn.textContent = 'Autoriza en la pestaña nueva y vuelve'; }
      } catch(e){
        alert('No pude generar el link: ' + (e.message || e));
        if (btn) { btn.textContent = 'Conectar @synaptechspa'; btn.disabled = false; }
      }
    }

    /** Datos comunes del formulario de publicación. */
    function igFormulario(){
      const tipo = document.getElementById('igTipo').value;
      const urls = document.getElementById('igUrl').value.split('\n').map(s => s.trim()).filter(Boolean);
      const caption = document.getElementById('igCaption').value;
      if (!urls.length || urls.some(u => !/^https:\/\//i.test(u))) {
        alert('Cada URL tiene que ser https y pública. Instagram descarga la media desde sus servidores.');
        return null;
      }
      if (tipo !== 'CAROUSEL' && urls.length > 1) { alert('Solo el carrusel admite varias URLs.'); return null; }
      return { tipo, urls, caption };
    }
    function igLimpiar(){
      document.getElementById('igUrl').value = '';
      document.getElementById('igCaption').value = '';
      document.getElementById('igCuando').value = '';
    }

    /* Sube el creativo a Storage y deja su URL pública en el campo.
       Instagram descarga la media desde SUS servidores: por eso tiene que ser
       https y accesible sin credenciales, y por eso un archivo del computador
       no servía. Antes había que subirlo a otro lado y pegar el link a mano —
       el paso que hacía que "publicar desde el panel" no se usara. */
    async function igSubirArchivos(files){
      const msg = document.getElementById('igSubirMsg');
      const campo = document.getElementById('igUrl');
      const urls = [];
      const storage = firebase.app().storage();
      for (let k = 0; k < files.length; k++) {
        const f = files[k];
        if (f.size > 15 * 1024 * 1024) { alert(`"${f.name}" pesa más de 15 MB.`); return; }
        msg.textContent = `Subiendo ${k + 1}/${files.length}: ${f.name}…`;
        // Nombre único: dos creativos con el mismo nombre no se pisan, y la
        // cola puede tardar días en publicarlos.
        const limpio = f.name.replace(/[^\w.\-]/g, '_').slice(-60);
        const ref = storage.ref(`instagram_creativos/${Date.now()}_${k}_${limpio}`);
        const snap = await ref.put(f, { contentType: f.type });
        urls.push(await snap.ref.getDownloadURL());
      }
      // Se AÑADE a lo que ya haya: un carrusel se arma en varias tandas.
      const previo = campo.value.trim();
      campo.value = (previo ? previo + '\n' : '') + urls.join('\n');
      msg.textContent = `✅ ${urls.length} archivo(s) listo(s)`;
    }

    async function igPublicar(btn){
      const f = igFormulario(); if (!f) return;
      if (!confirm(`Publicar ${f.tipo} en Instagram AHORA. Es público e irreversible. ¿Confirmas?`)) return;
      const txt = btn.textContent;
      btn.textContent = 'Publicando…'; btn.disabled = true;
      try {
        const r = await _fn('instagramPublicar')({ tipo: f.tipo, urls: f.urls, caption: f.caption });
        alert('Publicado ✅ id ' + r.data.id);
        igLimpiar(); await refrescarInstagram();
      } catch(e){ alert('No se pudo publicar: ' + (e.message || e)); }
      btn.textContent = txt; btn.disabled = false;
    }

    async function igProgramar(btn){
      const f = igFormulario(); if (!f) return;
      const cuando = document.getElementById('igCuando').value;
      if (!cuando) { alert('Elige fecha y hora.'); return; }
      // El input datetime-local entrega hora LOCAL sin zona; se convierte a ISO
      // real para que el backend no la interprete como UTC y publique 4 h antes.
      const iso = new Date(cuando).toISOString();
      const txt = btn.textContent;
      btn.textContent = 'Programando…'; btn.disabled = true;
      try {
        await _fn('instagramProgramar')({ tipo: f.tipo, urls: f.urls, caption: f.caption, publicarEn: iso, vistaPrevia: f.urls[0] });
        igLimpiar(); await refrescarInstagram();
      } catch(e){ alert('No se pudo programar: ' + (e.message || e)); }
      btn.textContent = txt; btn.disabled = false;
    }

    async function igCancelar(id){
      if (!confirm('¿Sacar esta publicación de la cola?')) return;
      try { await _fn('instagramCancelarProgramada')({ id }); await refrescarInstagram(); }
      catch(e){ alert('No se pudo cancelar: ' + (e.message || e)); }
    }

    /** Vuelve a leer solo Instagram y repinta esa sección. */
    async function refrescarInstagram(){
      try {
        const r = await _fn('opsSnapshot')({});
        if (r.data && r.data.instagram) ESTADO.instagram = r.data.instagram;
      } catch(_) {}
      const el = document.querySelector('.sec[data-sec="instagram"]');
      if (el) { el.innerHTML = seccionInstagram(); bindInstagram(); }
    }

    /* Resubir una publicación como historia.
       Instagram NO expone por API el "compartir en historias" con el sticker
       del post — eso es exclusivo de la app. Lo que sí se puede, y es
       equivalente en la práctica, es publicar una historia con la MISMA imagen.
       La URL no se guarda: caduca en horas, así que el programador vuelve a
       pedirla justo antes de publicar usando el id de la publicación. */
    async function igVerPosts(btn){
      const cont = document.getElementById('igGaleria');
      if (cont.innerHTML) { cont.innerHTML = ''; return; }   // segundo clic = cerrar
      cont.innerHTML = '<p class="muted" style="font-size:12px">Cargando tus publicaciones…</p>';
      try {
        const r = await _fn('instagramMisPublicaciones')({ limite: 18 });
        const items = (r.data.items || []).filter(x => x.miniatura);
        if (!items.length) { cont.innerHTML = '<p class="muted">No hay publicaciones.</p>'; return; }
        cont.innerHTML = `
          <p class="hint" style="margin:10px 0 6px">Elige una y sale como historia. Se republica la misma imagen — el sticker de "compartir publicación" no lo permite la API de Instagram, solo la app.</p>
          <div class="galeria">${items.map(m => `
            <button class="gitem" data-igpost="${m.id}" data-tipo="${m.tipo}" title="${String(m.caption).replace(/"/g,'&quot;')}">
              <img src="${m.miniatura}" alt="" loading="lazy">
              <span>${m.fecha}${m.tipo === 'VIDEO' ? ' · video' : ''}</span>
            </button>`).join('')}</div>`;
        cont.querySelectorAll('[data-igpost]').forEach(b =>
          b.onclick = () => igResubir(b.dataset.igpost, b.dataset.tipo, b.querySelector('img') && b.querySelector('img').src));
      } catch(e){
        cont.innerHTML = `<p style="color:var(--red);font-size:12px">${e.message || e}</p>`;
      }
    }

    async function igResubir(mediaId, tipo, miniatura){
      const cuando = document.getElementById('igCuando').value;
      if (!cuando) { alert('Primero elige la fecha y hora arriba, después la publicación.'); return; }
      if (!confirm(`Programar esta publicación como HISTORIA para el ${new Date(cuando).toLocaleString('es-CL')}?`)) return;
      try {
        await _fn('instagramProgramar')({
          tipo: 'STORIES', origenMediaId: mediaId, vistaPrevia: miniatura || '',
          publicarEn: new Date(cuando).toISOString(),
        });
        document.getElementById('igGaleria').innerHTML = '';
        igLimpiar(); await refrescarInstagram();
      } catch(e){ alert('No se pudo programar: ' + (e.message || e)); }
    }

    async function igSoporte(igsid, soporte){
      try { await _fn('instagramMarcarSoporte')({ igsid, soporte }); await refrescarInstagram(); }
      catch(e){ alert('No se pudo cambiar: ' + (e.message || e)); }
    }

    function bindInstagram(){
      document.querySelectorAll('[data-igsop]').forEach(b =>
        b.onclick = () => igSoporte(b.dataset.igsop, b.dataset.val === '1'));
      const c = document.getElementById('igConectar');   if (c) c.onclick = () => igConectar(c);
      const lc = document.getElementById('igLocCargar'); if (lc) lc.onclick = () => igLocalesCargar(lc);
      const fi = document.getElementById('igArchivo');
      const sb = document.getElementById('igSubir');
      if (sb && fi) {
        sb.onclick = () => fi.click();
        fi.onchange = async () => {
          if (!fi.files || !fi.files.length) return;
          sb.disabled = true;
          try { await igSubirArchivos(fi.files); }
          catch(e){
            document.getElementById('igSubirMsg').textContent = '';
            alert('No se pudo subir: ' + (e.message || e));
          }
          sb.disabled = false; fi.value = '';
        };
      }
      const p = document.getElementById('igPublicar');   if (p) p.onclick = () => igPublicar(p);
      const g = document.getElementById('igProgramar');  if (g) g.onclick = () => igProgramar(g);
      const vp = document.getElementById('igVerPosts');  if (vp) vp.onclick = () => igVerPosts(vp);
      document.querySelectorAll('[data-igdel]').forEach(b => b.onclick = () => igCancelar(b.dataset.igdel));
    }

    /* ── 📅 Tu agenda: la que leen los bots de WhatsApp e Instagram ──────
       No es una vista bonita de los leads: es la agenda REAL. Cada bloque
       lima es una reunión con candado transaccional (ventas_agenda_locks);
       bloquear una hora acá hace que el bot deje de ofrecerla al instante. */
    let _agVentas = null;
    const AG_DIAS = ['dom','lun','mar','mié','jue','vie','sáb'];
    function agendaVentasPanel(v){
      _agVentas = v;
      const cfg = v.cfg || {};
      const canalG = c => c === 'instagram' ? '📸' : '💬';
      const horarioTags = AG_DIAS.map((n, d) => {
        const r = (cfg.horario || {})[d];
        return `<span class="tag" style="margin:2px;cursor:pointer" onclick="opsAgendaHorario(${d})" title="${esc('Clic para cambiar la jornada del ' + n)}">${n} ${r ? r[0] + '–' + r[1] : 'libre'}</span>`;
      }).join(' ');
      const grilla = (v.dias || []).map(d => {
        const libres = d.slots.filter(s => s.estado === 'libre').length;
        const cerrado = !d.slots.length;
        return `<div class="agdia">
          <b>${d.hablada.replace(' de ', ' ')}</b>
          <span class="chips">${cerrado ? '<span class="muted" style="font-size:11px;padding-top:3px">día libre</span>'
            : d.slots.map(s => {
              if (s.estado === 'reunion') return `<button class="agchip reunion" title="${esc((s.nombre || s.contacto) + (s.negocio ? ' · ' + s.negocio : '') + ' — clic para gestionar')}" onclick="opsAgendaSlot('${d.fecha}','${s.hora}','reunion','${s.contacto}')">${s.hora} ${canalG(s.canal)} ${s.nombre ? s.nombre.split(' ')[0] : ''}</button>`;
              if (s.estado === 'bloqueado') return `<button class="agchip bloq" title="Bloqueada por ti — clic para liberarla" onclick="opsAgendaSlot('${d.fecha}','${s.hora}','bloqueado','')">${s.hora}</button>`;
              if (s.estado === 'pasada') return `<span class="agchip pasada">${s.hora}</span>`;
              return `<button class="agchip" title="Libre: el bot puede ofrecerla — clic para bloquearla" onclick="opsAgendaSlot('${d.fecha}','${s.hora}','libre','')">${s.hora}</button>`;
            }).join('')}
          </span>
          ${cerrado ? '' : (libres ? `<button class="mini" onclick="opsAgendaDia('${d.fecha}', true)" title="Bloquear todas las horas libres del día">cerrar día</button>` : `<button class="mini" onclick="opsAgendaDia('${d.fecha}', false)" title="Quitar los bloqueos del día (las reuniones no se tocan)">abrir día</button>`)}
        </div>`;
      }).join('');
      return `<div class="panel">
        <h3>📅 Tu agenda · reuniones con leads
          <span class="tag ${cfg.activo ? 'g' : ''}" ${cfg.activo ? '' : 'style="color:var(--red)"'}>${cfg.activo ? 'ABIERTA' : 'PAUSADA'}</span>
          <span class="tag">${cfg.duracionMin} min por reunión</span>
          <span style="margin-left:auto"></span>
          <button class="mini ${cfg.activo ? 'danger' : ''}" onclick="opsAgendaToggle()">${cfg.activo ? 'Pausar agenda' : 'Abrir agenda'}</button>
        </h3>
        <p class="hint" style="margin:0 0 8px">Esta es la agenda real que consultan los bots de WhatsApp e Instagram: solo ofrecen los bloques libres y cada reunión toma un candado (nadie más puede quedar a esa hora). Clic en una hora libre la bloquea; en una bloqueada, la libera; en una reunión, la gestiona.</p>
        <div class="row" style="align-items:flex-start"><span>${tip('Jornada', 'Horario en que el bot puede ofrecer reuniones, por día de la semana. Clic en un día para cambiarlo; vacío lo deja libre.')}</span>
          <span style="text-align:right;max-width:72%">${horarioTags}</span></div>
        <div class="row"><span>${tip('Antelación mínima', 'El bot no ofrece horas que empiecen antes de este margen desde ahora: te protege de reuniones que aparecen encima.')}</span>
          <span class="v">${cfg.antelacionMin} min <button class="mini" onclick="opsAgendaNum('antelacionMin')">cambiar</button>
          · ${tip('duración', 'Largo de cada bloque de reunión. Cambiarlo re-dibuja la grilla; los candados ya tomados no se mueven.')} ${cfg.duracionMin} min <button class="mini" onclick="opsAgendaNum('duracionMin')">cambiar</button></span></div>
        <div style="border-top:1px solid var(--hairline);margin-top:6px;padding-top:4px">${grilla}</div>
        ${(v.reuniones || []).length ? `<div style="border-top:1px solid var(--hairline);margin-top:6px;padding-top:8px">
          <p class="muted" style="margin:0 0 4px">Próximas reuniones</p>
          ${v.reuniones.map(r => `<div class="loc">
            <span class="dot on"></span>
            <strong>${r.nombre || '···' + String(r.contacto).slice(-4)}</strong>
            <span class="muted">${[r.negocio, r.rubro, r.comuna].filter(Boolean).join(' · ') || 'sin datos'} · ${canalG(r.canal)} ${r.canal === 'instagram' ? 'Instagram' : 'WhatsApp'}</span>
            <span style="margin-left:auto;font-size:12px;color:var(--lima);font-weight:700">🗓 ${r.hablada} · ${r.hora}</span>
            <span class="sub2">${r.notas ? '📝 ' + r.notas + ' · ' : ''}
              ${/^\d+$/.test(String(r.contacto)) ? `<a href="https://wa.me/${r.contacto}" target="_blank" style="color:var(--accent);text-decoration:none">abrir chat ↗</a> · ` : ''}
              <button class="mini" onclick="opsAgendaReunion('${r.contacto}','realizada')">reunión hecha</button>
              <button class="mini danger" onclick="opsAgendaReunion('${r.contacto}','cancelar')">cancelar</button>
            </span>
          </div>`).join('')}
        </div>` : ''}
      </div>`;
    }
    async function _agSet(fn, payload, confirmMsg){
      if (confirmMsg && !confirm(confirmMsg)) return;
      try { await _fn(fn)(payload); await refrescarVentas(); }
      catch(e){ alert('Error: ' + (e.message || e)); }
    }
    function opsAgendaSlot(fecha, hora, estado, contacto){
      if (estado === 'libre') return _agSet('ventasAgendaBloquear', { fecha, hora, bloquear: true },
        `¿Bloquear el ${fecha} a las ${hora}?\nEl bot dejará de ofrecer esa hora al instante.`);
      if (estado === 'bloqueado') return _agSet('ventasAgendaBloquear', { fecha, hora, bloquear: false },
        `¿Liberar el ${fecha} a las ${hora}?\nEl bot podrá volver a ofrecerla.`);
      if (estado === 'reunion') {
        const r = ((_agVentas && _agVentas.reuniones) || []).find(x => x.contacto === contacto) || {};
        return _agSet('ventasAgendaReunionEstado', { contacto, accion: 'cancelar' },
          `Reunión: ${r.nombre || contacto}${r.negocio ? ' · ' + r.negocio : ''}\n${r.hablada || fecha} a las ${hora}.\n\n¿CANCELARLA y liberar la hora? (al lead no se le avisa solo: escríbele tú)`);
      }
    }
    function opsAgendaDia(fecha, bloquear){
      _agSet('ventasAgendaBloquear', { fecha, bloquear }, bloquear
        ? `¿Cerrar TODO el ${fecha}? Se bloquean las horas libres; las reuniones ya tomadas no se tocan.`
        : `¿Reabrir el ${fecha}? Se quitan tus bloqueos de ese día.`);
    }
    function opsAgendaReunion(contacto, accion){
      _agSet('ventasAgendaReunionEstado', { contacto, accion }, accion === 'cancelar'
        ? '¿Cancelar la reunión y liberar la hora? (al lead no se le avisa solo: escríbele tú)'
        : '¿Marcar la reunión como realizada?');
    }
    function opsAgendaToggle(){
      const on = _agVentas && _agVentas.cfg && _agVentas.cfg.activo;
      _agSet('ventasAgendaConfigSet', { activo: !on }, on
        ? 'Pausar la agenda: el bot deja de ofrecer horas y vuelve a solo registrar el interés. ¿Confirmas?'
        : 'Abrir la agenda: el bot vuelve a ofrecer y reservar horas reales. ¿Confirmas?');
    }
    function opsAgendaNum(campo){
      const actual = (_agVentas && _agVentas.cfg && _agVentas.cfg[campo]) || '';
      const raw = prompt(campo === 'duracionMin'
        ? 'Duración de cada reunión en minutos (15–120):'
        : 'Antelación mínima en minutos (0–1440): el bot no ofrece horas más encima que esto.', actual);
      if (raw === null || !String(raw).trim()) return;
      _agSet('ventasAgendaConfigSet', { [campo]: Number(raw) });
    }
    function opsAgendaHorario(d){
      const r = (_agVentas && _agVentas.cfg && _agVentas.cfg.horario && _agVentas.cfg.horario[d]) || null;
      const raw = prompt(`Jornada del ${AG_DIAS[d]} (formato HH:MM-HH:MM, vacío = día libre):`, r ? `${r[0]}-${r[1]}` : '');
      if (raw === null) return;
      const t = String(raw).trim();
      if (!t) return _agSet('ventasAgendaConfigSet', { horario: { [String(d)]: null } });
      const m = t.match(/^(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})$/);
      if (!m) { alert('Formato inválido: usa HH:MM-HH:MM (ej: 10:00-19:00) o deja vacío.'); return; }
      _agSet('ventasAgendaConfigSet', { horario: { [String(d)]: [m[1].padStart(5, '0'), m[2].padStart(5, '0')] } });

    const LEAD_ESTADOS = {

            <span class="sub2">${l.reunionFecha

              : '📅 ' + ([l.diaPreferido, l.franja].filter(Boolean).join(' · ') || 'sin preferencia')}${l.notas ? ' · 📝 ' + l.notas : ''} · hace ${hace(l.actualizado)} ·
              <a href="https://wa.me/${l.telefono}" target="_blank" style="color:var(--accent);text-decoration:none">abrir chat ↗</a>
              ${l.estado==='reunion_solicitada' ? `· <button class="mini" onclick="opsLeadEstado('${l.telefono}','confirmada')">confirmé hora</button>` : ''}
              ${l.estado==='confirmada' ? `· <button class="mini" onclick="opsLeadEstado('${l.telefono}','realizada')">reunión hecha</button>` : ''}
              ${l.estado!=='descartado' && l.estado!=='realizada' ? `· <button class="mini danger" onclick="opsLeadEstado('${l.telefono}','descartado')">descartar</button>` : ''}
            </span>
          </div>`; }).join('')
        : '<p class="muted">Aún no hay capturas. Cuando un lead acepte la reunión, el bot lo registra aquí y te llega un WhatsApp (chat contigo mismo).</p>'}
      </div>`;
    }
    async function opsLeadEstado(tel, estado){

    /* ── ⚙️ Gestión del agente de ventas ──────────────────────────────────

        <div class="row"><span>Respuestas hoy</span><span class="v tnum">${v.respHoy} <span class="muted">/ ${v.topeChip} del número · ${v.topeChat} por chat</span></span></div>
        <div class="row"><span>Sala de Meet</span>

            <button class="mini" onclick="opsBotMeet()">cambiar</button></span></div>
        <div class="row" style="align-items:flex-start"><span>Gatillos</span>
          <span style="text-align:right;max-width:70%">
            <span class="tag">expovino (fijo)</span> <span class="tag">agenda online (fijo)</span>
            ${(v.activadores||[]).map((a,i) => `<span class="tag" style="margin:2px">${a} <a href="#" onclick="opsBotActDel(${i});return false" style="color:var(--red);text-decoration:none">✕</a></span>`).join(' ')}
            <button class="mini" onclick="opsBotActAdd()">+ agregar</button>

        <div style="border-top:1px solid var(--hairline);margin-top:6px;padding-top:8px">
          <p class="muted" style="margin:0 0 4px">Chats del agente (últimos 15)</p>
          ${(v.convs||[]).length ? v.convs.map(c => `

              <strong>${c.nombre || '····' + c.telefono.slice(-4)}</strong>

              <span style="margin-left:auto">
                ${c.turnos.length ? `<button class="mini" onclick="verChatVentas('${c.telefono}')">ver</button>` : ''}
                <button class="mini ${c.silenciado?'':'danger'}" onclick="opsBotChat('${c.telefono}', ${c.silenciado ? 'false' : 'true'})">${c.silenciado ? 'soltar al bot' : 'pausar 4h'}</button>
                <a href="https://wa.me/${c.telefono}" target="_blank" style="color:var(--accent);font-size:11px;text-decoration:none">chat ↗</a>

    async function _botSet(payload, confirmMsg){
      if (confirmMsg && !confirm(confirmMsg)) return;

    function opsBotToggle(){

      _botSet({ ventasBot: !on }, on
        ? 'Apagar el agente: los mensajes con gatillo quedarán SIN respuesta automática. ¿Confirmas?'
        : 'Encender el agente de ventas. ¿Confirmas?');
    }
    function opsBotMeet(){

    /* ── 💰 Cobranza: la libreta de números de cobro ─────────────────────

        `<span style="font-size:11px;color:var(--muted)">${glyphCanal(k)} ${n}</span>`).join(' · ') || '<span class="muted" style="font-size:11px">—</span>';
      const pctOk = totales.total > 0
        ? Math.round(100 * (totales.total - totales.fallidos) / totales.total)
        : null;

      return `<div class="panel" style="margin-top:14px">
        <h3>💰 Cobranza · números de cobro
          <span class="tag ${conWa ? 'g' : ''}">${conWa}/${rows.length} con WhatsApp</span>

          <div>
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:3px">Avisos enviados</div>

            ${totales.fallidos > 0 ? `<div style="font-size:11px;color:var(--red)">${totales.fallidos} sin canal</div>` : ''}
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:3px">Costo total</div>
            <div style="font-size:20px;font-weight:800">${clp(totales.costoClp || 0)}</div>
            <div style="font-size:11px;color:var(--muted)">CLP · estimado</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:3px">Entrega</div>
            <div style="font-size:20px;font-weight:800;color:${pctOk === null ? 'var(--muted)' : pctOk >= 90 ? 'var(--green)' : pctOk >= 70 ? 'var(--amber, #fbbf24)' : 'var(--red)'}">${pctOk === null ? '—' : pctOk + '%'}</div>
            <div style="font-size:11px;color:var(--muted)">canal ok</div>
          </div>
          <div>
            <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:3px">Mix de canales</div>
            <div style="font-size:14px;font-weight:600;line-height:1.5">${canalMix}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:2px">📲 oficial · 💬 chip · 🔔 push · ✉️ email</div>
          </div>
        </div>

        ${rows.length ? rows.map(r => {
          // Chip de "último aviso": verde ✓ / rojo ⛔ / gris "sin envíos".
          const a = r.avisos || {};
          const chipUltimo = (() => {
            if (!a.ultimoCanal && a.total === 0) return `<span class="muted" style="font-size:11px">sin envíos</span>`;
            if (a.ultimoOk === false) return `<span style="font-size:11px;color:var(--red);font-weight:700">⛔ falló ${a.ultimoAt || ''}</span>`;
            return `<span style="font-size:11px;color:var(--green);font-weight:700">✓ ${glyphCanal(a.ultimoCanal)} ${a.ultimoAt || ''}</span>`;
          })();
          const contadores = a.total > 0
            ? `<span class="muted" style="font-size:11px">${a.total} envío${a.total === 1 ? '' : 's'}${a.costoClp ? ' · ' + clp(a.costoClp) : ''}</span>`
            : '';
          return `
          <div class="loc" style="flex-wrap:wrap;row-gap:4px">
            <span class="dot ${r.diasAtraso > 0 ? 'warn' : (r.whatsappCobro ? 'on' : 'off')}"></span>
            <strong>${r.nombre}</strong>
            <span class="muted">${clp(r.montoConIva)} c/IVA · ${r.diasAtraso > 0
              ? '<span style="color:var(--red)">venció hace ' + r.diasAtraso + ' d</span>'
              : 'vence ' + (r.vence || '—')}${r.autopay ? ' · autopay: ' + r.autopay : ''}</span>
            <span style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end">
              ${chipUltimo}
              ${contadores}
              ${r.whatsappCobro
                ? `<span style="font-size:12px;color:var(--green)">📱 ${fmtTel(r.whatsappCobro)}</span>`

    }

    async function opsAsignar(tenantId, chipId, activo){

    async function opsDesvincularChip(chipId){
      if (!confirm('Vas a cerrar la sesión del chip "' + chipId + '".\n\nLos locales asignados a EL dejan de recibir confirmaciones.')) return;
      const fn = _fn('plataformaDesvincular');
      try { await fn({ chipId }); }
      catch(e){
        // La CF frena si el chip todavía atiende locales: quedarse sin número
        // no falla en ninguna parte, simplemente se quedan mudos.
        if (e.code === 'functions/failed-precondition'){
          if (!confirm(e.message + '\n\n¿Desvincular igual?')) return;
          try { await fn({ chipId, confirmado: true }); }
          catch(e2){ alert('Error: ' + e2.message); return; }
        } else { alert('Error: ' + e.message); return; }
      }
      await refrescarChips();
    }

    /* QR de vinculación. `chipId` null = chip nuevo (lo pide). */
    async function opsVincularChip(chipId){
      let nombre = null;
      if (!chipId){
        const raw = prompt('Identificador del chip nuevo (minúsculas, sin espacios).\nEj: "sion" si es el chip dedicado a Sion.\n\nSe usa en las rutas internas y no se puede cambiar después.');
        if (raw === null) return;
        chipId = String(raw).trim().toLowerCase();
        if (!/^[a-z0-9][a-z0-9_-]{1,23}$/.test(chipId)){
          alert('Identificador inválido: minúsculas, números, guion o guion bajo (2 a 24 caracteres).');
          return;
        }
        nombre = prompt('Nombre para mostrar (opcional)', 'Chip ' + chipId) || null;
      }

      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.93);display:flex;align-items:center;justify-content:center;padding:16px';
      ov.innerHTML = '<div style="background:#0f172a;border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:22px;max-width:340px;width:100%;text-align:center">'
        + '<p id="q-t" style="font-weight:700;margin:0 0 10px">Generando QR…</p>'
        + '<div id="q-qr" style="min-height:220px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px">Conectando con el VPS…</div>'
        + '<p id="q-s" class="muted" style="font-size:11px;margin:10px 0 0">WhatsApp → Dispositivos vinculados → Vincular dispositivo</p>'
        + '<button id="q-x" style="margin-top:12px;width:100%">Cerrar</button></div>';
      document.body.appendChild(ov);
      let vivo = true;
      const cerrar = () => { vivo = false; ov.remove(); cargar(); };
      ov.querySelector('#q-x').onclick = cerrar;

      try {
        const r = await _fn('plataformaVincular')({ chipId, nombre });
        const qr = r.data && r.data.qr;
        ov.querySelector('#q-t').textContent = 'Escanea con el chip';
        ov.querySelector('#q-qr').innerHTML = qr
          ? '<img src="' + qr + '" alt="QR" style="width:100%;max-width:240px;border-radius:8px;background:#fff;padding:8px">'
          : '<span style="color:#f87171">El VPS no devolvió QR. Reintenta.</span>';

        // El QR caduca solo: se sondea hasta que la sesión quede abierta.
        const estado = _fn('plataformaEstado');
        for (let i = 0; i < 60 && vivo; i++){
          await new Promise(res => setTimeout(res, 3000));
          if (!vivo) return;
          try {
            const e = await estado({ chipId });
            if (e.data && e.data.estado === 'open'){
              ov.querySelector('#q-t').textContent = '✅ Chip vinculado';
              ov.querySelector('#q-qr').innerHTML = '<span style="color:#4ade80;font-size:44px">✓</span>';
              ov.querySelector('#q-s').textContent = 'Ahora asígnale los locales que va a atender.';
              setTimeout(cerrar, 1600);
              return;
            }
          } catch(_){}
        }
      } catch(e){
        ov.querySelector('#q-t').textContent = 'Error';
        ov.querySelector('#q-qr').innerHTML = '<span style="color:#f87171;font-size:12px">' + e.message + '</span>';
      }
    }

    /** Saludo del encabezado. Va en hora de Chile y no la del navegador: el
     *  panel se mira desde donde sea, pero la operación pasa acá. */
    function saludo(){
      const h = Number(new Intl.DateTimeFormat('es-CL', {
        timeZone: 'America/Santiago', hour: '2-digit', hour12: false,
      }).format(new Date()));
      const momento = h < 12 ? 'Buenos días' : h < 20 ? 'Buenas tardes' : 'Buenas noches';
      const u = firebase.auth().currentUser;
      const nombre = ((u && u.email) || '').split('@')[0].split(/[._]/)[0];
      return nombre ? `${momento}, ${nombre.charAt(0).toUpperCase()}${nombre.slice(1)}` : momento;
    }

              const em = data.email;

              const cap  = ids => ids.reduce((t,i) => t + (em.canales.find(c=>c.id===i)?.capDia||0), 0);
              const CITAS = ['brevo_sy','brevo_bioo'], OTROS = ['resend_sy','resend_bioo'];
              const kpi = (n,c,k) => `<div class="kpi"><div class="n tnum">${num(n)}<span style="font-size:15px;color:var(--soft)">/${num(c)}</span></div><div class="k">${k}</div></div>`;
              return `<div class="kpis">
                ${kpi(suma(CITAS), cap(CITAS), 'Citas · hoy (Brevo ×2)')}
                ${kpi(suma(OTROS), cap(OTROS), 'Interno y bioo · hoy')}
                <div class="kpi"><div class="n tnum">${num(em.mes.total)}</div><div class="k">Correos del mes</div></div>
                <div class="kpi"><div class="n tnum">${num(em.mes.proyeccion)}</div><div class="k">Proyección de cierre</div></div>
              </div>`;
            })() : ''}
            ${emailPanel(data.email)}
          </section>

          <section class="sec" data-sec="sushi">
            ${proyectoPanel('🍣 SushiPro / conexion', data.sushipro, data.mesActual)}
            ${data.sushiError ? `<div class="warn">SushiPro no respondió (${data.sushiError}). Se muestra solo barbería. Verifica OPS_TOKEN + dominio del endpoint.</div>` : ''}
          </section>

          <section class="sec" data-sec="probar">
            <div class="panel">
              <h3>🧪 Probar el asistente</h3>
              <p class="muted" style="margin:0 0 12px;font-size:12px">
                Conversa con el bot como si fueras un cliente. Corre el cerebro real —mismo prompt, catálogo y
                horas del local— pero <strong>no manda WhatsApp ni crea citas</strong>: agendar valida todo y se
                salta solo la escritura. Abajo de cada respuesta se ve qué herramientas consultó.
              </p>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
                <label class="muted" style="font-size:12px">Local:</label>
                <select id="sim-tid" style="background:var(--glass);color:#fff;border:1px solid var(--glass-border);border-radius:8px;padding:6px 10px;font-size:12.5px">
                  <option value="delnero">delnero (sandbox)</option>
                  ${(((data.barberia || {}).locales) || []).map(l => l.id).filter(Boolean).filter(t => t !== 'delnero')
                    .map(t => `<option value="${t}">${t}${'' }</option>`).join('')}
                </select>
                <button class="mini" id="sim-reset">Empezar de nuevo</button>
                <span class="muted" id="sim-cuota" style="font-size:11px;margin-left:auto"></span>
              </div>
              <div id="sim-chat" style="max-height:46vh;overflow-y:auto;margin-bottom:10px"></div>
              <form id="sim-form" style="display:flex;gap:8px">
                <input id="sim-txt" autocomplete="off" placeholder="Hola, ¿tienen hora para hoy?" maxlength="500"
                  style="flex:1;background:var(--glass);color:#fff;border:1px solid var(--glass-border);border-radius:10px;padding:9px 12px;font-size:13px">
                <button type="submit" class="mini" id="sim-send">Enviar</button>
              </form>
            </div>
          </section>
        </div>
        </main>
        </div>`;
      // ── Pestañas: recordar dónde estaba (sobrevive al Actualizar) ──
      const setTab = (n) => {
        try { localStorage.setItem('opsTab', n); } catch(_){}
        document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === n));
        document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.dataset.sec === n));
        // Leaflet no sabe medirse dentro de display:none: la pestaña se
        // llena (y el mapa se levanta) recién cuando queda visible.
        if (n === 'prospeccion') prosPintar();
        // Crecimiento es caro (cruza _billing + snapshots): se carga la
        // primera vez que se abre, no en cada pintado.
        if (n === 'crecimiento' && !ESTADO.crecimiento) cargarCrecimiento();
        if (n === 'plataforma' && !ESTADO.plataforma) cargarPlataforma();
      };
      window._setTab = setTab;
      document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
      montarSimulador();
      let tabIni = 'resumen';
      try { tabIni = localStorage.getItem('opsTab') || 'resumen'; } catch(_){}
      if (!document.querySelector('.sec[data-sec="' + tabIni + '"]')) tabIni = 'resumen';
      setTab(tabIni);

      document.getElementById('refresh').onclick = () => cargar(true);
      document.getElementById('out').onclick = () => firebase.auth().signOut();
      const bAds = document.getElementById('adsRefresh');
      if (bAds) bAds.onclick = () => refrescarAds(bAds);
      bindInstagram();

      // ── Kill switch ──
      // Solo apaga, nunca enciende: encender es una decisión deliberada que
      // pasa por el panel del local. Acá el botón va en una sola dirección,
      // que es la que no se puede equivocar a las 3 de la mañana.
      document.getElementById('panic').onclick = async () => {
        if(!confirm('Apagar bot Y confirmaciones en TODOS los locales.\n\nSe vuelve a encender uno por uno desde el panel de cada local. ¿Confirmas?')) return;
        await kill({ alcance:'global', que:'todo' });
      };
      document.querySelectorAll('[data-kill]').forEach(b => {
        b.onclick = async () => {
          const tid = b.dataset.kill;
          if(!confirm(`Apagar bot y confirmaciones de ${tid}?`)) return;
          await kill({ alcance:'tenant', tenantId:tid, que:'todo' });
        };
      });
      document.querySelectorAll('[data-ver]').forEach(b => {
        b.onclick = () => verChats(b.dataset.ver);
      });
    }

    async function kill(payload){
      try{
        const fn = firebase.app().functions('us-central1').httpsCallable('opsKillSwitch');
        const r = await fn(payload);
        alert(`Listo: ${r.data.apagados} local(es) apagado(s).`);
        cargar();
      }catch(e){ alert('No se pudo apagar: ' + (e.message||e)); }
    }

    // ── Sandbox de chat con la IA (pestaña "Probar IA") ────────────────
    // Reusa el callable `waSimularBot` que ya usa el panel del local. Desde
    // ops se le puede pasar `tenantId` porque el caller es bootstrap admin,
    // así que sirve para probar CUALQUIER local — por defecto `delnero`, que
    // es el sandbox oficial de la plataforma.
    //
    // El historial vive solo en esta pestaña: es una prueba, no una
    // conversación que haya que persistir.
    function montarSimulador(){
      const form = document.getElementById('sim-form');
      if (!form) return;
      const caja = document.getElementById('sim-chat');
      const txt  = document.getElementById('sim-txt');
      const send = document.getElementById('sim-send');
      const sel  = document.getElementById('sim-tid');
      const cuota= document.getElementById('sim-cuota');
      let historial = [];

      const esc = (s) => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      const pinta = (rol, texto, tools) => {
        const d = document.createElement('div');
        d.className = 'msg ' + (rol === 'user' ? 'user' : 'assistant');
        d.innerHTML = (rol === 'user' ? '👤 ' : '🤖 ') + esc(texto)
          + (tools && tools.length ? `<div class="muted" style="font-size:10.5px;margin-top:5px">🔧 ${esc(tools.join(' · '))}</div>` : '');
        caja.appendChild(d);
        caja.scrollTop = caja.scrollHeight;
        return d;
      };

      const reiniciar = () => { historial = []; caja.innerHTML = ''; cuota.textContent = ''; };
      document.getElementById('sim-reset').onclick = reiniciar;
      sel.onchange = reiniciar;   // otro local = otra conversación

      form.onsubmit = async (e) => {
        e.preventDefault();
        const mensaje = txt.value.trim();
        if (!mensaje) return;
        txt.value = '';
        pinta('user', mensaje);
        historial.push({ role: 'user', content: mensaje });
        const esperando = pinta('assistant', 'escribiendo…');
        send.disabled = true;
        try {
          const r = await _fn('waSimularBot')({
            tenantId: sel.value, texto: mensaje,
            historial: historial.slice(0, -1),   // el turno actual va en `texto`
          });
          const d = r.data || {};
          esperando.remove();
          if (d.ok === false) {
            pinta('assistant', '⚠️ ' + (d.motivo || 'No se pudo simular.'));
            historial.pop();
          } else {
            pinta('assistant', d.respuesta, d.herramientas);
            historial.push({ role: 'assistant', content: d.respuesta });
            if (typeof d.pruebasRestantes === 'number') {
              cuota.textContent = `${d.pruebasRestantes} pruebas restantes hoy en este local`;
            }
          }
        } catch (err) {
          esperando.remove();
          pinta('assistant', '⚠️ ' + (err.message || err));
          historial.pop();
        } finally {
          send.disabled = false;
          txt.focus();
        }
      };
    }

    // Visor de conversaciones: el primer fin de semana la pregunta no es
    // cuántos mensajes salieron, sino si el bot está respondiendo bien.
    async function verChats(tid){
      const wrap = document.createElement('div');
      wrap.className = 'modal';
      wrap.innerHTML = `<div class="box"><p class="muted">Cargando conversaciones de ${tid}…</p></div>`;
      wrap.onclick = e => { if(e.target===wrap) wrap.remove(); };
      document.body.appendChild(wrap);
      try{
        const fn = firebase.app().functions('us-central1').httpsCallable('opsConversaciones');
        const r = await fn({ tenantId: tid, limit: 8 });
        const cs = r.data.conversaciones || [];
        wrap.querySelector('.box').innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0;font-size:14px">Últimas conversaciones · ${tid}</h3>
            <button class="mini" id="cerrar">Cerrar</button>
          </div>
          ${cs.length ? cs.map(c => `
            <div class="chat">
              <div class="meta">${c.chat}${c.nombre?` · ${c.nombre}`:''} · ${c.respHoy} resp. hoy${c.silenciado?' · 🔇 en pausa':''}${c.pendiente?` · ⏳ cita ${c.pendiente}`:''} · ${(c.turnos||[]).length} turnos</div>
              <div style="max-height:50vh;overflow-y:auto">
                ${(c.turnos||[]).map(t => `<div class="msg ${t.rol}">${t.rol==='user'?'👤':'🤖'} ${String(t.texto).replace(/</g,'&lt;')}</div>`).join('')}
              </div>
            </div>`).join('') : '<p class="muted">Sin conversaciones todavía.</p>'}`;
        wrap.querySelector('#cerrar').onclick = () => wrap.remove();
      }catch(e){
        wrap.querySelector('.box').innerHTML = `<p style="color:var(--red)">${e.message||e}</p><button class="mini" onclick="this.closest('.modal').remove()">Cerrar</button>`;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       CARGA EN DOS OLAS

       Antes: 5 callables en paralelo y el panel en blanco hasta que volvía
       la más lenta — `opsMetrics` recorre 36 locales haciendo ~600 lecturas,
       así que eran 3-8 s de "Cargando métricas…". Peor: cada acción del
       panel llamaba a `cargar()` de nuevo, así que marcar UN lead pagaba esa
       cuenta completa otra vez.

       Ahora:
         Ola 1 — `opsSnapshot`: UNA lectura de un doc que el cron dejó
                 masticado. Trae métricas + Meta Ads y pinta al toque.
         Ola 2 — las tres callables baratas (leads, bot, cobranza), en
                 paralelo y SIN bloquear el pintado. Cuando llegan, repintan
                 solo su sección.

       Y las mutaciones ya no recargan nada global: refrescan su propia
       sección. Ver `repintar()`.
       ═══════════════════════════════════════════════════════════════════ */
    const ESTADO = {
      metrics:null, metaAds:null, instagram:null, chips:null,
      ventas:null, botCfg:null, cobranza:null, prospeccion:null, crecimiento:null,
      plataforma:null, plataformaTenants:null,
      edadSegundos:0, parcial:false, cargando:false,
    };

    /** Cuán viejo es el dato que se está mirando. Se dice siempre: el panel
     *  sirve un snapshot, y fingir que es de este instante sería mentir en
     *  lo único que hace confiable a un tablero de operaciones. */
    function frescuraHtml(){
      if (ESTADO.cargando) return '<span class="fresh cargando"><span class="p"></span>actualizando…</span>';
      const s = ESTADO.edadSegundos || 0;
      const txt = s < 90 ? 'recién' : s < 3600 ? `hace ${Math.round(s/60)} min` : `hace ${Math.round(s/3600)} h`;
      // Sobre 15 min el cron se saltó al menos dos vueltas: vale la pena avisar.
      return `<span class="fresh ${s > 900 ? 'viejo' : ''}"><span class="p"></span>datos de ${txt}</span>`;
    }

    function seccionVentas(){
      if (!ESTADO.ventas && !ESTADO.botCfg && !ESTADO.agendaVentas) return '<p class="muted">Cargando leads…</p>';
      return (ESTADO.agendaVentas ? agendaVentasPanel(ESTADO.agendaVentas) : '<p class="muted">Cargando tu agenda…</p>')
           + (ESTADO.ventas ? leadsPanel(ESTADO.ventas) : '<p class="muted">No se pudo cargar el módulo de leads.</p>')
           + (ESTADO.botCfg ? botVentasPanel(ESTADO.botCfg) : '');
    }
    function seccionCobranza(){
      if (!ESTADO.cobranza) return '<p class="muted">Cargando cobranza…</p>';
      return cobranzaPanel(ESTADO.cobranza);
    }

    /* ═══ Crecimiento: la salud económica (solo Ignacio) ═══
       Cruza ingresos y costos que ya vivían en silos. Cada número dice si es
       MEDIDO o ESTIMADO — un LTV al arrancar es proyección, no un hecho. */
    function seccionCrecimiento(){
      const C = ESTADO.crecimiento;
      if (C === 'denegado') return '<div class="panel"><p class="muted">Estos números son solo para Ignacio.</p></div>';
      if (!C) return '<p class="muted"><span class="fresh cargando"><span class="p"></span>cruzando ingresos y costos…</span></p>';
      return crecimientoPanel(C);
    }

    const clp0 = (n) => '$' + Math.round(Number(n)||0).toLocaleString('es-CL');
    function crecimientoPanel(C){
      const i = C.ingresos||{}, co = C.costos||{}, u = C.unidad||{}, ca = C.caja||{}, re = C.retencion||{}, me = C.meta||{};
      // Tarjeta estrella con semáforo por umbral.
      const estrella = (titulo, valor, sub, nivel, explica) => {
        const col = nivel === 'ok' ? 'var(--brand)' : nivel === 'alerta' ? '#f0b429' : nivel === 'mal' ? '#e0645c' : 'var(--soft)';
        return `<div style="border:1px solid var(--glass-border);border-top:2px solid ${col};border-radius:12px;padding:14px 16px;flex:1;min-width:170px">
          <div class="muted" style="font-size:11.5px;margin-bottom:6px">${tip(titulo, explica)}</div>
          <div class="tnum" style="font-size:30px;font-weight:700;color:${col};line-height:1">${valor}</div>
          <div class="muted" style="font-size:11px;margin-top:5px">${sub}</div>
        </div>`;
      };
      const ltvCacNivel = u.ltvCac == null ? '' : u.ltvCac >= 3 ? 'ok' : u.ltvCac >= 1.5 ? 'alerta' : 'mal';
      const margenNivel = u.margenBrutoPct == null ? '' : u.margenBrutoPct >= 70 ? 'ok' : u.margenBrutoPct >= 50 ? 'alerta' : 'mal';
      const runwayNivel = ca.rentable ? 'ok' : ca.runwayMeses == null ? '' : ca.runwayMeses > 6 ? 'ok' : ca.runwayMeses >= 3 ? 'alerta' : 'mal';
      const churnNivel  = re.churnPct == null ? '' : re.churnPct <= 5 ? 'ok' : re.churnPct <= 10 ? 'alerta' : 'mal';

      const estrellas = `<div style="display:flex;gap:10px;flex-wrap:wrap">
          ${estrella('MRR (ingreso recurrente)', clp0(i.mrrClp), `${i.clientesPagando||0} pagando · ARPU ${clp0(i.arpuClp)}`, i.mrrClp>0?'ok':'', 'Ingreso recurrente mensual NETO (sin IVA), sumando el plan de cada cliente activo. Es la base de todo lo demás. MEDIDO desde _billing.')}
          ${estrella('LTV : CAC', u.ltvCac!=null ? u.ltvCac+':1' : '—', u.cacClp!=null?`gana ${clp0(u.ltvClp)} · cuesta ${clp0(u.cacClp)}`:'faltan clientes nuevos', ltvCacNivel, 'Cuánto genera un cliente en toda su vida vs cuánto cuesta traerlo. Sano ≥3:1. Al arrancar es normal estar bajo — mira la TENDENCIA. LTV es ESTIMADO (usa vida supuesta hasta tener churn real).')}
          ${estrella('Margen bruto', u.margenBrutoPct!=null ? u.margenBrutoPct+'%' : '—', `quedan tras costo directo`, margenNivel, 'Qué % de cada peso queda tras los costos que escalan con el uso (IA + WhatsApp). Un SaaS sano ronda 70-85%. MEDIDO, salvo costos fijos que cargas tú.')}
          ${estrella('Runway', ca.rentable ? '∞' : ca.runwayMeses!=null ? ca.runwayMeses+' meses' : '—', ca.rentable?'ya es rentable 🎉':`quemas ${clp0(ca.burnMensualClp)}/mes`, runwayNivel, 'Meses de operación que te quedan al ritmo de gasto actual = caja ÷ burn. Necesita que cargues tu caja disponible (solo tú la sabes).')}
          ${estrella('Retención', re.retencionPct!=null ? re.retencionPct+'%' : 'sin base aún', re.churnPct!=null?`churn ${re.churnPct}% · ${re.perdidos||0} bajas`:'se mide desde el 2º mes', churnNivel, 'Qué % de clientes conservas mes a mes. Crecer con churn alto es llenar un balde pinchado. Se calcula comparando con el mes anterior — el primer mes no tiene base.')}
        </div>`;

      // Termómetro de la meta del mes.
      const barra = (logrado, objetivo, label) => {
        if (!objetivo) return `<div style="flex:1;min-width:200px"><div class="muted" style="font-size:11.5px">${label}: <b class="tnum">${logrado}</b> <span style="font-size:10.5px">(sin meta fijada)</span></div></div>`;
        const pct = Math.min(100, Math.round(logrado/objetivo*100));
        return `<div style="flex:1;min-width:200px">
          <div style="display:flex;justify-content:space-between;font-size:11.5px" class="muted"><span>${label}</span><span><b class="tnum" style="color:var(--brand)">${logrado}</b> / ${objetivo}</span></div>
          <div class="pros-barra" style="height:8px;margin-top:5px"><span style="width:${pct}%"></span></div>
        </div>`;
      };
      const meta = `<div class="panel" style="margin-top:14px">
          <h3>🎯 ${tip('Meta del mes ('+C.mes+')', 'El avance del mes contra el objetivo que fijaste. Las reuniones son el indicador adelantado: si llegan, los clientes vienen detrás.')}</h3>
          <div style="display:flex;gap:20px;flex-wrap:wrap;margin-top:8px">
            ${barra(me.reuniones?.logrado||0, me.reuniones?.objetivo, '🤝 Reuniones agendadas')}
            ${barra(me.clientes?.logrado||0, me.clientes?.objetivo, '⭐ Clientes nuevos')}
          </div>
        </div>`;

      // Ingresos y costos lado a lado.
      const fila = (lbl, val, gris) => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--hairline);font-size:12.5px"><span class="${gris?'muted':''}">${lbl}</span><span class="tnum">${val}</span></div>`;
      const planLbl = { basico:'Básico', pro:'Pro', full:'Full', anual:'Anual' };
      const desglose = `<div style="display:flex;gap:14px;flex-wrap:wrap">
          <div class="panel" style="flex:1;min-width:280px;margin-top:14px">
            <h3>💵 ${tip('Ingresos del mes', 'De dónde viene el MRR: clientes pagando por plan, más trials que aún no pagan.')}</h3>
            ${fila('MRR neto', clp0(i.mrrClp))}
            ${Object.entries(i.porPlan||{}).map(([p,n]) => fila('· '+(planLbl[p]||p), n+' clientes', true)).join('')}
            ${fila('Al día', i.clientesAlDia||0, true)}
            ${fila('Atrasados', i.clientesAtrasados||0, true)}
            ${fila('En trial (aún no pagan)', i.clientesTrial||0, true)}
            ${fila('Nuevos este mes', i.nuevosMes||0)}
          </div>
          <div class="panel" style="flex:1;min-width:280px;margin-top:14px">
            <h3>💸 ${tip('Costos del mes', 'Directos (escalan con el uso: IA + WhatsApp) + adquisición (Ads + comisiones) + fijos que cargas tú.')}</h3>
            ${fila('IA (Anthropic)', clp0(co.iaClp), true)}
            ${fila('WhatsApp (Meta)', clp0(co.waClp), true)}
            ${fila('Publicidad (Ads)', clp0(co.adsClp), true)}
            ${fila('Comisiones de venta', clp0(co.comisionesClp), true)}
            ${fila('Costos fijos', clp0(co.fijosClp), true)}
            ${fila('Total', clp0(co.totalClp))}
            ${fila(ca.rentable?'Resultado (rentable)':'Burn (quema)', clp0(Math.abs(ca.burnMensualClp)))}
          </div>
        </div>`;

      const npsFase2 = `<div class="panel" style="margin-top:14px">
          <h3>😊 ${tip('Satisfacción (NPS / PMF)', 'La salud orgánica: qué tan contentos están los dueños. Un NPS alto baja tu CAC futuro por el boca a boca. Requiere encuestarlos — es la fase 2.')}</h3>
          <p class="hint">Todavía no hay encuesta a los dueños de los locales. La fase 2 les manda dos preguntas por su canal (push/WhatsApp): "¿nos recomendarías del 0 al 10?" (NPS) y "¿qué tan decepcionado estarías si SynapTech desapareciera?" (product-market fit). Avísame y la construyo.</p>
        </div>`;

      // Config: lo que solo Ignacio sabe.
      const cfg = C.cfg||{};
      const inp = (id, val, w) => `<input id="${id}" type="number" value="${val||''}" style="background:var(--glass);color:#fff;border:1px solid var(--glass-border);border-radius:8px;padding:6px 10px;font-size:12px;width:${w||'120px'}">`;
      const config = `<div class="panel full" style="margin-top:14px">
          <h3>⚙️ ${tip('Lo que solo tú sabes', 'El sistema calcula solo los ingresos y casi todos los costos. Estos tres números no los puede saber: tu caja en el banco, tus costos fijos (sueldos/arriendo/herramientas) y los supuestos. Actualízalos cuando cambien.')}</h3>
          <p class="hint">Cárgalos una vez y el runway, el margen y el LTV se ajustan solos. El resto se mide del sistema.</p>
          <div style="display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-top:8px">
            <label style="font-size:11.5px" class="muted">💰 Caja disponible<br>${inp('cre-caja', cfg.cajaDisponibleClp, '150px')}</label>
            <label style="font-size:11.5px" class="muted">🏢 Costos fijos / mes<br>${inp('cre-fijos', cfg.costosFijosMensualesClp, '150px')}</label>
            <label style="font-size:11.5px" class="muted">📆 Vida cliente (meses)<br>${inp('cre-vida', cfg.vidaMesesEstimada)}</label>
            <label style="font-size:11.5px" class="muted">🤝 Comisión promedio<br>${inp('cre-comision', cfg.comisionPromedioClp)}</label>
            <label style="font-size:11.5px" class="muted">💵 Tipo cambio USD<br>${inp('cre-usd', cfg.usdClp)}</label>

            <label style="font-size:11.5px" class="muted">🎯 Meta clientes (${C.mes})<br>${inp('cre-meta-cli', cfg.metaClientesMes)}</label>
            <label style="font-size:11.5px" class="muted">🎯 Meta reuniones (${C.mes})<br>${inp('cre-meta-reu', cfg.metaReunionesMes)}</label>
            <button class="mini" onclick="creGuardarMeta(this)">💾 Fijar meta del mes</button>
          </div>
        </div>`;

      return estrellas + meta + desglose + npsFase2 + config;
    }

    async function cargarCrecimiento(){
      try {
        const r = await _fn('opsCrecimiento')({});
        ESTADO.crecimiento = r.data;
      } catch(e){
        ESTADO.crecimiento = (e && /permission/i.test(e.message||'')) ? 'denegado' : null;
        if (ESTADO.crecimiento !== 'denegado') { alert('No pude cargar Crecimiento: ' + (e.message||e)); }
      }
      repintar('crecimiento');
    }
    async function creGuardarCfg(btn){
      const num = (id) => Number((document.getElementById(id)||{}).value)||0;
      const patch = { cajaDisponibleClp:num('cre-caja'), costosFijosMensualesClp:num('cre-fijos'),
        vidaMesesEstimada:num('cre-vida'), comisionPromedioClp:num('cre-comision'), usdClp:num('cre-usd') };
      if (btn){ btn.disabled=true; btn.textContent='⏳'; }
      try { const r = await _fn('opsCrecimientoConfig')({ patch }); ESTADO.crecimiento = r.data; repintar('crecimiento'); }
      catch(e){ alert('Error: '+(e.message||e)); if(btn){btn.disabled=false;btn.textContent='💾 Guardar';} }
    }
    async function creGuardarMeta(btn){
      const C = ESTADO.crecimiento; if (!C) return;
      const cli = Number((document.getElementById('cre-meta-cli')||{}).value)||0;
      const reu = Number((document.getElementById('cre-meta-reu')||{}).value)||0;
      if (btn){ btn.disabled=true; btn.textContent='⏳'; }
      try {
        const r = await _fn('opsCrecimientoConfig')({ patch: { metaClientes:{[C.mes]:cli}, metaReuniones:{[C.mes]:reu} } });
        ESTADO.crecimiento = r.data; repintar('crecimiento');
      } catch(e){ alert('Error: '+(e.message||e)); if(btn){btn.disabled=false;btn.textContent='💾 Fijar meta del mes';} }
    }
    window.creGuardarCfg = creGuardarCfg; window.creGuardarMeta = creGuardarMeta;

    /* ═══ Plataforma: consolidación de /admin en ops (fase 1) ═══
       Bandejas operativas que vivían solo en /admin — soporte, errores del
       sistema, leads inbound y onboarding de cuentas nuevas. Cierra los huecos
       que la auditoría de ops marcó. Admin sigue vivo; esto lo duplica, no lo
       reemplaza todavía. */
    function seccionPlataforma(){
      const P = ESTADO.plataforma;
      if (P === 'denegado') return '<div class="panel"><p class="muted">Sin acceso a la gestión de plataforma.</p></div>';
      if (!P) return '<p class="muted"><span class="fresh cargando"><span class="p"></span>cargando bandejas de plataforma…</span></p>';
      return plataformaPanel(P);
    }

    const PLAT_TIPOS = { sugerencia:{l:'💡 sugerencia',c:'#9CCC3C'}, reclamo:{l:'⚠️ reclamo',c:'#e0645c'}, consulta:{l:'❓ consulta',c:'#f0b429'}, otro:{l:'· otro',c:'var(--soft)'} };
    const PLAT_LEAD = { new:{l:'Nuevo',c:'#67e8f9'}, contactado:{l:'Contactado',c:'#f0b429'}, convertido:{l:'Convertido',c:'#9CCC3C'}, descartado:{l:'Descartado',c:'var(--soft)'} };

    /* HUD estilo district-completion (Spider-Man) con la paleta SynapTech:
       convierte el estado de la plataforma en un "juego de completar". */
    function hudPlataforma(tenants){
      if (!tenants || !tenants.length) return `<div class="hud"><div class="hud-hd"><h3>◤ Plataforma SynapTech</h3></div><p class="muted" style="font-size:12px"><span class="fresh cargando"><span class="p"></span>sincronizando distrito…</span></p></div>`;
      const total = tenants.length;
      const oper = tenants.filter(t => t.operativo !== false && t.status !== 'suspended');
      const conPlan = tenants.filter(t => t.plan);
      const cat = (icono, nombre, hecho, de, hint) => {
        const pct = de ? Math.round(hecho/de*100) : 0;
        const cls = de && hecho>=de ? 'full done' : hecho>0 ? '' : '';
        return { html:`<div class="hud-cat ${cls}" title="${esc(hint||'')}">
            <div class="hud-ico">${icono}</div>
            <div class="hud-cbody">
              <div class="hud-crow"><span class="hud-cname">${nombre}</span><span class="hud-ccount">${hecho}/${de}</span></div>
              <div class="hud-cbar"><span style="width:${pct}%"></span></div>
            </div></div>`, pct };
      };
      const cats = [
        cat('🏢','Locales operativos', oper.length, total, 'Encendidos (no suspendidos en el kill switch).'),
        cat('📡','WhatsApp activo', tenants.filter(t=>t.waPlan).length, total, 'Con un plan de WhatsApp encendido (recordatorios, bot o completo).'),
        cat('🚀','Con plan asignado', conPlan.length, total, 'Tienen un plan de cobro definido en facturación.'),
        cat('💰','Al día con el pago', tenants.filter(t=>t.estadoPago==='al_dia').length, Math.max(1,conPlan.length), 'De los que pagan, cuántos están al día.'),
        cat('📦','Configurados', tenants.filter(t=>t.conContenido).length, total, 'Con contenido real (agenda, equipo o clientes cargados).'),
        cat('📸','Instagram conectado', tenants.filter(t=>t.instagram||t.igConectado).length, total, 'Con su Instagram vinculado a la plataforma.'),
      ];
      const overall = Math.round(cats.reduce((a,c)=>a+c.pct,0)/cats.length);
      // El faltante más grande, como "misión sugerida".
      const faltante = cats.map(c=>({...c})).sort((a,b)=>a.pct-b.pct)[0];
      return `<div class="hud">
          <div class="hud-hd">
            <div><h3>◤ Distrito · Plataforma SynapTech</h3><div class="muted" style="font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;margin-top:2px">completitud del reino</div></div>
            <div style="text-align:right"><div class="hud-pct">${overall}%</div></div>
          </div>
          <div class="hud-track"><span style="width:${overall}%"></span></div>
          ${cats.map(c=>c.html).join('')}
          <div class="hud-foot"><span>▸ ${total} locales en juego</span><span>siguiente misión: <b>${oper.length} operativos</b></span></div>
        </div>`;
    }

      const kpis = `<div class="pros-linea"></div>

      // Errores

          ${errores.length ? `<div style="overflow-x:auto"><table>

            </tr>`).join('')}</tbody></table></div>` : '<p class="muted" style="font-size:12px">✅ Sin errores abiertos.</p>'}
        </div>`;

      // Leads inbound
      const leadsHtml = `<div class="panel" style="margin-top:14px">
          <h3>📥 ${tip('Leads inbound', 'Solicitudes de demo desde empieza.synaptechspa.cl. Distinto de la Prospección saliente: acá te escribieron ellos.')} ${c.leadsNuevos?`<span style="color:var(--brand)">· ${c.leadsNuevos} nuevos</span>`:''}</h3>
          ${leads.length ? leads.slice(0,20).map(l => { const st = PLAT_LEAD[l.status]||PLAT_LEAD.new; const tel = String(l.phone||'').replace(/\D/g,''); const next = l.status==='new'?'contactado':(l.status==='contactado'?'convertido':null);
            return `<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--glass-border);border-radius:10px;padding:8px 12px;margin-bottom:6px">
              <span style="width:8px;height:8px;border-radius:50%;background:${st.c};flex:none"></span>
              <div style="flex:1;min-width:0"><b style="font-size:12.5px">${esc(l.barberia||l.name||'Lead')}</b>${l.name&&l.barberia?` <span class="muted" style="font-size:11px">· ${esc(l.name)}</span>`:''}${l.source?` <span class="muted" style="font-size:10.5px">· ${esc(l.source)}</span>`:''}</div>
