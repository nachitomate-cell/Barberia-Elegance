<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Operaciones · SynapTech</title>
<style>
  :root{
    /* ── Paleta SynapTech ──────────────────────────────────────────────
       Navy de marca (#0F1A2B) para las superficies y lima (#9CCC3C) para
       la marca. El neón (#C6F94E) es SOLO acento sobre oscuro: se reserva
       para el dato que manda de cada tarjeta y para el foco — nunca como
       fondo ni en bloques grandes (regla de los dos verdes).
       El fondo va un punto más profundo que el navy para que las tarjetas
       se despeguen sin necesitar bordes duros. */
    --bg:#0A1420;
    --surface:#0F1A2B;
    --surface-2:#13233A;
    --glass:rgba(255,255,255,0.025);
    --glass-hover:rgba(255,255,255,0.055);
    --glass-border:rgba(156,204,60,0.12);
    --hairline:rgba(255,255,255,0.06);
    --ink:#E8EFF6;
    --soft:#8FA3B8;
    --lima:#9CCC3C;
    --neon:#C6F94E;
    /* Semáforo: el verde del semáforo ES la lima, para no meter un tercer
       verde en pantalla. Ámbar y rojo se mantienen cálidos y legibles. */
    --green:#9CCC3C;
    --amber:#FFCF6C;
    --red:#FF7B72;
    --accent:#9CCC3C;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .tnum{ font-variant-numeric:tabular-nums; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--glass-border); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1{ font-size:16px; margin:0; font-weight:600; letter-spacing:-.01em; }
  header .sub{ font-size:11px; color:var(--soft); }
  header .acts{ display:flex; gap:8px; }
  /* Pestañas: el muro único de paneles no dejaba pensar — una pantalla,
     una pregunta. El estado de la pestaña sobrevive al refresh (localStorage). */
  .tabs{ display:flex; gap:6px; padding:12px 22px 0; max-width:var(--maxw); margin:0 auto; overflow-x:auto; }
  .tabs button{ border-radius:10px; font-size:12.5px; padding:8px 14px; white-space:nowrap; color:var(--soft); border-color:transparent; background:transparent; }
  .tabs button.on{ background:var(--glass-hover); color:#fff; font-weight:600; border-color:var(--glass-border); }
  .sec{ display:none; } .sec.on{ display:block; }

  /* ── Ancho útil ──────────────────────────────────────────────────────
     El panel vivía clavado a 1040px: en un monitor grande eso dejaba dos
     franjas muertas a los lados y estiraba cada fila hasta que la etiqueta
     y su número quedaban en extremos opuestos de la pantalla.
     El ancho ahora crece con la ventana, pero con tope: pasado cierto
     punto, más ancho no es más información, es más recorrido de ojo. */
  :root{ --maxw:1040px; }
  @media (min-width:1280px){ :root{ --maxw:1240px; } }
  @media (min-width:1600px){ :root{ --maxw:1560px; } }
  @media (min-width:2000px){ :root{ --maxw:1840px; } }

  /* Desde 1280px los paneles dejan de apilarse y fluyen en columnas de
     ~480px, que es el ancho donde una fila "etiqueta … valor" todavía se
     lee de un vistazo. `auto-fill` decide cuántas caben; los bloques que
     ya traen su propia grilla (.cols, .kpis) ocupan la fila completa. */
  @media (min-width:1280px){
    .sec.on{
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(min(100%, 480px), 1fr));
      gap:14px; align-items:start;
    }
    .sec.on > .panel{ margin-top:0 !important; }
    .sec.on > .kpis, .sec.on > .cols, .sec.on > .alerta,
    .sec.on > table, .sec.on > .full{ grid-column:1 / -1; }
    .sec.on > .cols{ margin-top:0; }
  }
  /* Con mucho ancho, los pares de .cols pasan a tres. */
  @media (min-width:1900px){ .cols{ grid-template-columns:repeat(3,1fr); } }
  button{ font:inherit; cursor:pointer; border:1px solid var(--glass-border); background:var(--glass); color:var(--ink); border-radius:9999px; padding:7px 14px; font-size:13px; font-weight:500; transition:background .2s ease, color .2s ease, border-color .2s ease; }
  button:hover{ background:var(--glass-hover); }
  button.primary{ background:var(--accent); border-color:transparent; color:#04101f; }
  .wrap{ max-width:var(--maxw); margin:0 auto; padding:22px; }
  /* El header es full-bleed pero su contenido se alinea con el resto: sin
     esto, en pantalla ancha el título y los botones quedaban pegados a los
     bordes y desalineados de las pestañas y las tarjetas. */
  header{ padding-left:calc(max(22px, (100vw - var(--maxw)) / 2 + 22px)); padding-right:calc(max(22px, (100vw - var(--maxw)) / 2 + 22px)); }
  .login{ max-width:340px; margin:14vh auto; text-align:center; }
  .login h2{ font-size:20px; font-weight:600; letter-spacing:-.01em; }
  .login p{ color:var(--soft); font-size:14px; }
  /* auto-fit y no un número fijo: las tarjetas se reparten el ancho que
     haya sin dejar huecos ni estirarse hasta quedar vacías por dentro. */
  .kpis{ display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
  @media(max-width:720px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
  .kpi{ background:var(--surface); border:1px solid var(--glass-border); border-radius:16px; padding:16px; transition:background .2s ease, border-color .2s ease; }
  .kpi:hover{ background:var(--surface-2); border-color:rgba(156,204,60,.24); }
  .kpi .n{ font-size:28px; font-weight:600; letter-spacing:-.02em; color:#fff; }
  .kpi .k{ font-size:11px; color:var(--soft); margin-top:4px; text-transform:uppercase; letter-spacing:.08em; font-weight:500; }
  .cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:18px; }
  @media(max-width:720px){ .cols{ grid-template-columns:1fr; } }
  .panel{ background:var(--surface); border:1px solid var(--glass-border); border-radius:16px; padding:16px; }

  /* ── Frescura del snapshot ───────────────────────────────────────────
     El panel se sirve de un doc precalculado, así que SIEMPRE dice de
     cuándo es el dato. Fingir que es de este instante sería mentir sobre
     la única cosa que un operador necesita saber para confiar en él. */
  .fresh{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--soft); border:1px solid var(--glass-border); border-radius:9999px; padding:4px 10px; }
  .fresh .p{ width:6px; height:6px; border-radius:50%; background:var(--lima); }
  .fresh.viejo .p{ background:var(--amber); }
  .fresh.cargando .p{ background:var(--neon); animation:pulso 1s ease-in-out infinite; }
  @keyframes pulso{ 0%,100%{ opacity:1 } 50%{ opacity:.25 } }

  /* ── KPI destacado (Meta Ads) ───────────────────────────────────────
     El número que manda va en neón; el resto en tinta normal. Un solo
     acento por tarjeta, si no deja de ser acento. */
  .kpi.hero{ background:linear-gradient(160deg, var(--surface-2), var(--surface)); border-color:rgba(198,249,78,.22); }
  .kpi.hero .n{ color:var(--neon); }
  .delta{ font-size:11px; font-weight:600; margin-left:6px; }
  .delta.bien{ color:var(--lima); } .delta.mal{ color:var(--red); }

  /* ── Embudo ─────────────────────────────────────────────────────────
     Barras proporcionales al paso ANTERIOR, no al total: así se ve dónde
     se cae la gente, que es la única pregunta que importa acá. */
  .fnl{ display:flex; flex-direction:column; gap:9px; margin-top:4px; }
  .fnl .paso{ display:grid; grid-template-columns:120px 1fr auto; gap:10px; align-items:center; font-size:12.5px; }
  .fnl .barra{ height:22px; border-radius:6px; background:rgba(255,255,255,.04); overflow:hidden; }
  .fnl .barra i{ display:block; height:100%; border-radius:6px; background:linear-gradient(90deg, var(--lima), rgba(156,204,60,.45)); }
  .fnl .paso.fin .barra i{ background:linear-gradient(90deg, var(--neon), rgba(198,249,78,.4)); }
  .fnl .paso.cero .barra i{ background:rgba(255,123,114,.5); }
  .fnl .et{ color:var(--soft); }
  .fnl .val{ font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  .fnl .costo{ font-size:11px; color:var(--soft); font-variant-numeric:tabular-nums; }

  /* ── Sparkline de la serie diaria ───────────────────────────────────── */
  .spark{ display:flex; align-items:flex-end; gap:2px; height:44px; margin-top:8px; }
  .spark i{ flex:1; background:rgba(156,204,60,.35); border-radius:2px 2px 0 0; min-height:2px; transition:background .15s ease; }
  .spark i.hoy{ background:var(--neon); }
  .spark i:hover{ background:var(--neon); }

  /* ── Tabla compacta (anuncios) ──────────────────────────────────────── */
  .tb{ width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; }
  .tb th{ text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--soft); font-weight:500; padding:6px 8px 6px 0; border-bottom:1px solid var(--hairline); }
  .tb td{ padding:9px 8px 9px 0; border-bottom:1px solid var(--hairline); font-variant-numeric:tabular-nums; }
  .tb tr:last-child td{ border-bottom:0; }
  .tb .nom{ color:#fff; font-weight:500; }
  .tb .num{ text-align:right; }
  .panel h3{ margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--soft); display:flex; align-items:center; gap:8px; font-weight:500; }
  /* Efecto ticket: sin divisorias, solo espacio en blanco. */
  .row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; font-size:14px; }
  .row span:first-child{ color:var(--soft); }
  .row .v{ font-weight:600; color:#fff; }
  .loc{ display:flex; align-items:center; gap:8px; padding:12px 0; font-size:13px; flex-wrap:wrap; }
  .loc + .loc{ border-top:1px solid var(--hairline); }
  .loc .sub2{ flex-basis:100%; padding-left:16px; font-size:11px; color:var(--soft); margin-top:2px; }
  .dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .dot.on{ background:var(--green); box-shadow:0 0 6px rgba(156,204,60,.35); } .dot.off{ background:rgba(255,255,255,.15); }
  .dot.warn{ background:var(--red); box-shadow:0 0 6px rgba(255,123,114,.6); }
  .alerta{ display:flex; gap:9px; align-items:flex-start; border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:8px; border:1px solid var(--glass-border); }
  .alerta.rojo{ background:rgba(255,123,114,.08); color:#ffbcb5; }
  .alerta.ambar{ background:rgba(255,207,108,.08); color:#f0d38a; }
  .alerta.info{ background:rgba(122,168,255,.07); color:#b9d0ff; }
  .trial-ok{ color:var(--green); } .trial-pronto{ color:var(--amber); } .trial-vencido{ color:var(--red); }
  .tag{ font-size:10px; padding:2px 8px; border-radius:9999px; background:var(--glass-hover); color:var(--soft); font-weight:500; }
  .tag.g{ color:var(--green); background:rgba(156,204,60,.15); }
  .muted{ color:var(--soft); font-size:12px; }
  .warn{ background:rgba(255,207,108,.08); border:1px solid var(--glass-border); color:var(--amber); border-radius:12px; padding:10px 14px; font-size:13px; margin-top:14px; }
  #err{ color:var(--red); font-size:13px; margin-top:10px; }
  /* Botones mini (ver chats / apagar) — píldoras translúcidas sin borde. */
  button.mini{ padding:3px 10px; font-size:11px; border-radius:9999px; border:none; background:rgba(255,255,255,.05); color:var(--ink); }
  button.mini:hover{ background:rgba(255,255,255,.09); }
  button.mini.danger{ color:#ffbcb5; background:rgba(255,123,114,.1); }
  button.mini.danger:hover{ background:rgba(255,123,114,.18); }
  /* "Apagar todo" — destructivo premium, sin outline agresivo. */
  button.panic{ background:rgba(255,0,0,.1); border:none; color:#ff9088; font-weight:600; }
  button.panic:hover{ background:rgba(255,0,0,.15); color:#ffb3ae; }
  /* Barras de progreso más prominentes y suaves. */
  .bar{ flex:1; height:6px; border-radius:9999px; background:rgba(255,255,255,.05); overflow:hidden; min-width:60px; }
  .bar i{ display:block; height:100%; border-radius:9999px; transition:width .3s ease; }
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.5); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal .box{ background:#161b22; border:1px solid var(--glass-border); border-radius:20px; max-width:640px; width:100%; max-height:82vh; overflow-y:auto; padding:20px; box-shadow:0 25px 50px rgba(0,0,0,.5); }
  .chat{ border:1px solid var(--glass-border); background:var(--glass); border-radius:12px; padding:10px 12px; margin-bottom:10px; }
  .chat .meta{ font-size:11px; color:var(--soft); margin-bottom:6px; }
  .msg{ font-size:12.5px; line-height:1.5; margin:3px 0; padding:5px 9px; border-radius:10px; white-space:pre-wrap; }
  .msg.user{ background:rgba(255,255,255,.04); }
  .msg.assistant{ background:rgba(156,204,60,.08); }
</style>
</head>
<body>
  <div id="app"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDqVkAhkXALm3hLcrmzjiaS3flUezPFe2Q",
      authDomain: "barberia-elegance.firebaseapp.com",
      projectId: "barberia-elegance",
      storageBucket: "barberia-elegance.firebasestorage.app",
      messagingSenderId: "515311607907",
      appId: "1:515311607907:web:8add6005144015c5e85856",
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const app = document.getElementById('app');
    const clp = n => '$' + Math.round(Number(n)||0).toLocaleString('es-CL');
    const usd = n => 'US$' + (Number(n)||0).toFixed(2);
    const num = n => (Number(n)||0).toLocaleString('es-CL');

    function loginView(msg){
      app.innerHTML = `<div class="login">
        <h2>Operaciones · SynapTech</h2>
        <p>Panel interno. Ingresa con tu cuenta de operador.</p>
        <button class="primary" id="gbtn" style="width:100%;margin-top:8px">Entrar con Google</button>
        ${msg ? `<div id="err">${msg}</div>` : ''}
      </div>`;
      document.getElementById('gbtn').onclick = async () => {
        try { await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
        catch(e){ loginView(e.message); }
      };
    }

    // Semáforo: verde = conectado · rojo pulsante = caído con módulos activos
    // (bot/confirmaciones mudos) · gris = canal vinculado pero módulos apagados.
    function dotClass(l){
      if(l.salud==='ok' || l.estado==='connected') return 'on';
      if(l.salud==='caida') return 'warn';
      return 'off';
    }
    // Barra de cuota: verde <60% · ámbar 60-85% · rojo sobre 85%.
    // Es la lectura anti-ban de un vistazo — cuánto habló hoy este número
    // contra lo que puede hablar según su madurez.
    function cuotaBar(c){
      if(!c || !c.capTotal) return '';
      const pct = Math.min(100, c.pct||0);
      // Gradiente sutil sobre el color base para dar volumen premium.
      const base = pct>=85 ? 'var(--red)' : (pct>=60 ? 'var(--amber)' : 'var(--green)');
      const fill = `linear-gradient(90deg, ${base} 0%, ${base} 100%)`;
      return `<span class="sub2" style="display:flex;align-items:center;gap:10px">
        <span style="flex:0 0 90px;color:var(--soft)">salientes hoy</span>
        <span class="bar"><i style="width:${pct}%;background:${fill}"></i></span>
        <span class="tnum" style="flex:0 0 auto;color:#fff;font-weight:500">${c.salientes}/${c.capTotal}</span>
        <span style="color:var(--soft)">· confirm ${c.confirmaciones}/${c.capConfirm}${c.fallos?` · <span style="color:var(--red)">${c.fallos} fallo(s)</span>`:''}</span>
      </span>`;
    }
    function locRow(l){
      const partes = [];
      const ia = l.ia||{};
      // El gasto de IA se muestra SIEMPRE que el local tenga el bot encendido,
      // aunque vaya en cero. Escondiéndolo cuando no hay consumo, un local que
      // dejó de gastar (bot mudo, sesión caída) se ve idéntico a uno que nunca
      // gastó — y esa es justamente la diferencia que hay que notar.
      if(l.bot || ia.costoHoy || ia.llamadasHoy) partes.push(`IA hoy ${usd(ia.costoHoy)} · ${num(ia.llamadasHoy)} llam.`);
      if(l.bot || ia.costoUsd) partes.push(`mes ${usd(ia.costoUsd)}`);
      if(ia.cacheHit!=null){
        const hp = Math.round(ia.cacheHit*100);
        partes.push(`<span style="color:${hp<60?'var(--red)':'var(--green)'}">caché ${hp}%</span>`);
      }
      // Saldo de la bolsa del canal oficial. Solo para quien tiene ese canal
      // contratado: en los demás sería un cero que no significa nada.
      const of = l.oficial || {};
      if(of.planCliente || of.planRecordatorio){
        const s = Number(of.saldo)||0;
        partes.push(`<span style="color:${s===0?'var(--red)':s<=10?'var(--amber)':'var(--soft)'}">📩 ${num(s)} msj en bolsa</span>`);
      }
      if(l.negocio && (l.negocio.agendadas || l.negocio.canceladas)) partes.push(`✂️ ${num(l.negocio.agendadas)} agendada(s) · ${num(l.negocio.canceladas)} cancelada(s)`);
      if(l.negocio && (l.negocio.confSi || l.negocio.confNo)) partes.push(`confirm ✓${num(l.negocio.confSi)} ✗${num(l.negocio.confNo)}`);
      if(l.negocio && l.negocio.optout) partes.push(`<span style="color:var(--red)">🚫 ${num(l.negocio.optout)} baja(s)</span>`);
      if(l.silenciados) partes.push(`🔇 ${l.silenciados} chat(s) en pausa`);
      if(l.salud==='caida' && l.minCaida) partes.push(`⚠ caída hace ${l.minCaida>=60?Math.floor(l.minCaida/60)+' h':l.minCaida+' min'}`);
      if(l.edadDias!=null) partes.push(`nº de ${l.edadDias} día(s)`);
      const activo = l.bot || l.conf;
      return `<div class="loc">
        <span class="dot ${dotClass(l)}"></span>
        <span style="flex:1">${l.id}${l.numero?` · +${l.numero}`:''}</span>
        ${l.bot?'<span class="tag g">bot</span>':''}
        ${l.conf||l.reactivacion?'<span class="tag g">'+(l.reactivacion?'react':'confirm')+'</span>':''}
        <button class="mini" data-ver="${l.id}">ver chats</button>
        ${activo?`<button class="mini danger" data-kill="${l.id}">apagar</button>`:''}
        ${partes.length?`<span class="sub2">${partes.join(' · ')}</span>`:''}
        ${cuotaBar(l.cuota)}
      </div>`;
    }
    function proyectoPanel(nombre, d, mesActual){
      if(!d) return `<div class="panel"><h3>${nombre}</h3><p class="muted">Sin datos disponibles.</p></div>`;
      const locs = (d.locales||[]).map(locRow).join('') || '<p class="muted">Sin locales con canal.</p>';
      const neg = d.negocio;
      const negRows = neg ? `
        <div class="row"><span>Citas agendadas por bot (mes)</span><span class="v tnum">${num(neg.agendadas)}</span></div>
        <div class="row"><span>Confirmaciones ✓ / ✗ (mes)</span><span class="v tnum">${num(neg.confSi)} / ${num(neg.confNo)}</span></div>` : '';
      return `<div class="panel">
        <h3>${nombre}</h3>
        <div class="row"><span>Locales activos</span><span class="v tnum">${d.localesActivos||0}</span></div>
        <div class="row"><span>Mensajes (30d)</span><span class="v tnum">${num(d.mensajes?.total)}</span></div>
        <div class="row"><span>Costo Claude (30d)</span><span class="v tnum">${usd(d.claude?.costoUsd)}</span></div>
        <div class="row"><span>Llamadas IA</span><span class="v tnum">${num(d.claude?.llamadas)}</span></div>
        ${negRows}
        <div style="margin-top:12px">${locs}</div>
      </div>`;
    }

    /* ── Gasto de Claude por local ──────────────────────────────────────
       El costo de IA es el único insumo del bot que escala con el uso y NO
       se le cobra al local por mensaje: si un local se dispara, el margen se
       lo come SynapTech. Este panel existe para verlo por local antes de que
       eso pase, no después en la factura de Anthropic.

       Ordenado por gasto del MES descendente: el que hay que mirar siempre
       está arriba. La proyección de cierre es lineal sobre los días
       transcurridos — grosera, pero suficiente para decidir si hay que bajar
       el tope de conversaciones de alguien. */
    function iaPanel(d){
      const locs = (d && d.locales || []).filter(l => l.bot || (l.ia && (l.ia.costoUsd || l.ia.llamadas)));
      if(!locs.length) return '';
      const ordenados = locs.slice().sort((a,b) => (b.ia?.costoUsd||0) - (a.ia?.costoUsd||0));
      const totalMes = ordenados.reduce((t,l) => t + (l.ia?.costoUsd||0), 0);
      const totalHoy = ordenados.reduce((t,l) => t + (l.ia?.costoHoy||0), 0);
      const hoyDia   = new Date().getDate();
      const diasMes  = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0).getDate();
      const proy     = totalMes / Math.max(1, hoyDia) * diasMes;

      const fila = (l) => {
        const ia = l.ia || {};
        const mes = Number(ia.costoUsd)||0, hoy = Number(ia.costoHoy)||0;
        const llam = Number(ia.llamadas)||0;
        const porLlamada = llam ? mes/llam : 0;
        // Barra relativa al local que más gasta: muestra el reparto de un
        // vistazo, que es lo que dice a quién apretarle el tope.
        const pct = totalMes > 0 ? Math.round(mes / (ordenados[0].ia?.costoUsd || mes || 1) * 100) : 0;
        const hp = ia.cacheHit == null ? null : Math.round(ia.cacheHit*100);
        return `<div class="loc">
          <span class="dot ${dotClass(l)}"></span>
          <span style="flex:1">${l.id}${l.bot?'':' <span class="muted">(bot apagado)</span>'}</span>
          <span class="tnum" style="flex:0 0 auto;color:#fff;font-weight:600">${usd(mes)}</span>
          <span class="sub2" style="display:flex;align-items:center;gap:10px">
            <span class="bar" style="max-width:120px"><i style="width:${pct}%;background:#a78bfa"></i></span>
            <span style="color:var(--soft)">hoy ${usd(hoy)} · ${num(llam)} llam. mes${
              llam ? ` · ${usd(porLlamada)}/llam.` : ''}${
              hp==null ? '' : ` · <span style="color:${hp<60?'var(--red)':'var(--green)'}">caché ${hp}%</span>`}</span>
          </span>
        </div>`;
      };

      return `<div class="panel" style="margin-top:14px">
        <h3>🧠 Gasto de Claude por local · bot IA</h3>
        <div class="row"><span>Hoy, sumando locales</span><span class="v tnum">${usd(totalHoy)}</span></div>
        <div class="row"><span>Mes en curso</span><span class="v tnum">${usd(totalMes)}</span></div>
        <div class="row"><span>Proyección de cierre</span><span class="v tnum" style="color:${proy>20?'var(--amber)':'inherit'}">${usd(proy)}</span></div>
        <div style="margin-top:12px">${ordenados.map(fila).join('')}</div>
        <div class="muted" style="margin-top:8px">
          Es costo de tokens de Anthropic, no lo que paga el local. Para acotarlo se baja el
          <b>tope de conversaciones/día</b> de ese local desde /admin. Un caché bajo 60% duplica el costo del mismo tráfico.
        </div>
      </div>`;
    }

    // ── Correo transaccional ──
    // La pregunta que contesta este panel es una sola: ¿cuándo dejan de
    // alcanzar los planes free y hay que pagar? Por eso lo que manda no es el
    // total del mes sino el consumo del día contra el tope de cada proveedor,
    // y cuántos días del mes ya tocamos techo.
    function emailPanel(em){
      if(!em) return '';
      const barra = p => {
        const pct  = Math.min(100, p.pctDia);
        const base = pct>=85 ? 'var(--red)' : (pct>=60 ? 'var(--amber)' : 'var(--green)');
        // Un canal sin uso ni cuota gastada en todo el mes está dormido: casi
        // siempre es una cuenta cuya key todavía no se cargó.
        const dormido = !p.hoy && !p.mes;
        return `<div class="loc" style="border:0">
          <span style="flex:0 0 132px${dormido?';color:var(--soft)':''}">${p.nombre}</span>
          <span class="bar"><i style="width:${pct}%;background:${base}"></i></span>
          <span class="tnum" style="flex:0 0 auto;color:#fff;font-weight:600">${num(p.hoy)}/${num(p.capDia)}</span>
          <span class="tag">${p.plan}</span>
          <span class="sub2">mes: ${num(p.mes)}${p.capMes?` de ${num(p.capMes)} (${p.pctMes}%)`:''}${dormido?' · sin uso':''}</span>
        </div>`;
      };
      // Minigráfico de 14 días: la tendencia es lo que anticipa la compra.
      const max = Math.max(1, ...em.porDia.map(d => d.total));
      const spark = em.porDia.map(d => {
        const h = Math.max(2, Math.round((d.total/max)*34));
        const c = d.total >= em.capacidadDiaria*0.8 ? 'var(--red)'
                : (d.total >= em.capacidadDiaria*0.5 ? 'var(--amber)' : 'rgba(122,168,255,.55)');
        const det = em.canales.filter(x=>d[x.id]).map(x=>`${x.nombre} ${d[x.id]}`).join(' · ') || 'sin envíos';
        return `<span title="${d.fecha}: ${d.total} — ${det}"
          style="flex:1;height:${h}px;background:${c};border-radius:2px;min-width:3px"></span>`;
      }).join('');

      const proy = em.mes.proyeccion;
      const cierre = proy > em.capacidadDiaria*28
        ? `<span style="color:var(--red)">proyección de cierre ${num(proy)} — no alcanza el free</span>`
        : `proyección de cierre ${num(proy)}`;

      return `<div class="panel" style="margin-top:14px">
        <h3>📧 Correo transaccional · hoy</h3>
        ${em.canales.map(barra).join('')}
        <div style="display:flex;align-items:flex-end;gap:3px;height:38px;margin:14px 0 6px">${spark}</div>
        <div class="muted" style="text-align:center;margin-bottom:6px">últimos 14 días · total diario</div>
        <div class="row"><span>Hoy, sumando canales</span><span class="v tnum">${num(em.hoy.total)} / ${num(em.capacidadDiaria)}</span></div>
        <div class="row"><span>Mes ${em.mes.etiqueta}</span><span class="v tnum">${num(em.mes.total)}</span></div>
        <div class="row"><span>Días del mes en que se topó un canal</span><span class="v tnum" style="color:${em.mes.diasEnTope?'var(--red)':'var(--green)'}">${em.mes.diasEnTope}</span></div>
        ${em.mes.fallidos?`<div class="row"><span>No salieron por ningún canal (mes)</span><span class="v tnum" style="color:var(--red)">${num(em.mes.fallidos)}</span></div>`:''}
        <div class="muted" style="margin-top:8px">${cierre}</div>
      </div>`;
    }

    // ── Cobro REAL de Meta (WhatsApp oficial) ──
    // pricing_analytics de la WABA: lo que Meta factura de verdad, en CLP.
    // El split sandbox/producción sale del ledger propio (notification_logs).
    function metaWaPanel(m){
      if(!m) return '';
      const fila = (t) => `<div class="row">
        <span>${t.sandbox ? '🧪' : '🏪'} ${t.tid} <span class="muted">(hoy ${t.hoy})</span></span>
        <span class="v tnum">${num(t.mes)} msj · $${num(t.costoClp)}</span></div>`;
      return `<div class="panel" style="margin-top:14px">
        <h3>💸 Cobro Meta · WhatsApp oficial</h3>
        <div class="row"><span>Hoy</span><span class="v tnum">${num(m.hoy.mensajes)} msj · $${num(m.hoy.costoClp)}</span></div>
        <div class="row"><span>Mes</span><span class="v tnum">${num(m.mes.mensajes)} msj · $${num(m.mes.costoClp)}</span></div>
        <div class="row"><span>Costo por mensaje (real)</span><span class="v tnum">$${m.costoPorMensaje}</span></div>
        <div class="row"><span>🧪 Sandbox (mes)</span><span class="v tnum">${num(m.sandbox.mensajes)} msj · $${num(m.sandbox.costoClp)}</span></div>
        <div class="row"><span>🏪 Producción real (mes)</span><span class="v tnum" style="color:var(--green)">${num(m.produccion.mensajes)} msj · $${num(m.produccion.costoClp)}</span></div>
        ${(m.porTenant||[]).map(fila).join('')}
        <div class="muted" style="margin-top:8px">Fuente: pricing_analytics de la WABA (factura real de Meta, CLP). El detalle por local usa el ledger propio × costo real del mes.</div>
      </div>`;
    }

    function trialsPanel(trials){
      if(!trials || !trials.length) return '';
      // Alerta visual anticipada: ámbar solo cuando faltan ≤7 días (renovación
      // inminente); más de 7 queda en verde pastel; vencido en rojo.
      const rows = trials.map(t => {
        const cls = t.diasRestantes < 0 ? 'trial-vencido' : (t.diasRestantes <= 7 ? 'trial-pronto' : 'trial-ok');
        const estado = t.diasRestantes < 0 ? `VENCIDO hace ${Math.abs(t.diasRestantes)} día(s)` : `${t.diasRestantes} día(s) restantes`;
        return `<div class="row"><span>${t.tid}${t.tipo?` <span class="muted">· ${t.tipo}</span>`:''}</span><span class="v tnum ${cls}">${t.fin} · ${estado}</span></div>`;
      }).join('');
      return `<div class="panel" style="margin-top:14px"><h3>⏳ Trials activos</h3>${rows}</div>`;
    }

    /* ── Salud del chip compartido de SynapTech ──────────────────────────
       El chip es un consumible: la pregunta no es SI se quema, es cuándo
       cambiarlo. Meta no avisa antes de suspender, así que este panel
       muestra las señales adelantadas — y el volumen NO es una de ellas.
       La que más importa es la tasa de respuesta: si los envíos salen "ok"
       pero nadie contesta, lo más probable es que no estén llegando. */
    function chipPanel(c){
      if(!c) return '';
      const pct = (v) => v == null ? '—' : Math.round(v*100)+'%';
      const veredicto = {
        sano:        { ic:'🟢', t:'Chip sano',            d:'Sin señales de degradación. Seguir usándolo.' },
        vigilar:     { ic:'🟡', t:'Vigilar',              d:'Hay señales tempranas. Todavía no gastes un chip nuevo: cada recambio reinicia el tope a 40/día.' },
        cambiar:     { ic:'🔴', t:'Cambiar el chip',      d:'Señal fuerte de degradación o bloqueo. Consigue otro número y re-vincula desde /admin.' },
        'sin-datos': { ic:'⚪', t:'Sin datos suficientes', d:`Con menos de 20 envíos en 7 días cualquier porcentaje es ruido. Van ${c.enviados}.` },
      }[c.veredicto] || { ic:'⚪', t:c.veredicto, d:'' };

      const barras = Object.entries(c.porDia||{}).reverse().map(([d,n]) => {
        const alto = Math.max(2, Math.round((n / Math.max(1, c.cap)) * 40));
        return `<div title="${d}: ${n} envíos" style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:44px;">
            <div style="background:${n >= c.cap ? 'var(--red)' : '#38bdf8'};height:${alto}px;border-radius:2px;opacity:.85"></div>
          </div>`;
      }).join('');

      const locales = Object.entries(c.porLocal||{}).sort((a,b)=>b[1]-a[1])
        .map(([tid,n]) => `<span class="muted" style="margin-right:10px">${tid}: <b style="color:var(--ink)">${n}</b></span>`).join('');

      return `<div class="box" style="margin-top:16px">
        <h3 style="margin:0 0 2px">📱 ${c.nombre || 'Chip SynapTech'} · confirmaciones y recordatorios</h3>
        <p class="muted" style="margin:0 0 12px;font-size:12px">
          Cupo y locales propios de este chip. ${c.numero ? '+'+c.numero+' · ' : ''}${c.diasVinculado} días vinculado · tope ${c.cap}/día · últimos ${c.dias} días
        </p>

        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin-bottom:12px;
             background:${c.veredicto==='cambiar'?'rgba(239,68,68,.12)':c.veredicto==='vigilar'?'rgba(251,191,36,.12)':'rgba(148,163,184,.08)'};
             border:1px solid ${c.veredicto==='cambiar'?'rgba(239,68,68,.4)':c.veredicto==='vigilar'?'rgba(251,191,36,.35)':'rgba(148,163,184,.2)'}">
          <span style="font-size:20px">${veredicto.ic}</span>
          <div><b>${veredicto.t}</b><div class="muted" style="font-size:12px">${veredicto.d}</div></div>
        </div>

        <div class="kpis" style="margin-bottom:12px">
          <div class="kpi">
            <div class="n tnum" style="color:${c.restanteHoy === 0 ? 'var(--red)' : c.restanteHoy <= 2 ? '#fbbf24' : 'inherit'}">
              ${c.restanteHoy}<span style="font-size:15px;color:var(--soft)">/${c.cap}</span>
            </div>
            <div class="k">Mensajes que quedan hoy${c.topeManual != null ? ' · tope manual' : ''}</div>
          </div>
          <!-- "Respuestas por envío", no "% que responde": se cuenta CADA
               mensaje entrante, y un cliente que escribe "hola", "1" y
               "confirmar" son tres. Por eso puede pasar del 100% — apareció un
               130% en pantalla bajo la etiqueta "Responden", que se lee como
               un dato imposible y hace desconfiar del panel entero. El umbral
               de shadowban (bajo = malo) sigue funcionando igual. -->
          <div class="kpi"><div class="n tnum">${pct(c.tasaRespuesta)}</div><div class="k">Respuestas por envío${c.volumenSuficiente?'':' (poco volumen)'}</div></div>
          <div class="kpi"><div class="n tnum">${pct(c.tasaOptout)}</div><div class="k">Piden baja</div></div>
          <div class="kpi"><div class="n tnum">${pct(c.tasaFallo)}</div><div class="k">Envíos fallidos</div></div>
        </div>

        ${c.restanteHoy === 0 ? `<div class="alerta rojo" style="margin-bottom:12px">
          <span>🔴</span><span>El chip agotó su cupo de hoy (${c.usadosHoy}/${c.cap}). No sale ninguna confirmación más hasta mañana.</span>
        </div>` : ''}

        <!-- Quién tiene el chip activo. El cupo es del CHIP, no de cada
             local: comparten el mismo. Si uno se lo come, los demás quedan
             mudos aunque no hayan enviado nada. -->
        <p class="muted" style="margin:0 0 6px;font-size:12px;font-weight:600">
          Locales en este chip (${(c.activos||[]).length}) · consumo de hoy sobre SU cupo
        </p>
        ${(c.activos||[]).length ? `<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px">
          ${c.activos.map(a => `<tr style="border-bottom:1px solid rgba(148,163,184,.08)">
            <td style="padding:5px 0">${a.nombre}${a.silenciadoPorCanalPropio
              ? ' <span style="color:#fbbf24">⚠ silenciado — usa su número propio</span>' : ''}</td>
            <td style="padding:5px 0;text-align:right" class="tnum"><b>${a.hoy}</b> <span class="muted">enviados hoy</span></td>
          </tr>`).join('')}
        </table>` : '<p class="muted" style="margin:0 0 12px;font-size:12px">Ninguno todavía.</p>'}

        <div style="display:flex;gap:2px;align-items:flex-end;margin-bottom:6px">${barras}</div>
        <p class="muted" style="margin:0 0 12px;font-size:11px">Envíos por día (${c.dias}d) · la barra roja es el tope diario alcanzado</p>

        <p class="muted" style="margin:0;font-size:12px">
          ${c.enviados} enviados · ${c.respuestas} respuestas (${c.confSi} confirman / ${c.confNo} cancelan) · ${c.optouts} bajas
        </p>
        ${locales ? `<p style="margin:6px 0 0;font-size:12px">${locales}</p>` : ''}
        ${c.señales.length ? `<div style="margin-top:10px">${c.señales.map(s =>
          `<div class="alerta ${s.nivel}" style="margin-top:4px"><span>${s.nivel==='rojo'?'🔴':'🟡'}</span><span>${s.texto}</span></div>`).join('')}</div>` : ''}
      </div>`;
    }

    /* ── Administración de chips ─────────────────────────────────────────
       Vincular por QR, desvincular y decidir qué locales atiende cada chip,
       todo desde acá. Antes había que entrar al drawer de CADA local en /admin
       para moverlo de chip: para repartir 6 locales entre 2 chips eran 6
       viajes, y en ninguno se veía el reparto completo — que es lo único que
       importa, porque el cupo diario es del chip y se comparte.

       ops.html NO carga el SDK de Firestore (solo auth y functions), así que
       todo pasa por callables. Es mejor así: el chipId se valida contra los
       que existen de verdad en el servidor, y un id mal escrito no puede dejar
       a un local mandando desde el número equivocado. */
    let _chips = [], _locales = [];

    function chipsAdminPanel(chips, locales){
      _chips = chips || []; _locales = locales || [];
      if (!_chips.length) return '';

      const tarjeta = (c) => {
        const vivo = c.estadoConexion === 'connected';
        const dias = c.vinculadoDesde ? ((Date.now() - c.vinculadoDesde)/86400000).toFixed(1) : null;
        return `<div style="border:1px solid rgba(148,163,184,.18);border-radius:10px;padding:12px;flex:1;min-width:260px">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="color:${vivo?'var(--ok,#4ade80)':'var(--red)'};font-size:15px">●</span>
            <b>${c.nombre}</b>
            <span class="muted" style="font-size:11px">${c.chipId}</span>
          </div>
          <p class="muted" style="margin:0 0 10px;font-size:12px">
            ${c.numeroVinculado ? '+'+c.numeroVinculado : '<span style="color:var(--red)">sin vincular</span>'}
            ${dias ? ' · '+dias+' días' : ''} · ${c.usadosHoy}/${c.cap} hoy · ${c.tenants.length} local(es)
          </p>
          <div style="display:flex;gap:6px">
            <button onclick="opsVincularChip('${c.chipId}')" style="flex:1">${vivo?'Re-vincular':'Vincular (QR)'}</button>
            <button onclick="opsDesvincularChip('${c.chipId}')">Desvincular</button>
          </div>
        </div>`;
      };

      // Solo los locales con el módulo ENCENDIDO se reparten: asignarle un chip
      // a uno apagado no hace nada y solo alarga la tabla. Los apagados van en
      // el desplegable de abajo, para poder encenderlos desde acá.
      const activos = _locales.filter(l => l.activo);
      const apagados = _locales.filter(l => !l.activo);

      const filas = activos.map(l => `<tr style="border-bottom:1px solid rgba(148,163,184,.08)">
          <td style="padding:6px 0">${l.nombre}<span class="muted" style="font-size:11px"> · ${l.id}</span></td>
          <td style="padding:6px 0;text-align:right">
            ${_chips.map(c => `<button onclick="opsAsignar('${l.id}','${c.chipId}')"
                style="margin-left:4px;padding:3px 8px;font-size:11px;${l.chipId===c.chipId
                  ? 'border-color:#38bdf8;color:#7dd3fc;background:rgba(56,189,248,.15)' : ''}">${c.nombre}</button>`).join('')}
            <button onclick="opsAsignar('${l.id}',null,false)" title="Apagar el módulo en este local"
              style="margin-left:6px;padding:3px 8px;font-size:11px;color:#f87171">apagar</button>
          </td>
        </tr>`).join('');

      return `<div class="box" style="margin-top:16px">
        <h3 style="margin:0 0 2px">🔗 Chips · vinculación y reparto de locales</h3>
        <p class="muted" style="margin:0 0 12px;font-size:12px">
          El cupo diario es del chip: los locales que comparten chip comparten cupo. Repartirlos acá es repartir riesgo.
        </p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">${_chips.map(tarjeta).join('')}
          <div style="border:1px dashed rgba(56,189,248,.35);border-radius:10px;padding:12px;flex:1;min-width:200px;display:flex;align-items:center;justify-content:center">
            <button onclick="opsVincularChip(null)">+ Vincular chip nuevo</button>
          </div>
        </div>

        <p class="muted" style="margin:0 0 6px;font-size:12px;font-weight:600">Locales con el canal encendido (${activos.length})</p>
        ${activos.length
          ? `<table style="width:100%;border-collapse:collapse;font-size:12px">${filas}</table>`
          : '<p class="muted" style="font-size:12px;margin:0">Ninguno todavía.</p>'}

        ${apagados.length ? `<div style="margin-top:12px">
          <p class="muted" style="margin:0 0 6px;font-size:12px;font-weight:600">Encender el canal en otro local</p>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <select id="ops-nuevo-local" style="flex:1;min-width:180px;padding:6px;border-radius:6px;background:#0b1220;color:inherit;border:1px solid rgba(148,163,184,.25)">
              ${apagados.map(l => `<option value="${l.id}">${l.nombre}</option>`).join('')}
            </select>
            <select id="ops-nuevo-chip" style="padding:6px;border-radius:6px;background:#0b1220;color:inherit;border:1px solid rgba(148,163,184,.25)">
              ${_chips.map(c => `<option value="${c.chipId}">${c.nombre}</option>`).join('')}
            </select>
            <button onclick="opsEncenderLocal()">Encender</button>
          </div>
        </div>` : ''}
      </div>`;
    }

    const _fn = (n) => firebase.app().functions('us-central1').httpsCallable(n);

    /* ── Leads del bot de ventas (chip del número de Ignacio) ─────────────
       La captura la declara el propio bot (tool registrar_reunion): acá solo
       se muestra el embudo y se mueve el estado a mano al confirmar/realizar
       la reunión. El chat completo vive en el WhatsApp de Ignacio. */
    /* ═══════════════════════════════════════════════════════════════════
       📣 META ADS — el embudo completo, de la plata al cliente.

       El Ads Manager responde "¿cuánto costó una conversación?". Esa
       pregunta ya la teníamos contestada y bien ($1.646, bajo el
       benchmark) mientras la campaña no traía UN solo cliente. Lo que
       falta siempre es la otra mitad: qué pasó DESPUÉS del clic. Este
       panel pega las dos y muestra el costo de cada escalón, porque el
       escalón donde el número se dispara es el que hay que arreglar.
       ═══════════════════════════════════════════════════════════════════ */
    // Como `clp` (línea ~168) pero distingue "no hay dato" de "cero": un anuncio
    // sin conversaciones no tiene costo por conversación, y mostrarlo como $0
    // haría creer que es el más barato de todos.
    function clpOpt(n){ return n === null || n === undefined ? '—' : '$' + Math.round(n).toLocaleString('es-CL'); }

    /** Barras proporcionales al paso anterior: muestran la CAÍDA, no el volumen. */
    function embudoHtml(e){
      if(!e) return '<p class="muted">Sin datos del embudo.</p>';
      const c = e.costo || {};
      const pasos = [
        { et:'Conversaciones', v:e.chatsTotales7d,     costo:c.porConversacion },
        { et:'Chats del bot',  v:e.chatsActivados7d,   costo:c.porChatBot   },
        { et:'Leads',          v:e.leads7d,            costo:c.porLead      },
        { et:'Reuniones',      v:e.reuniones7d,        costo:c.porReunion   },
        { et:'Trials creados', v:e.trials7d,           costo:c.porTrial     },
        { et:'Clientes',       v:e.clientesPagando,    costo:null, fin:true },
      ];
      const tope = Math.max(1, ...pasos.map(p => p.v || 0));
      return `<div class="fnl">${pasos.map(p => {
        const pct = Math.max(2, Math.round(100 * (p.v || 0) / tope));
        const cls = [(p.v ? '' : 'cero'), (p.fin ? 'fin' : '')].filter(Boolean).join(' ');
        return `<div class="paso ${cls}">

          <span><span class="val">${p.v ?? 0}</span>${p.costo ? ` <span class="costo">${clpOpt(p.costo)} c/u</span>` : ''}</span>
        </div>`;
      }).join('')}</div>`;
    }

    function sparkHtml(serie){
      const d = (serie || []).slice(-21);
      if(!d.length) return '';
      const tope = Math.max(...d.map(x => x.gasto), 1);
      return `<div class="spark">${d.map((x,i) =>
        `<i class="${i === d.length-1 ? 'hoy' : ''}" style="height:${Math.max(2, Math.round(100*x.gasto/tope))}%"
            title="${x.fecha}: ${clpOpt(x.gasto)} · ${x.conversaciones} conv"></i>`).join('')}</div>
        <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--soft);margin-top:4px">
          <span>${d[0].fecha}</span><span>gasto diario</span><span>${d[d.length-1].fecha}</span>
        </div>`;

    function metaAdsPanel(m){

      const r = m.meta.resumen7 || {};
      const prev = r.previo || {};
      const bench = m.benchmark || 1850;
      // Costo por conversación contra el benchmark: verde si va bajo, rojo si

      const cpc = r.costoPorConversacion;
      const vsBench = cpc ? Math.round(100 * (cpc - bench) / bench) : null;
      const vsPrev  = (cpc && prev.costoPorConversacion)
        ? Math.round(100 * (cpc - prev.costoPorConversacion) / prev.costoPorConversacion) : null;
      const delta = (v, invertido) => v === null ? '' :

      const anuncios = m.meta.anuncios7 || [];

      const activas = m.meta.activas || 0;

      return `
        <div class="kpis" style="margin-bottom:14px">
          <div class="kpi hero">
            <div class="n tnum">${clpOpt(cpc)}</div>
            <div class="k">Costo / conversación ${delta(vsBench, true)}</div>
            <div class="costo" style="margin-top:4px">benchmark ${clpOpt(bench)}${vsPrev !== null ? ` · vs semana previa ${delta(vsPrev, true)}` : ''}</div>
          </div>
          <div class="kpi"><div class="n tnum">${clpOpt(r.gasto)}</div><div class="k">Gasto 7 días</div></div>
          <div class="kpi"><div class="n tnum">${r.conversaciones ?? 0}</div><div class="k">Conversaciones</div></div>
          <div class="kpi"><div class="n tnum">${m.embudo ? m.embudo.trials7d : '—'}</div><div class="k">Trials creados (7d)</div></div>
        </div>

        ${activas === 0 ? `<div class="alerta ambar"><span>⏸️</span><span>
          <b>Todas las campañas están pausadas.</b> Los números de abajo son de los últimos 7 días con gasto, no de hoy.
        </span></div>` : ''}

        <div class="cols" style="margin-top:0">
          <div class="panel">
            <h3>🔻 Embudo real · 7 días</h3>
            ${embudoHtml(m.embudo)}
            ${m.embudo && m.embudo.chatsConAnuncio7d === 0 && m.embudo.chatsTotales7d > 0 ? `
              <p class="muted" style="font-size:11.5px;margin-top:10px">
                Ningún chat de la semana trae referido de anuncio. Con las campañas apagadas es lo esperado;
                si están corriendo y sigue en 0, el referido CTWA no está llegando al webhook.
              </p>` : ''}
          </div>
          <div class="panel">
            <h3>📈 Gasto diario · 30 días</h3>
            ${sparkHtml(m.meta.serieDiaria)}
            <div class="row"><span>Impresiones (7d)</span><span class="v tnum">${num(r.impresiones)}</span></div>
            <div class="row"><span>Clics (7d)</span><span class="v tnum">${num(r.clicks)}</span></div>
            <div class="row"><span>Frecuencia máx.</span><span class="v tnum" style="color:${(r.frecuenciaMax||0) > 3 ? 'var(--red)' : '#fff'}">${(r.frecuenciaMax||0).toFixed(2)}</span></div>
          </div>
        </div>

        <div class="panel" style="margin-top:14px">
          <h3>🎬 Por anuncio · 7 días</h3>
          ${anuncios.length ? `<table class="tb">
            <thead><tr><th>Anuncio</th><th class="num">Gasto</th><th class="num">Conv</th><th class="num">$/conv</th><th class="num">CTR</th><th class="num">Freq</th><th class="num">Leads</th></tr></thead>
            <tbody>${anuncios.map(a => {
              const at = porAnuncio[a.id] || {};
              // Semáforo del anuncio: el benchmark manda. Sobre 3x se mata.
              const col = !a.costoPorConversacion ? 'var(--soft)'
                : a.costoPorConversacion > bench * 3 ? 'var(--red)'
                : a.costoPorConversacion > bench ? 'var(--amber)' : 'var(--green)';
              return `<tr>
                <td class="nom">${a.nombre}</td>
                <td class="num">${clpOpt(a.gasto)}</td>
                <td class="num">${a.conversaciones}</td>
                <td class="num" style="color:${col};font-weight:600">${clpOpt(a.costoPorConversacion)}</td>
                <td class="num">${a.ctr}%</td>
                <td class="num">${a.frecuencia}</td>
                <td class="num">${at.leads || 0}</td>
              </tr>`;
            }).join('')}</tbody></table>` : '<p class="muted">Sin gasto en los últimos 7 días.</p>'}
        </div>

        ${m.ultimoReporte ? `<div class="panel" style="margin-top:14px">
          <h3>🤖 Análisis del ${m.ultimoReporte.fecha}</h3>
          <div style="white-space:pre-wrap;font-size:13px;line-height:1.55">${
            String(m.ultimoReporte.texto)
              .replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]))
              .replace(/\*([^*\n]+)\*/g, '<b>$1</b>')
          }</div>
        </div>` : ''}`;
    }

    const LEAD_ESTADOS = {
      reunion_solicitada: { t:'⏳ Reunión solicitada', c:'var(--amber)'  },
      confirmada:         { t:'📅 Hora confirmada',    c:'var(--accent)' },
      realizada:          { t:'✅ Reunión hecha',       c:'var(--green)'  },
      descartado:         { t:'✖ Descartado',          c:'var(--soft)'   },

    function leadsPanel(v){
      const leads = v.leads || [];
      const hace = ms => { if(!ms) return '—'; const m = Math.round((Date.now()-ms)/60000);

      return `<div class="panel" style="margin-top:14px">

        </h3>
        ${leads.length ? leads.map(l => {
          const e = LEAD_ESTADOS[l.estado] || { t: l.estado || '—', c: 'var(--soft)' };

            <span class="dot ${l.estado==='confirmada'||l.estado==='realizada' ? 'on' : 'off'}"></span>

              <a href="https://wa.me/${l.telefono}" target="_blank" style="color:var(--accent);text-decoration:none">abrir chat ↗</a>
              ${l.estado==='reunion_solicitada' ? `· <button class="mini" onclick="opsLeadEstado('${l.telefono}','confirmada')">confirmé hora</button>` : ''}
              ${l.estado==='confirmada' ? `· <button class="mini" onclick="opsLeadEstado('${l.telefono}','realizada')">reunión hecha</button>` : ''}
              ${l.estado!=='descartado' && l.estado!=='realizada' ? `· <button class="mini danger" onclick="opsLeadEstado('${l.telefono}','descartado')">descartar</button>` : ''}
            </span>
          </div>`; }).join('')
        : '<p class="muted">Aún no hay capturas. Cuando un lead acepte la reunión, el bot lo registra aquí y te llega un WhatsApp (chat contigo mismo).</p>'}
      </div>`;
    }
    async function opsLeadEstado(tel, estado){
      try { await _fn('ventasLeadEstado')({ telefono: tel, estado }); await refrescarVentas(); }
      catch(e){ alert('Error: ' + e.message); }
    }

    /* ── ⚙️ Gestión del agente de ventas ──────────────────────────────────
       Todo lo operable del bot en un solo lugar: interruptor, gatillos,
       link de Meet, gasto IA y los chats (ver / pausar / soltar). El prompt
       (la personalidad) queda en código a propósito: cambiarlo merece
       revisión, no un textarea de madrugada. */
    let _botCfg = null;
    function botVentasPanel(v){
      _botCfg = v;
      const on = v.ventasBot === true;
      const conectado = v.estadoConexion === 'connected';
      const hace = ms => { if(!ms) return '—'; const m = Math.round((Date.now()-ms)/60000);
        return m < 60 ? m + ' min' : m < 1440 ? Math.round(m/60) + ' h' : Math.round(m/1440) + ' d'; };
      return `<div class="panel" style="margin-top:14px">
        <h3>⚙️ Bot de ventas · agente IA
          <span class="tag ${on?'g':''}" ${on?'':'style="color:var(--red)"'}>${on ? 'ENCENDIDO' : 'APAGADO'}</span>
          <span class="tag ${conectado?'g':''}" ${conectado?'':'style="color:var(--red)"'}>${conectado ? 'sesión abierta' : 'sesión caída'}</span>
          <span style="margin-left:auto"></span>
          <button class="mini ${on?'danger':''}" onclick="opsBotToggle()">${on ? 'Apagar bot' : 'Encender bot'}</button>
        </h3>
        <div class="row"><span>Número</span><span class="v">${v.numeroVinculado ? '+' + v.numeroVinculado : '—'}</span></div>
        <div class="row"><span>Gasto IA hoy / mes</span>
          <span class="v tnum">${usd(v.gasto.hoyUsd)} <span class="muted">/ ${usd(v.gasto.topeDiaUsd)}</span> · ${usd(v.gasto.mesUsd)} <span class="muted">/ ${usd(v.gasto.topeMesUsd)}</span></span></div>
        <div class="row"><span>Respuestas hoy</span><span class="v tnum">${v.respHoy} <span class="muted">/ ${v.topeChip} del número · ${v.topeChat} por chat</span></span></div>
        <div class="row"><span>Sala de Meet</span>
          <span class="v" style="font-size:12px">${v.meetLink ? v.meetLink.replace('https://','') : '<span style="color:var(--amber)">sin link</span>'}
            <button class="mini" onclick="opsBotMeet()">cambiar</button></span></div>
        <div class="row" style="align-items:flex-start"><span>Gatillos</span>
          <span style="text-align:right;max-width:70%">
            <span class="tag">expovino (fijo)</span> <span class="tag">agenda online (fijo)</span>
            ${(v.activadores||[]).map((a,i) => `<span class="tag" style="margin:2px">${a} <a href="#" onclick="opsBotActDel(${i});return false" style="color:var(--red);text-decoration:none">✕</a></span>`).join(' ')}
            <button class="mini" onclick="opsBotActAdd()">+ agregar</button>
          </span></div>
        <div style="border-top:1px solid var(--hairline);margin-top:6px;padding-top:8px">
          <p class="muted" style="margin:0 0 4px">Chats del agente (últimos 15)</p>
          ${(v.convs||[]).length ? v.convs.map(c => `
            <div class="loc">
              <span class="dot ${c.silenciado ? 'warn' : (c.activado ? 'on' : 'off')}"></span>
              <strong>${c.nombre || '····' + c.telefono.slice(-4)}</strong>
              <span class="muted">${c.activado ? c.respHoy + ' resp. hoy' : 'sin activar'}${c.silenciado ? ' · 🔇 pausado' : ''} · ${hace(c.actualizado)}</span>
              <span style="margin-left:auto">
                ${c.turnos.length ? `<button class="mini" onclick="verChatVentas('${c.telefono}')">ver</button>` : ''}
                <button class="mini ${c.silenciado?'':'danger'}" onclick="opsBotChat('${c.telefono}', ${c.silenciado ? 'false' : 'true'})">${c.silenciado ? 'soltar al bot' : 'pausar 4h'}</button>
                <a href="https://wa.me/${c.telefono}" target="_blank" style="color:var(--accent);font-size:11px;text-decoration:none">chat ↗</a>
              </span>
            </div>`).join('') : '<p class="muted">Sin conversaciones todavía.</p>'}
        </div>
      </div>`;
    }
    async function _botSet(payload, confirmMsg){
      if (confirmMsg && !confirm(confirmMsg)) return;
      try { await _fn('ventasBotConfigSet')(payload); await refrescarVentas(); }
      catch(e){ alert('Error: ' + e.message); }
    }
    function opsBotToggle(){
      const on = _botCfg && _botCfg.ventasBot;
      _botSet({ ventasBot: !on }, on
        ? 'Apagar el agente: los mensajes con gatillo quedarán SIN respuesta automática. ¿Confirmas?'
        : 'Encender el agente de ventas. ¿Confirmas?');
    }
    function opsBotMeet(){
      const raw = prompt('Link de la sala fija de Google Meet (vacío = quitarlo):', (_botCfg && _botCfg.meetLink) || 'https://meet.google.com/');
      if (raw === null) return;
      _botSet({ meetLink: raw.trim() });
    }
    function opsBotActAdd(){
      const raw = prompt('Nueva frase gatillo (el bot se activa si el PRIMER mensaje la contiene).\nSe guarda en minúsculas y sin tildes:');
      if (!raw || !raw.trim()) return;
      _botSet({ activadores: [ ...((_botCfg && _botCfg.activadores) || []), raw.trim() ] });
    }
    function opsBotActDel(i){
      const act = ((_botCfg && _botCfg.activadores) || []).filter((_, x) => x !== i);
      _botSet({ activadores: act }, '¿Quitar este gatillo?');
    }
    function opsBotChat(tel, pausar){
      _botSet({ chat: { telefono: tel, pausar } });
    }
    /* ── 💰 Cobranza: la libreta de números de cobro ─────────────────────
       La escalera manda WhatsApp SOLO al número explícito de esta libreta
       (_billing.whatsappCobro). Local sin número = sigue por push/email. */
    function cobranzaPanel(v){
      const rows = (v && v.rows) || [];
      const conWa = rows.filter(r => r.whatsappCobro).length;
      const fmtTel = t => t ? ('+' + String(t).replace(/^(56)(9)(\d{4})(\d{4})$/, '$1 $2 $3 $4')) : null;
      return `<div class="panel" style="margin-top:14px">
        <h3>💰 Cobranza · números de cobro
          <span class="tag ${conWa ? 'g' : ''}">${conWa}/${rows.length} con WhatsApp</span>
          <span class="muted" style="margin-left:auto;font-size:11px;text-transform:none;letter-spacing:0">el aviso sale de TU número · sin número = push/email</span>
        </h3>
        ${rows.length ? rows.map(r => `
          <div class="loc">
            <span class="dot ${r.diasAtraso > 0 ? 'warn' : (r.whatsappCobro ? 'on' : 'off')}"></span>
            <strong>${r.nombre}</strong>
            <span class="muted">${clp(r.montoConIva)} c/IVA · ${r.diasAtraso > 0
              ? '<span style="color:var(--red)">venció hace ' + r.diasAtraso + ' d</span>'
              : 'vence ' + (r.vence || '—')}${r.autopay ? ' · autopay: ' + r.autopay : ''}</span>
            <span style="margin-left:auto;display:flex;align-items:center;gap:8px">
              ${r.whatsappCobro
                ? `<span style="font-size:12px;color:var(--green)">📱 ${fmtTel(r.whatsappCobro)}</span>`
                : '<span class="muted" style="font-size:11px">sin número</span>'}
              <button class="mini" onclick="opsCobroNum('${r.tid}','${r.whatsappCobro || ''}')">${r.whatsappCobro ? 'editar' : '+ número'}</button>
              ${r.whatsappCobro ? `<button class="mini danger" onclick="opsCobroQuitar('${r.tid}')">quitar</button>` : ''}
            </span>
          </div>`).join('') : '<p class="muted">Sin locales en _billing.</p>'}
      </div>`;
    }
    async function opsCobroNum(tid, actual){
      const raw = prompt('WhatsApp de cobro de "' + tid + '" (a este número le llegan los avisos de mensualidad DESDE TU NÚMERO):', actual ? '+' + actual : '+569');
      if (raw === null || !raw.trim()) return;
      try { await _fn('cobranzaConfigSet')({ tenantId: tid, whatsappCobro: raw }); await refrescarCobranza(); }
      catch(e){ alert('Error: ' + e.message); }
    }

      if (!confirm('Quitar el número de cobro de "' + tid + '"? Vuelve a avisos por push/email.')) return;
      try { await _fn('cobranzaConfigSet')({ tenantId: tid, whatsappCobro: '' }); await refrescarCobranza(); }
      catch(e){ alert('Error: ' + e.message); }

    function verChatVentas(tel){
      const c = ((_botCfg && _botCfg.convs) || []).find(x => x.telefono === tel);

      const wrap = document.createElement('div');

      wrap.onclick = e => { if (e.target === wrap) wrap.remove(); };
      wrap.innerHTML = `<div class="box">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">

          <div class="meta">${c.respHoy} resp. hoy${c.silenciado ? ' · 🔇 pausado' : ''} · ${c.turnos.length} turnos</div>
          <div style="max-height:55vh;overflow-y:auto">
            ${c.turnos.map(t => `<div class="msg ${t.de === 'bot' ? 'assistant' : 'user'}">${t.de === 'bot' ? '🤖' : '👤'} ${String(t.texto).replace(/</g, '&lt;')}</div>`).join('')}

    async function opsAsignar(tenantId, chipId, activo){
      const payload = { tenantId };
      if (chipId != null)  payload.chipId = chipId;
      if (activo != null)  payload.activo = activo;
      if (activo === false && !confirm('¿Apagar las confirmaciones por chip en este local?')) return;
      try { await _fn('plataformaAsignar')(payload); await refrescarChips(); }
      catch(e){ alert('Error: ' + e.message); }
    }

    async function opsEncenderLocal(){
      const tid  = document.getElementById('ops-nuevo-local').value;
      const chip = document.getElementById('ops-nuevo-chip').value;
      if (!tid || !chip) return;
      try { await _fn('plataformaAsignar')({ tenantId: tid, chipId: chip, activo: true }); await refrescarChips(); }
      catch(e){ alert('Error: ' + e.message); }
    }

    async function opsDesvincularChip(chipId){
      if (!confirm('Vas a cerrar la sesión del chip "' + chipId + '".\n\nLos locales asignados a EL dejan de recibir confirmaciones.')) return;
      const fn = _fn('plataformaDesvincular');
      try { await fn({ chipId }); }
      catch(e){
        // La CF frena si el chip todavía atiende locales: quedarse sin número
        // no falla en ninguna parte, simplemente se quedan mudos.
        if (e.code === 'functions/failed-precondition'){
          if (!confirm(e.message + '\n\n¿Desvincular igual?')) return;
          try { await fn({ chipId, confirmado: true }); }
          catch(e2){ alert('Error: ' + e2.message); return; }
        } else { alert('Error: ' + e.message); return; }
      }
      await refrescarChips();
    }

    /* QR de vinculación. `chipId` null = chip nuevo (lo pide). */
    async function opsVincularChip(chipId){
      let nombre = null;
      if (!chipId){
        const raw = prompt('Identificador del chip nuevo (minúsculas, sin espacios).\nEj: "sion" si es el chip dedicado a Sion.\n\nSe usa en las rutas internas y no se puede cambiar después.');
        if (raw === null) return;
        chipId = String(raw).trim().toLowerCase();
        if (!/^[a-z0-9][a-z0-9_-]{1,23}$/.test(chipId)){
          alert('Identificador inválido: minúsculas, números, guion o guion bajo (2 a 24 caracteres).');
          return;
        }
        nombre = prompt('Nombre para mostrar (opcional)', 'Chip ' + chipId) || null;
      }

      const ov = document.createElement('div');
      ov.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(2,6,23,.93);display:flex;align-items:center;justify-content:center;padding:16px';
      ov.innerHTML = '<div style="background:#0f172a;border:1px solid rgba(148,163,184,.2);border-radius:14px;padding:22px;max-width:340px;width:100%;text-align:center">'
        + '<p id="q-t" style="font-weight:700;margin:0 0 10px">Generando QR…</p>'
        + '<div id="q-qr" style="min-height:220px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px">Conectando con el VPS…</div>'
        + '<p id="q-s" class="muted" style="font-size:11px;margin:10px 0 0">WhatsApp → Dispositivos vinculados → Vincular dispositivo</p>'
        + '<button id="q-x" style="margin-top:12px;width:100%">Cerrar</button></div>';
      document.body.appendChild(ov);
      let vivo = true;
      const cerrar = () => { vivo = false; ov.remove(); cargar(); };
      ov.querySelector('#q-x').onclick = cerrar;

      try {
        const r = await _fn('plataformaVincular')({ chipId, nombre });
        const qr = r.data && r.data.qr;
        ov.querySelector('#q-t').textContent = 'Escanea con el chip';
        ov.querySelector('#q-qr').innerHTML = qr
          ? '<img src="' + qr + '" alt="QR" style="width:100%;max-width:240px;border-radius:8px;background:#fff;padding:8px">'
          : '<span style="color:#f87171">El VPS no devolvió QR. Reintenta.</span>';

        // El QR caduca solo: se sondea hasta que la sesión quede abierta.
        const estado = _fn('plataformaEstado');
        for (let i = 0; i < 60 && vivo; i++){
          await new Promise(res => setTimeout(res, 3000));
          if (!vivo) return;
          try {
            const e = await estado({ chipId });
            if (e.data && e.data.estado === 'open'){
              ov.querySelector('#q-t').textContent = '✅ Chip vinculado';
              ov.querySelector('#q-qr').innerHTML = '<span style="color:#4ade80;font-size:44px">✓</span>';
              ov.querySelector('#q-s').textContent = 'Ahora asígnale los locales que va a atender.';
              setTimeout(cerrar, 1600);
              return;
            }
          } catch(_){}
        }
      } catch(e){
        ov.querySelector('#q-t').textContent = 'Error';
        ov.querySelector('#q-qr').innerHTML = '<span style="color:#f87171;font-size:12px">' + e.message + '</span>';
      }
    }

      // ── Pestañas: recordar dónde estaba (sobrevive al Actualizar) ──
      const setTab = (n) => {
        try { localStorage.setItem('opsTab', n); } catch(_){}

      document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
      montarSimulador();
      let tabIni = 'resumen';
      try { tabIni = localStorage.getItem('opsTab') || 'resumen'; } catch(_){}
      if (!document.querySelector('.sec[data-sec="' + tabIni + '"]')) tabIni = 'resumen';

      document.getElementById('refresh').onclick = () => cargar(true);
      document.getElementById('out').onclick = () => firebase.auth().signOut();

      // ── Kill switch ──
      // Solo apaga, nunca enciende: encender es una decisión deliberada que
      // pasa por el panel del local. Acá el botón va en una sola dirección,
      // que es la que no se puede equivocar a las 3 de la mañana.
      document.getElementById('panic').onclick = async () => {
        if(!confirm('Apagar bot Y confirmaciones en TODOS los locales.\n\nSe vuelve a encender uno por uno desde el panel de cada local. ¿Confirmas?')) return;
        await kill({ alcance:'global', que:'todo' });
      };
      document.querySelectorAll('[data-kill]').forEach(b => {

    async function kill(payload){
      try{
        const fn = firebase.app().functions('us-central1').httpsCallable('opsKillSwitch');
        const r = await fn(payload);
        alert(`Listo: ${r.data.apagados} local(es) apagado(s).`);
        cargar();
      }catch(e){ alert('No se pudo apagar: ' + (e.message||e)); }
    }

    // ── Sandbox de chat con la IA (pestaña "Probar IA") ────────────────
    // Reusa el callable `waSimularBot` que ya usa el panel del local. Desde
    // ops se le puede pasar `tenantId` porque el caller es bootstrap admin,
    // así que sirve para probar CUALQUIER local — por defecto `delnero`, que
    // es el sandbox oficial de la plataforma.
    //
    // El historial vive solo en esta pestaña: es una prueba, no una
    // conversación que haya que persistir.
    function montarSimulador(){
      const form = document.getElementById('sim-form');
      if (!form) return;
      const caja = document.getElementById('sim-chat');
      const txt  = document.getElementById('sim-txt');
      const send = document.getElementById('sim-send');
      const sel  = document.getElementById('sim-tid');
      const cuota= document.getElementById('sim-cuota');
      let historial = [];

      const esc = (s) => String(s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
      const pinta = (rol, texto, tools) => {
        const d = document.createElement('div');
        d.className = 'msg ' + (rol === 'user' ? 'user' : 'assistant');
        d.innerHTML = (rol === 'user' ? '👤 ' : '🤖 ') + esc(texto)
          + (tools && tools.length ? `<div class="muted" style="font-size:10.5px;margin-top:5px">🔧 ${esc(tools.join(' · '))}</div>` : '');
        caja.appendChild(d);
        caja.scrollTop = caja.scrollHeight;
        return d;
      };

      const reiniciar = () => { historial = []; caja.innerHTML = ''; cuota.textContent = ''; };
      document.getElementById('sim-reset').onclick = reiniciar;
      sel.onchange = reiniciar;   // otro local = otra conversación

      form.onsubmit = async (e) => {
        e.preventDefault();
        const mensaje = txt.value.trim();
        if (!mensaje) return;
        txt.value = '';
        pinta('user', mensaje);
        historial.push({ role: 'user', content: mensaje });
        const esperando = pinta('assistant', 'escribiendo…');
        send.disabled = true;
        try {
          const r = await _fn('waSimularBot')({
            tenantId: sel.value, texto: mensaje,
            historial: historial.slice(0, -1),   // el turno actual va en `texto`
          });
          const d = r.data || {};
          esperando.remove();
          if (d.ok === false) {
            pinta('assistant', '⚠️ ' + (d.motivo || 'No se pudo simular.'));
            historial.pop();
          } else {
            pinta('assistant', d.respuesta, d.herramientas);
            historial.push({ role: 'assistant', content: d.respuesta });
            if (typeof d.pruebasRestantes === 'number') {
              cuota.textContent = `${d.pruebasRestantes} pruebas restantes hoy en este local`;
            }
          }
        } catch (err) {
          esperando.remove();
          pinta('assistant', '⚠️ ' + (err.message || err));
          historial.pop();
        } finally {
          send.disabled = false;
          txt.focus();
        }
      };
    }

    // Visor de conversaciones: el primer fin de semana la pregunta no es
    // cuántos mensajes salieron, sino si el bot está respondiendo bien.
    async function verChats(tid){
      const wrap = document.createElement('div');
      wrap.className = 'modal';
      wrap.innerHTML = `<div class="box"><p class="muted">Cargando conversaciones de ${tid}…</p></div>`;
      wrap.onclick = e => { if(e.target===wrap) wrap.remove(); };
      document.body.appendChild(wrap);
      try{
        const fn = firebase.app().functions('us-central1').httpsCallable('opsConversaciones');
        const r = await fn({ tenantId: tid, limit: 8 });
        const cs = r.data.conversaciones || [];
        wrap.querySelector('.box').innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <h3 style="margin:0;font-size:14px">Últimas conversaciones · ${tid}</h3>
            <button class="mini" id="cerrar">Cerrar</button>
          </div>
          ${cs.length ? cs.map(c => `
            <div class="chat">
              <div class="meta">${c.chat}${c.nombre?` · ${c.nombre}`:''} · ${c.respHoy} resp. hoy${c.silenciado?' · 🔇 en pausa':''}${c.pendiente?` · ⏳ cita ${c.pendiente}`:''} · ${(c.turnos||[]).length} turnos</div>
              <div style="max-height:50vh;overflow-y:auto">
                ${(c.turnos||[]).map(t => `<div class="msg ${t.rol}">${t.rol==='user'?'👤':'🤖'} ${String(t.texto).replace(/</g,'&lt;')}</div>`).join('')}
              </div>
            </div>`).join('') : '<p class="muted">Sin conversaciones todavía.</p>'}`;
        wrap.querySelector('#cerrar').onclick = () => wrap.remove();
      }catch(e){
        wrap.querySelector('.box').innerHTML = `<p style="color:var(--red)">${e.message||e}</p><button class="mini" onclick="this.closest('.modal').remove()">Cerrar</button>`;
      }
    }

    /* ═══════════════════════════════════════════════════════════════════
       CARGA EN DOS OLAS

       Antes: 5 callables en paralelo y el panel en blanco hasta que volvía
       la más lenta — `opsMetrics` recorre 36 locales haciendo ~600 lecturas,
       así que eran 3-8 s de "Cargando métricas…". Peor: cada acción del
       panel llamaba a `cargar()` de nuevo, así que marcar UN lead pagaba esa
       cuenta completa otra vez.

       Ahora:
         Ola 1 — `opsSnapshot`: UNA lectura de un doc que el cron dejó
                 masticado. Trae métricas + Meta Ads y pinta al toque.
         Ola 2 — las tres callables baratas (leads, bot, cobranza), en
                 paralelo y SIN bloquear el pintado. Cuando llegan, repintan
                 solo su sección.

       Y las mutaciones ya no recargan nada global: refrescan su propia
       sección. Ver `repintar()`.
       ═══════════════════════════════════════════════════════════════════ */
    const ESTADO = {
      metrics:null, metaAds:null, chips:null,
      ventas:null, botCfg:null, cobranza:null,
      edadSegundos:0, parcial:false, cargando:false,
    };

    /** Cuán viejo es el dato que se está mirando. Se dice siempre: el panel
     *  sirve un snapshot, y fingir que es de este instante sería mentir en
     *  lo único que hace confiable a un tablero de operaciones. */
    function frescuraHtml(){
      if (ESTADO.cargando) return '<span class="fresh cargando"><span class="p"></span>actualizando…</span>';
      const s = ESTADO.edadSegundos || 0;
      const txt = s < 90 ? 'recién' : s < 3600 ? `hace ${Math.round(s/60)} min` : `hace ${Math.round(s/3600)} h`;
      // Sobre 15 min el cron se saltó al menos dos vueltas: vale la pena avisar.
      return `<span class="fresh ${s > 900 ? 'viejo' : ''}"><span class="p"></span>datos de ${txt}</span>`;
    }

    function seccionVentas(){
      if (!ESTADO.ventas && !ESTADO.botCfg) return '<p class="muted">Cargando leads…</p>';
      return (ESTADO.ventas ? leadsPanel(ESTADO.ventas) : '<p class="muted">No se pudo cargar el módulo de leads.</p>')
           + (ESTADO.botCfg ? botVentasPanel(ESTADO.botCfg) : '');
    }
    function seccionCobranza(){
      if (!ESTADO.cobranza) return '<p class="muted">Cargando cobranza…</p>';
      return cobranzaPanel(ESTADO.cobranza);
    }
    /* `full` para que la barra de cuenta + botón ocupe la fila completa: desde
       1280px la sección es una grilla y sin eso el botón queda encerrado en la
       primera columna, lejos del borde derecho. */
    function seccionAds(){
      return `<div class="full" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="muted" style="font-size:12px">Cuenta ${(ESTADO.metaAds && ESTADO.metaAds.adAccountId) || '—'}</span>
          <button id="adsRefresh">↻ Refrescar ads</button>
        </div>${metaAdsPanel(ESTADO.metaAds)}`;
    }

    /** Repinta UNA sección sin tocar el resto del DOM: conserva la pestaña
     *  activa, el scroll y cualquier cosa que el operador tenga abierta. */
    function repintar(sec){
      const el = document.querySelector(`.sec[data-sec="${sec}"]`);
      if (!el) return;
      if (sec === 'ventas')   el.innerHTML = seccionVentas();
      if (sec === 'cobranza') el.innerHTML = seccionCobranza();
      const f = document.getElementById('frescura');
      if (f) f.innerHTML = frescuraHtml();
      pintarBadges();
    }

    /** Los contadores de las pestañas viven fuera de las secciones, así que un
     *  repintado parcial no los toca. Sin esto, "Ventas · 2" nunca aparecería
     *  en la primera carga: los leads llegan en la ola 2, después del render. */
    function pintarBadges(){
      const set = (tab, txt) => {
        const b = document.querySelector(`.tabs button[data-tab="${tab}"]`);
        if (b) b.textContent = txt;
      };
      const pend = ESTADO.ventas ? (ESTADO.ventas.leads||[]).filter(l => l.estado === 'reunion_solicitada').length : 0;
      set('ventas', `🎯 Ventas${pend ? ' · ' + pend : ''}`);
      const atrasado = ESTADO.cobranza && (ESTADO.cobranza.rows||[]).some(r => r.diasAtraso > 0);
      set('cobranza', `💰 Cobranza${atrasado ? ' · 🔴' : ''}`);
    }

    /** Refresca solo los datos de ventas (3 lecturas) y repinta esa sección.
     *  Reemplaza al `cargar()` que disparaban las acciones de leads/bot. */
    async function refrescarVentas(){
      const [rv, rb] = await Promise.all([
        _fn('ventasLeads')({}).catch(() => null),
        _fn('ventasBotConfig')({}).catch(() => null),
      ]);
      if (rv) ESTADO.ventas = rv.data;
      if (rb) ESTADO.botCfg = rb.data;
      repintar('ventas');
    }
    async function refrescarCobranza(){
      const rk = await _fn('cobranzaConfig')({}).catch(() => null);
      if (rk) ESTADO.cobranza = rk.data;
      repintar('cobranza');
    }
    /** Asignar/desvincular chips cambia el mapa local↔chip. Solo se recarga esa
     *  lista: las métricas de los 36 locales no tienen nada que ver. */
    async function refrescarChips(){
      const rc = await _fn('plataformaChips')({}).catch(() => null);
      if (rc) ESTADO.chips = rc.data;
      const w = document.querySelector('.sec[data-sec="whatsapp"]');
      if (w && ESTADO.chips && ESTADO.metrics) {
        w.innerHTML = chipsAdminPanel(ESTADO.chips.chips, ESTADO.chips.locales)
          + ((ESTADO.metrics.barberia && ESTADO.metrics.barberia.chips) || []).map(chipPanel).join('')
          + metaWaPanel(ESTADO.metrics.metaWhatsApp);
      }
    }
    /** Meta Ads se refresca solo: vuelve a pegarle a la Marketing API sin
     *  recalcular los 36 locales, que es lo caro y no tiene nada que ver. */
    async function refrescarAds(btn){
      const txt = btn ? btn.textContent : null;
      if (btn) { btn.textContent = 'Consultando a Meta…'; btn.disabled = true; }
      try {
        const r = await _fn('opsMetaAdsRefrescar')({});
        ESTADO.metaAds = (r.data && r.data.metaAds) || ESTADO.metaAds;
        const el = document.querySelector('.sec[data-sec="ads"]');
        if (el) {
          el.innerHTML = seccionAds();
          const b = document.getElementById('adsRefresh');
          if (b) b.onclick = () => refrescarAds(b);
        }
      } catch(e){
        alert('No pude leer Meta: ' + (e.message || e));
        if (btn) { btn.textContent = txt; btn.disabled = false; }
      }
    }

    /** Ola 2: lo barato. No bloquea el primer pintado. */
    function cargarLivianos(){
      _fn('ventasLeads')({}).then(r => { ESTADO.ventas = r.data; repintar('ventas'); }).catch(() => {});
      _fn('ventasBotConfig')({}).then(r => { ESTADO.botCfg = r.data; repintar('ventas'); }).catch(() => {});
      _fn('cobranzaConfig')({}).then(r => { ESTADO.cobranza = r.data; repintar('cobranza'); }).catch(() => {});
      // Los chips viven dentro del render grande (pestaña WhatsApp); si llegan
      // después del primer pintado se dibujan en el siguiente repintado global.
      _fn('plataformaChips')({}).then(r => {
        ESTADO.chips = r.data;
        const w = document.querySelector('.sec[data-sec="whatsapp"]');
        if (w && ESTADO.metrics) {
          w.innerHTML = chipsAdminPanel(ESTADO.chips.chips, ESTADO.chips.locales)
            + ((ESTADO.metrics.barberia && ESTADO.metrics.barberia.chips) || []).map(chipPanel).join('')
            + metaWaPanel(ESTADO.metrics.metaWhatsApp);
        }
      }).catch(() => {});
    }

    /**
     * @param {boolean} fresco true = recalcular de verdad (botón "Actualizar").
     *   false/omitido = servir el snapshot del cron, que es el caso normal.
     */
    async function cargar(fresco){
      const primeraVez = !ESTADO.metrics;
      if (primeraVez) app.innerHTML = `<div class="login"><p class="muted">Cargando…</p></div>`;
      ESTADO.cargando = true;
      const f = document.getElementById('frescura');
      if (f) f.innerHTML = frescuraHtml();

      try {
        const r = (await _fn('opsSnapshot')({ fresco: !!fresco })).data || {};
        ESTADO.metrics      = r.metrics || ESTADO.metrics;
        ESTADO.metaAds      = r.metaAds || ESTADO.metaAds;
        ESTADO.edadSegundos = r.edadSegundos || 0;
        ESTADO.parcial      = !!r.parcial;
        ESTADO.cargando     = false;

        if (!ESTADO.metrics) {
          app.innerHTML = `<div class="login"><h2>Sin datos</h2><p class="muted">El snapshot todavía no se ha generado. Pulsa Actualizar.</p>
            <button id="rt" style="margin-top:12px">Actualizar</button></div>`;
          document.getElementById('rt').onclick = () => cargar(true);
          return;
        }
        render(ESTADO.metrics, ESTADO.chips, ESTADO.ventas, ESTADO.botCfg, ESTADO.cobranza);
        if (primeraVez) cargarLivianos();
      } catch(e){
        ESTADO.cargando = false;
        app.innerHTML = `<div class="login"><h2>Sin acceso</h2><div id="err">${e.message||e}</div><button id="out" style="margin-top:12px">Salir</button></div>`;
        const b=document.getElementById('out'); if(b) b.onclick=()=>firebase.auth().signOut();
      }
    }

    firebase.auth().onAuthStateChanged(u => { if(u) cargar(); else loginView(); });
  </script>
</body>
</html>
