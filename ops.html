              ${next?`<button class="mini" onclick="platAccion('leadEstado',null,'${l.id}',this,'${next}')" title="Marcar ${next}">${next==='contactado'?'✓':'★'}</button>`:''}

            <input id="plat-buscar" placeholder="🔎 buscar local…" autocomplete="off" value="${esc(window._platBusca||'')}" oninput="window._platBusca=this.value;platFiltrarLocales()" style="background:var(--glass);color:#fff;border:1px solid var(--glass-border);border-radius:8px;padding:6px 12px;font-size:12px;width:220px;font-weight:400"></h3>

            const on = t.operativo !== false && t.status !== 'suspended';
            return `<button data-q="${esc(prosNorm((t.nombre||'')+' '+t.id))}" onclick="platAbrirTenant('${esc(t.id)}')" style="text-align:left;background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:9px 12px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:8px">

      const herramientasHtml = `<div class="panel full" style="margin-top:14px">

      const statsHtml = `<div class="panel full" style="margin-top:14px">

      return hudPlataforma(tenants) + kpis + soporteHtml + statsHtml + ingresosHtml + erroresHtml + leadsHtml + onbHtml + localesHtml + herramientasHtml
        + '<div id="plat-drawer"></div>';

    /* ── Estadísticas globales (migradas de /admin) ── */
    async function platCargarStats(btn){
      if(btn){btn.disabled=true;btn.textContent='⏳ sumando todos los locales…';}
      try{ const r=await _fn('opsPlatformStats')({}); platPintarStats(r.data); }

    }
    function platPintarStats(s){
      const h=document.getElementById('plat-stats'); if(!h) return;
      const desg=(arr)=>arr.slice(0,4).map(x=>esc(x.nombre)+' '+x.n).join(' · ')+(arr.length>4?' · +'+(arr.length-4)+' locales':'');

          ${card(s.citasHoy,'Citas agendadas hoy',desg(s.hoyDesglose||[]))}
          ${card(s.citasParaHoy,'Citas para hoy',desg(s.paraHoyDesglose||[]))}

          ${card(num(s.citasMes),'Citas este mes','')}
          ${card(num(s.clientesUnicos),'Clientes únicos','dedup por teléfono')}
        </div>
        <div class="kpis" style="margin-top:10px">
          ${card(s.profesionales,'Profesionales activos','')}

          ${card(s.cancelacionPct+'%','Tasa cancelación','')}
          ${card(s.serviciosDistintos,'Servicios distintos','')}
        </div>
        <div class="kpis" style="margin-top:10px">
          ${card(num(s.sellosHist),'Sellos entregados','histórico')}
          ${card(num(s.sellosMes),'Sellos este mes','')}
          ${card(s.premiosHist,'Premios canjeados','histórico')}

        </div>`;
    }

    /* ── Ingresos proyectados (migrado de /admin, bootstrap) ── */
    async function platCargarIngresos(btn, mes){
      if(btn){btn.disabled=true;btn.textContent='⏳';}
      try{ const r=await _fn('opsIngresos')(mes?{mes}:{}); window._platIngresos=r.data; platPintarIngresos(); }

      if(btn){btn.disabled=false;btn.textContent='↻';}
    }
    function platMesNav(delta){

    /* ── 📅 Contenido: plan semanal de Instagram (@synaptechspa) ─────────
       El plan se escribe UNA VEZ por semana (ritual con Claude: se planifica
       todo lo que puede mutar durante la semana — reels, historias,

    const CONT_CHIP = {
      pendiente:  ['⚪ pendiente',  '#64748b'],
      produccion: ['🛠 producción', '#f0b429'],
      listo:      ['🟢 listo',      '#9CCC3C'],

    function contSemana(){
      const C = ESTADO.contenido;
      if (!C || !C.semanas || !C.semanas.length) return null;

    function contDiaLabel(ymd){
      try {
        const d = new Date(String(ymd) + 'T12:00:00');
        const s = d.toLocaleDateString('es-CL', { weekday: 'long', day: 'numeric' });
        return s.charAt(0).toUpperCase() + s.slice(1);

    function seccionContenido(){
      const C = ESTADO.contenido;
      if (!C) return `<div class="panel"><h3>📅 Contenido</h3><p class="muted"><span class="fresh cargando"><span class="p"></span>cargando el plan…</span></p></div>`;
      const S = contSemana();
      if (!S) return `<div class="panel"><h3>📅 Contenido</h3><p class="muted">Todavía no hay un plan semanal. Se crea en el ritual de planificación (un día a la semana, con Claude).</p></div>`;

      const hoy = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Santiago' });
      const items = (S.items || []).slice().sort((a, b) =>
        String(a.dia).localeCompare(String(b.dia)) || String(a.hora || '').localeCompare(String(b.hora || '')));
      const activos = items.filter(i => i.estado !== 'descartado');
      const n = (e) => activos.filter(i => i.estado === e).length;

      const selector = (ESTADO.contenido.semanas || []).length > 1
        ? `<select onchange="ESTADO.contenidoSemana=this.value;repintar('contenido')" style="background:var(--glass);color:#fff;border:1px solid var(--glass-border);border-radius:8px;padding:5px 9px;font-size:12px">
            ${ESTADO.contenido.semanas.map(s => `<option value="${s.id}" ${s.id === S.id ? 'selected' : ''}>Semana del ${s.id}</option>`).join('')}
          </select>` : '';

      let cuerpo = '', diaAnt = null;
      for (const it of items) {
        if (it.dia !== diaAnt) {
          diaAnt = it.dia;
          const esHoy = it.dia === hoy;
          cuerpo += `<div style="margin:16px 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:${esHoy ? 'var(--brand)' : 'var(--soft)'};font-weight:700">${contDiaLabel(it.dia)}${esHoy ? ' · HOY' : ''}</div>`;
        }
        const [chipTxt, chipColor] = CONT_CHIP[it.estado] || CONT_CHIP.pendiente;
        cuerpo += `<div style="border:1px solid var(--glass-border);border-radius:12px;padding:10px 13px;margin-bottom:8px;${it.estado === 'subido' ? 'opacity:.55;' : ''}">
          <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">
            <button class="agchip" onclick="contEstado('${S.id}','${it.id}')" title="Clic para avanzar: pendiente → producción → listo → subido"
              style="border-color:${chipColor}55;color:${chipColor};font-weight:600">${chipTxt}</button>
            <b style="font-size:13px">${CONT_TIPO[it.tipo] || it.tipo} — ${esc(it.titulo || '')}</b>
            ${it.hora ? `<span class="muted" style="font-size:11.5px">🕐 ${esc(it.hora)}</span>` : ''}
          </div>
          ${it.notas ? `<div class="muted" style="font-size:12px;margin-top:6px;line-height:1.5">${esc(it.notas)}</div>` : ''}
          ${it.caption ? `<div style="margin-top:8px;border:1px dashed var(--glass-border);border-radius:9px;padding:8px 10px">
            <div id="cap-${it.id}" style="font-size:12px;white-space:pre-wrap;line-height:1.5;color:var(--ink)">${esc(it.caption)}</div>
            <button class="mini" style="margin-top:7px" onclick="contCopiar('${it.id}', this)">📋 copiar</button>
          </div>` : ''}
          ${it.asset ? `<div class="muted" style="font-size:11px;margin-top:7px">📁 ${esc(it.asset)}</div>` : ''}
        </div>`;
      }

      return `<div class="panel full">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
            <h3 style="margin:0">📅 ${tip('Plan de contenido — ' + esc(S.titulo || S.id), 'El plan semanal de Instagram. Se planifica completo un día a la semana (ritual con Claude) y acá se va marcando qué se subió. Clic en el chip de estado para avanzarlo; el caption se copia con un botón.')}</h3>
            ${selector}
          </div>
          <div class="muted" style="font-size:12px;margin:8px 0 2px">
            ${n('subido')} subidas · <span style="color:#9CCC3C">${n('listo')} listas para subir</span> · ${n('produccion')} en producción · ${n('pendiente')} pendientes
          </div>
          ${cuerpo || '<p class="muted">Semana sin piezas.</p>'}
        </div>`;
    }

    /** Avanza el estado de una pieza con actualización optimista: se pinta al
     *  tiro y si el servidor rechaza, se revierte. JAMÁS recarga el panel. */
    async function contEstado(semana, itemId){
      const S = contSemana();
      if (!S) return;
      const it = (S.items || []).find(i => i && i.id === itemId);
      if (!it) return;
      const orden = ['pendiente', 'produccion', 'listo', 'subido'];
      const antes = it.estado;
      it.estado = orden[(orden.indexOf(it.estado) + 1) % orden.length];
      repintar('contenido');
      try { await _fn('opsContenidoSet')({ semana, itemId, estado: it.estado }); }
      catch (e) { it.estado = antes; repintar('contenido'); alert('No pude guardar el estado: ' + (e.message || e)); }
    }
    window.contEstado = contEstado;

    function contCopiar(id, btn){
      const el = document.getElementById('cap-' + id);
      if (!el) return;
      const txt = el.innerText;
      const listo = () => { btn.textContent = '✅ copiado'; setTimeout(() => { btn.textContent = '📋 copiar'; }, 1400); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(listo, () => window.prompt('Copia el caption:', txt));
      else window.prompt('Copia el caption:', txt);
    }
    window.contCopiar = contCopiar;

    function seccionProspeccion(){
      return `<div id="pros-kpis" class="full"></div>
        <div id="pros-hoy" class="full"></div>
        <div id="pros-mapa-shell" class="full"></div>
        <div id="pros-rend" class="full"></div>
        <div id="pros-controles" class="full"></div>
        <div id="pros-reuniones" class="full"></div>
        <div id="pros-cola"></div>
        <div id="pros-borradores"></div>
        <div id="pros-feed"></div>
        <div id="pros-reactivables"></div>
        <div id="pros-tabla" class="full"></div>`;
    }

    const PROS_ESTADOS = {
      frio:'🧊 frío', contactado:'📨 contactado', respondio:'💬 respondió',
      reunion:'🤝 reunión', sin_respuesta:'😴 sin respuesta', cliente:'⭐ cliente',
      optout:'🔕 opt-out', descartado:'🗑 descartado',
    };
    // Orden en que se trabaja la calle — el MISMO que usa el backend para
    // decidir a quién redactarle primero. La primera comuna con prospectos
    // es la vista inicial del mapa.
    const PROS_COMUNAS = ['Viña del Mar', 'Valparaíso', 'Curauma', 'Providencia'];
    const prosNorm = (s) => String(s||'').toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');

    /** Pinta (o repinta) la pestaña llenando cada cascarón por separado. */
    function prosPintar(){
      const sec = document.querySelector('.sec[data-sec="prospeccion"]');
      if (!sec) return;
      if (!document.getElementById('pros-tabla')) sec.innerHTML = seccionProspeccion();
      const pon = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
      const P = ESTADO.prospeccion;
      if (!P) {
        pon('pros-kpis', '<p class="muted"><span class="fresh cargando"><span class="p"></span>cargando la cartera…</span></p>');
        return;
      }
      pon('pros-kpis', prosKpisHtml(P));
      pon('pros-hoy', prosHoyHtml(P));
      pon('pros-rend', prosRendimientoHtml(P));
      // El cascarón del mapa se llena UNA vez: repintarlo destruiría el
      // lienzo de Leaflet y eso es exactamente el parpadeo que se eliminó.
      if (!document.getElementById('pros-mapa')) pon('pros-mapa-shell', prosMapaHtml());
      prosPintarChipsComuna();
      pon('pros-reuniones', prosReunionesHtml(P));
      pon('pros-controles', prosControlesHtml(P));
      pon('pros-cola', prosColaHtml(P));
      pon('pros-borradores', prosBorradoresHtml(P));
      pon('pros-feed', prosFeedHtml(P));
      pon('pros-reactivables', prosReactivablesHtml(P));
      pon('pros-tabla', prosTablaHtml(P));
      prosAplicarFiltro();
      pintarBadges();
      prosInitMapa(false);
    }
    window.prosPintar = prosPintar;

    function prosKpisHtml(P){
      const f = P.funnel || {};
      const enJuego = (f.frio||0) + (f.contactado||0) + (f.respondio||0) + (f.reunion||0) + (f.sin_respuesta||0);
      const contactados = (f.contactado||0) + (f.sin_respuesta||0) + (f.respondio||0) + (f.reunion||0);
      /* Tramos IGUALES, no proporcionales: con 72 fríos y 2 contactados la
         versión proporcional aplastaba los tramos chicos hasta lo ilegible
         (mordió el 08-08). El peso lo dice el número, no el ancho. */
      const seg = (n, etiqueta, color, explica) => `<div style="flex:1;background:${color}1f;border-top-color:${color}">
          <b class="tnum" style="color:${color};font-size:15px">${n}</b>&nbsp;${tip(etiqueta, explica)}</div>`;
      const pctPaso = (a, b) => a ? Math.round(b / a * 100) + '%' : '—';

      /* Distinción por canal: por dónde se tocó a cada uno y por dónde
         contestaron — un prospecto puede tener toques en varios canales. */
      const ps = P.prospectos || [];
      const respondioYa = (p) => ['respondio','reunion','cliente'].includes(p.estado);
      const dmT = ps.filter(p => p.dmEnviadoEn);
      const emT = ps.filter(p => (p.emailsEnviados||0) > 0);
      const canalCard = (icono, nombre, tocados, resp, extra) => `<div style="flex:1;min-width:170px;border:1px solid var(--glass-border);border-radius:10px;padding:8px 12px;font-size:11.5px">
          <b>${icono} ${nombre}</b><br><span class="muted">${tocados} tocados · <span style="color:var(--brand)">${resp} respondieron</span>${tocados ? ` (${Math.round(resp/tocados*100)}%)` : ''}${extra ? ' · ' + extra : ''}</span></div>`;

      return `<div class="pros-linea"></div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span class="muted" style="font-size:12px">🛰 Centro de prospección — ${enJuego} negocios en juego</span>
          <span id="pros-sync" style="display:none" class="fresh cargando"><span class="p"></span>actualizando…</span>
        </div><div class="kpis">
          <div class="kpi"><div class="n tnum">${enJuego}</div><div class="k">${tip('Prospectos en cartera', 'Negocios en la base de prospección, sin contar descartados ni opt-out. Se cargan del scraping (Massiel/OSM), a mano, o quedan solos cuando alguien escribe.')}</div></div>
          <div class="kpi"><div class="n tnum">${contactados}</div><div class="k">${tip('Contactados', 'Ya recibieron al menos un toque: correo de la secuencia o DM enviado a mano desde la cola.')}</div></div>
          <div class="kpi"><div class="n tnum">${f.respondio||0}</div><div class="k">${tip('Respondieron', 'Contestaron por WhatsApp o Instagram después de un toque (las auto-respuestas de negocio no cuentan). El bot de ventas ya los está atendiendo.')}</div></div>
          <div class="kpi"><div class="n tnum">${f.reunion||0}</div><div class="k">${tip('Reuniones', 'Llegaron a reunión agendada o solicitada en tu agenda real. Es la meta de todo el embudo.')}</div></div>
        </div>
        <div class="pros-embudo" title="El embudo completo: de la calle a la reunión">
          ${seg(f.frio||0, 'fríos', '#64748b', 'Todavía sin ningún toque. La munición de la calle y de los canales.')}
          ${seg(contactados, 'contactados', '#f0b429', 'Con al menos un toque encima (DM, correo o visita marcada).')}
          ${seg((f.respondio||0) + (f.reunion||0), 'respondieron', '#9CCC3C', 'Con respuesta HUMANA después del toque; los auto-reply de negocio no cuentan.')}
          ${seg(f.reunion||0, 'reunión', '#C6F94E', 'La meta: hora tomada de verdad en tu agenda.')}
        </div>
        <div class="muted" style="font-size:11px;margin:6px 0 10px">conversión: cartera → contacto ${pctPaso(enJuego, contactados)} · contacto → respuesta ${pctPaso(contactados, (f.respondio||0) + (f.reunion||0))} · respuesta → reunión ${pctPaso((f.respondio||0) + (f.reunion||0), f.reunion||0)}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${canalCard('📸', 'DM Instagram', dmT.length, dmT.filter(respondioYa).length, '')}
          ${canalCard('✉️', 'Correo', emT.length, emT.filter(respondioYa).length, `${ps.reduce((a,p)=>a+(p.emailsEnviados||0),0)} enviados`)}
          ${canalCard('💬', 'Respuestas entrantes', ps.filter(p=>p.respondioCanal).length, ps.filter(p=>p.respondioCanal).length, `${ps.filter(p=>p.respondioCanal==='whatsapp').length} por WA · ${ps.filter(p=>p.respondioCanal==='instagram').length} por IG`)}
        </div>`;
    }

    /** Tiempo relativo corto para el feed ("hace 2 h"). */
    function prosHace(t){
      if (!t) return '';
      const s = Math.max(60, Math.round((Date.now() - t) / 1000));
      if (s < 3600)  return `hace ${Math.round(s/60)} min`;
      if (s < 86400) return `hace ${Math.round(s/3600)} h`;
      return `hace ${Math.round(s/86400)} d`;
    }

    /* La misión de hoy: el módulo DICE qué hacer ahora, en el orden que más
       plata mueve — atender a los que respondieron gana siempre. */
    function prosHoyHtml(P){
      const ps = P.prospectos || [];
      const activos = (p) => !['optout','descartado'].includes(p.estado);
      const fila = (icono, texto, boton) => `<div class="pros-accion"><span>${icono} ${texto}</span>${boton || ''}</div>`;
      const acciones = [];

      const calientes = ps.filter(p => p.estado === 'respondio');
      if (calientes.length) {
        acciones.push(fila('🔥', `<b>${calientes.length} respondieron y esperan conversación:</b> ${calientes.slice(0,3).map(p => esc(p.negocio)).join(', ')}${calientes.length > 3 ? '…' : ''} — el bot los atiende, pero tu ojo cierra reuniones`, ''));
      }
      const dmListos = ps.filter(p => p.dmBorrador && activos(p)).length;
      if (dmListos) acciones.push(fila('📸', `<b>${dmListos} DM(s) redactados</b> listos para pegar en Instagram`, `<button class="mini" onclick="prosIrA('pros-cola')">ir a la cola</button>`));
      const correosOk = ps.filter(p => p.emailBorrador && activos(p)).length;
      if (correosOk) acciones.push(fila('✉️', `<b>${correosOk} correo(s)</b> esperando tu OK para salir`, `<button class="mini" onclick="prosIrA('pros-borradores')">revisarlos</button>`));
      const municion = ps.filter(p => p.estado === 'frio' && p.instagram && !p.dmBorrador).length;
      if (!dmListos && municion) acciones.push(fila('✍️', `Cola vacía y quedan <b>${municion} fríos con Instagram</b> sin mensaje redactado`, `<button class="mini" onclick="prosGenerarDMs(this)">redactar 5</button>`));
      const react = (P.reactivables || []).length;
      if (react && !(P.cfg || {}).reactivacionAuto) acciones.push(fila('♻️', `<b>${react} lead(s) propios</b> llevan 7–30 días fríos y nadie los toca`, `<button class="mini" onclick="prosIrA('pros-reactivables')">verlos</button>`));

      return `<div class="panel" style="margin-top:14px">
          <h3>🎯 ${tip('Misión de hoy', 'La lista corta de lo que más conviene hacer AHORA, ordenada por impacto: primero los que ya respondieron, después despachar lo redactado, y al final generar munición nueva.')}</h3>
          <p class="hint">El agente trabaja solo; esto es lo único que necesita de ti hoy.</p>
          ${acciones.length ? acciones.join('') : '<p class="muted" style="font-size:12.5px">✅ Nada urgente: los motores están corriendo y no hay pendientes humanos. Vuelve más tarde o redacta munición nueva.</p>'}
        </div>`;
    }

    /* Bitácora viva: cada toque y cada avance del embudo, con hora. Se arma
       de los datos que ya llegan al panel — cero lecturas extra. */
    function prosFeedHtml(P){
      const ev = [];
      for (const p of (P.prospectos || [])) {
        for (const t of (p.toques || [])) {
          if (!t.en) continue;
          ev.push({ t: t.en, color: '#f0b429', txt: `${t.tipo === 'email' ? '✉️ correo a' : '📤 DM a'} <b>${esc(p.negocio)}</b>` });
        }
        if (p.respondioEn) ev.push({ t: p.respondioEn, color: '#9CCC3C', txt: `💬 <b>${esc(p.negocio)}</b> respondió por ${p.respondioCanal === 'instagram' ? 'Instagram' : 'WhatsApp'}` });
        if (p.estado === 'reunion') ev.push({ t: p.updatedAt, color: '#C6F94E', txt: `🤝 <b>${esc(p.negocio)}</b> llegó a reunión` });
        if (p.estado === 'optout') ev.push({ t: p.updatedAt, color: '#e0645c', txt: `🔕 <b>${esc(p.negocio)}</b> pidió no recibir más` });
        if (p.estado === 'descartado') ev.push({ t: p.updatedAt, color: '#52525b', txt: `🗑 <b>${esc(p.negocio)}</b> descartado${p.descartadoMotivo ? ': ' + esc(p.descartadoMotivo) : ''}` });
      }
      ev.sort((a, b) => (b.t || 0) - (a.t || 0));
      const items = ev.slice(0, 14).map(e => `<div class="pros-feed-item">
          <span class="pros-dot" style="background:${e.color}"></span>
          <span style="flex:1">${e.txt}</span>
          <span class="muted" style="font-size:10.5px;white-space:nowrap">${prosHace(e.t)}</span>
        </div>`).join('');
      return `<div class="panel" style="margin-top:14px">
          <h3>📡 ${tip('Actividad en vivo', 'Todo lo que pasó en el embudo, en orden: toques enviados, respuestas, reuniones, bajas y descartes con su motivo.')}</h3>
          ${items || '<p class="muted" style="font-size:12px">Todavía no hay movimientos. El primer DM o correo aparece aquí.</p>'}
        </div>`;
    }

    /** Scroll suave a un panel de la pestaña (lo usa la misión de hoy). */
    function prosIrA(id){
      const el = document.getElementById(id);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    /* Rendimiento por palanca: tasas reales, no conteos. Lo que no se mide
       no mejora — esto es lo que decide si un mensaje se cambia o se mata. */
    function prosRendimientoHtml(P){
      const rend = P.rendimiento || null;
      if (!rend) return '';
      const pct = (n, d) => d ? Math.round(n / d * 100) + '%' : '—';
      const rendCard = (titulo, tasa, detalle, extra) => `<div style="border:1px solid var(--glass-border);border-radius:12px;padding:12px 14px">
          <div class="muted" style="font-size:11.5px;margin-bottom:4px">${titulo}</div>
          <div class="tnum" style="font-size:26px;font-weight:700">${tasa}</div>
          <div class="muted" style="font-size:11.5px;margin-top:4px">${detalle}</div>
          ${extra ? `<div style="font-size:11.5px;margin-top:2px;color:var(--brand)">${extra}</div>` : ''}
        </div>`;
      return `<div class="panel" style="margin-top:14px">
          <h3>📈 ${tip('Rendimiento por palanca', 'Tasa de respuesta REAL de cada tipo de mensaje saliente, medida sola por los triggers. Es la evidencia para decidir si un mensaje funciona o hay que cambiarlo.')}</h3>
          <p class="hint">Un prospecto cuenta como "respondió" cuando escribe por WhatsApp o Instagram después del toque; un rescate o reactivación cuenta cuando la conversación siguió creciendo después del mensaje. Ojo: las respuestas a los correos llegan directo a tu Gmail y no se pueden medir desde acá.</p>
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px">
            ${rendCard('📸 DMs manuales (frío)', pct(rend.dms.respondieron, rend.dms.enviados),
              `${rend.dms.enviados} enviados · ${rend.dms.respondieron} respondieron · ${rend.dms.reuniones} con reunión`,
              rend.dms.horasPromedio !== null ? `respuesta media: ${rend.dms.horasPromedio} h` : '')}
            ${rendCard('✉️ Correos (secuencia)', pct(rend.emails.respondieron, rend.emails.prospectos),
              `${rend.emails.prospectos} prospectos · ${rend.emails.correos} correos · ${rend.emails.bajas} baja(s)`,
              '')}
            ${rendCard('🌡 Rescates de tibios', pct(rend.rescates.contestaron, rend.rescates.enviados),
              `${rend.rescates.enviados} enviados · ${rend.rescates.contestaron} retomaron la conversación`,
              '')}
            ${rendCard('♻️ Reactivaciones WA', pct(rend.reactivaciones.contestaron, rend.reactivaciones.enviadas),
              `${rend.reactivaciones.enviadas} enviadas · ${rend.reactivaciones.contestaron} volvieron a hablar`,
              '')}
          </div>
        </div>`;
    }

    function prosMapaHtml(){
      return `<div class="panel" style="margin-top:14px">
          <h3 style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span>🗺 ${tip('Mapa de la cartera', 'Cada punto es un prospecto en su dirección real. El color dice en qué va: los verdes son plata en movimiento, los grises están por tocar.')}</span><button class="mini" onclick="prosMapaFullscreen()">⛶ Pantalla completa</button></h3>
          <p class="hint">Una vista por comuna, en el mismo orden en que se trabajan. Elige la zona, haz clic en un punto para el detalle, y usa ⛶ para verlo gigante (ahí la rueda del mouse hace zoom directo). Los prospectos agregados a mano se ubican solos al guardarlos.</p>

            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#64748b;margin-right:5px"></span>frío</span>
            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#f0b429;margin-right:5px"></span>contactado</span>
            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#9CCC3C;margin-right:5px"></span>respondió</span>
            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#C6F94E;margin-right:5px"></span>reunión</span>
            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#7c8b9d;margin-right:5px"></span>sin respuesta</span>
            <span><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:#e0645c;margin-right:5px"></span>opt-out</span>
          </div>
        </div>`;
    }

    /* Reuniones REALES desde la pestaña: toman candado en la agenda de
       Ignacio (misma cañería que las del bot) y disparan el recordatorio de
       las 08:30 por correo + WhatsApp el día antes y el mismo día. */
    function prosReunionesHtml(P){
      const reuniones = P.reuniones || [];
      const activos = (P.prospectos || []).filter(p => !['optout','descartado'].includes(p.estado));
      const filas = reuniones.map(r => `<div class="pros-accion" style="margin-bottom:6px">
          <span>${r.esHoy ? '<b style="color:var(--neon)">HOY</b> · ' : ''}<b>${esc(r.hablada)}</b> a las <b class="tnum">${esc(r.hora)}</b> ${r.canal === 'presencial' ? '🏪' : r.canal === 'online' ? '💻' : '🤖'} <b>${esc(r.negocio || r.nombre || r.contacto)}</b>${r.nombre && r.negocio ? ` · ${esc(r.nombre)}` : ''}${r.notas ? ` <span class="muted" style="font-size:11px">— ${esc(String(r.notas).slice(0, 70))}</span>` : ''}</span>
          <button class="mini" title="Cancela la reunión y libera la hora" onclick="prosReunionCancelar('${esc(r.contacto)}',this)">✖</button>
        </div>`).join('');

    /** Filtro en vivo de la cartera: busca + estado, sin repintar nada. */
    function prosAplicarFiltro(){
      const q = prosNorm(window._prosBusca || '');
      const est = window._prosFiltroEstado || '';
      document.querySelectorAll('#pros-tabla tbody tr[data-q]').forEach(tr => {
        tr.style.display = (!q || tr.dataset.q.includes(q)) && (!est || tr.dataset.estado === est) ? '' : 'none';
      });
      document.querySelectorAll('#pros-tabla [data-fe]').forEach(b => {
        const on = b.dataset.fe === est;
        b.style.borderColor = on ? 'var(--brand)' : '';
        b.style.color = on ? 'var(--brand)' : '';
      });
    }
    function prosFiltrarTabla(){ prosAplicarFiltro(); }
    function prosFiltroEstado(e){
      window._prosFiltroEstado = window._prosFiltroEstado === e ? '' : e;
      prosAplicarFiltro();
    }

    /* El mapa se crea UNA vez y sobrevive a los refrescos (su cascarón nunca
       se repinta): los datos nuevos solo actualizan la capa de pines. Solo un
       render global destruye el lienzo, y ahí sí se re-crea. Nunca se inicia
       con la pestaña oculta: display:none deja a Leaflet midiendo 0px. */
    const PROS_COLORES = {
      frio:'#64748b', contactado:'#f0b429', respondio:'#9CCC3C',
      reunion:'#C6F94E', cliente:'#C6F94E', sin_respuesta:'#7c8b9d',
      optout:'#e0645c', descartado:'#52525b',
    };

    /** Comunas presentes en la cartera, en el orden de trabajo. */
    function prosComunasVistas(){
      const P = ESTADO.prospeccion;
      const puntos = ((P && P.prospectos) || []).filter(p => p.lat !== null && p.lng !== null);
      const vistas = [];
      for (const c of PROS_COMUNAS) {
        if (puntos.some(p => prosNorm(p.comuna).includes(prosNorm(c)))) vistas.push(c);
      }
      for (const p of puntos) {
        if (p.comuna && !vistas.some(c => prosNorm(p.comuna).includes(prosNorm(c))) && !vistas.includes(p.comuna)) vistas.push(p.comuna);
      }
      return { vistas, puntos };
    }

    function prosPintarChipsComuna(){
      const cont = document.getElementById('pros-mapa-chips');
      if (!cont || !ESTADO.prospeccion) return;
      const { vistas, puntos } = prosComunasVistas();
      if (!window._prosComunaSel ||
          (window._prosComunaSel !== 'todas' && !vistas.some(c => prosNorm(c) === prosNorm(window._prosComunaSel)))) {
        window._prosComunaSel = vistas[0] || 'todas';
      }
      const chip = (nombre, n) => {
        const on = prosNorm(window._prosComunaSel) === prosNorm(nombre);
        return `<button class="mini" style="${on ? 'border-color:var(--brand);color:var(--brand)' : ''}" onclick="prosMapaComuna('${String(nombre).replace(/'/g, '')}')">${esc(nombre)}${n !== null ? ` · ${n}` : ''}</button>`;
      };
      cont.innerHTML = vistas.map(c =>
        chip(c, puntos.filter(p => prosNorm(p.comuna).includes(prosNorm(c))).length)).join('')
        + chip('todas', puntos.length);

      // Cobertura de la zona elegida: cuánto de esa calle ya se tocó.
      const cob = document.getElementById('pros-mapa-cobertura');
      if (cob) {
        const sel = window._prosComunaSel;
        const zona = sel === 'todas' ? puntos : puntos.filter(p => prosNorm(p.comuna).includes(prosNorm(sel)));
        const tocados = zona.filter(p => p.estado !== 'frio').length;
        const pct = zona.length ? Math.round(tocados / zona.length * 100) : 0;
        cob.innerHTML = `<span class="muted" style="font-size:11px">cobertura de ${esc(sel === 'todas' ? 'toda la cartera' : sel)}: <b class="tnum">${tocados}/${zona.length}</b> tocados (${pct}%)</span><div class="pros-barra"><span style="width:${pct}%"></span></div>`;
      }
    }
    function prosMapaComuna(c){
      window._prosComunaSel = c;
      prosPintarChipsComuna();
      prosInitMapa(true);
    }
    function prosMapaFullscreen(){
      const cont = document.getElementById('pros-mapa');
      if (!cont) return;
      if (document.fullscreenElement) document.exitFullscreen();
      else cont.requestFullscreen().catch(() => alert('El navegador no permitió la pantalla completa.'));
    }
    // Al entrar o salir de pantalla completa Leaflet tiene que re-medirse.
    document.addEventListener('fullscreenchange', () => {
      const m = window._prosMapa;
      if (!m) return;
      try { setTimeout(() => m.invalidateSize(), 80); } catch(_){}
    });

    function prosInitMapa(refit){
      const cont = document.getElementById('pros-mapa');
      const P = ESTADO.prospeccion;
      if (!cont || !P || typeof L === 'undefined') return;
      if (cont.offsetParent === null && !document.fullscreenElement) return;
      const { puntos: todos } = prosComunasVistas();
      if (!todos.length) {
        cont.innerHTML = '<p class="muted" style="padding:20px">Sin coordenadas todavía: corre <code>node scripts/geocodificar-prospectos.js</code>.</p>';
        return;
      }
      const sel = window._prosComunaSel || 'todas';
      const puntos = sel === 'todas' ? todos : todos.filter(p => prosNorm(p.comuna).includes(prosNorm(sel)));

      let mapa = window._prosMapa;
      if (!mapa || mapa._container !== cont) {
        if (mapa) { try { mapa.remove(); } catch(_){} }
        // Rueda/trackpad hacen zoom directo (pedido 08-08): explorar el mapa
        // manda por sobre el scroll de la página cuando el cursor está encima.
        mapa = L.map(cont, { scrollWheelZoom: true });
        window._prosMapa = mapa;
        window._prosEncuadre = null;
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 19,
        }).addTo(mapa);
        window._prosCapa = L.layerGroup().addTo(mapa);
      }
      const capa = window._prosCapa;
      capa.clearLayers();
      const marcadores = [];
      for (const p of puntos) {
        const color = PROS_COLORES[p.estado] || '#64748b';
        // Los que ya se movieron (respondió/reunión) laten con un pulso de
        // radar: el mapa cuenta la historia de un vistazo.
        const vivo = ['respondio','reunion','cliente'].includes(p.estado);
        const d = vivo ? 16 : 11;
        const m = L.marker([p.lat, p.lng], {
          icon: L.divIcon({
            className: '',
            html: `<div class="pros-pin${vivo ? ' vivo' : ''}" style="width:${d}px;height:${d}px;background:${color};opacity:${vivo ? 1 : (p.estado === 'frio' ? 0.62 : 0.85)}"></div>`,
            iconSize: [d, d], iconAnchor: [d/2, d/2],
          }),
        });
        m.bindPopup(prosPopupHtml(p, color), { maxWidth: 340, minWidth: 270 });
        capa.addLayer(m);
        marcadores.push(m);
      }
      // Encuadre al cambiar de vista o al nacer el mapa; un refresco de datos
      // no le roba al operador el zoom donde lo dejó.
      const clave = sel + ':' + (document.fullscreenElement ? 'full' : 'panel');
      if (marcadores.length && (refit || window._prosEncuadre !== clave)) {
        mapa.fitBounds(L.featureGroup(marcadores).getBounds().pad(0.15));
        window._prosEncuadre = clave;
      }
      setTimeout(() => { try { mapa.invalidateSize(); } catch(_){} }, 60);
    }
    window.prosInitMapa = prosInitMapa;

    /** Características DERIVADAS de lo que ya sabemos del local: qué sistema
       usa (AgendaPro/Weibook = ya paga por resolver este problema), si tiene
       web con reservas, ticket, prioridad del kit. Se leen de las notas del
       scraping — cuando el enriquecimiento traiga más señales, aparecen solas. */
    function prosTags(p){
      const n = prosNorm(String(p.notas || ''));
      const tags = [];
      if (n.includes('agendapro'))                    tags.push({ t: '⚡ usa AgendaPro', c: '#C6F94E' });
      if (n.includes('weibook'))                      tags.push({ t: '⚡ usa Weibook', c: '#C6F94E' });
      if (n.includes('booksy'))                       tags.push({ t: '⚡ usa Booksy', c: '#C6F94E' });
      if (n.includes('reservas') || n.includes('sistema propio')) tags.push({ t: '🌐 reservas online', c: '#9CCC3C' });
      if (/[a-z0-9-]+\.(cl|com)\b/.test(n))           tags.push({ t: '🌐 tiene web', c: '#8fa0b3' });
      if (n.includes('alto ticket') || n.includes('premium')) tags.push({ t: '💎 alto ticket', c: '#f0b429' });
      if (n.includes('prioridad: prioridad alta'))    tags.push({ t: '🔥 prioridad alta', c: '#f0b429' });
      return tags;
    }
    function prosTagsHtml(p, chico){
      return prosTags(p).map(x => `<span style="border:1px solid ${x.c}55;color:${x.c};border-radius:999px;padding:${chico ? '1px 7px' : '2px 9px'};font-size:${chico ? '10px' : '10.5px'};white-space:nowrap">${x.t}</span>`).join(' ');
    }

    /** La FICHA del prospecto (popup del mapa): todo lo que se sabe del local
       + bitácora de seguimiento con nota nueva sin salir del mapa. */
    function prosPopupHtml(p, color){
      const gris = (t) => `<span style="color:#8fa0b3;font-size:11.5px">${t}</span>`;
      const historial = [
        p.dmEnviadoEn ? `📤 DM ${prosHace(p.dmEnviadoEn)}` : '',
        (p.emailsEnviados||0) ? `✉️ ${p.emailsEnviados} correo(s)` : '',
        p.respondioEn ? `💬 respondió ${prosHace(p.respondioEn)} por ${p.respondioCanal === 'instagram' ? 'IG' : 'WA'}` : '',
        (p.toques||[]).length ? `${(p.toques||[]).length} toque(s)` : '',
      ].filter(Boolean).join(' · ');
      const acciones = [
        p.lat !== null ? `<a href="https://maps.google.com/?q=${p.lat},${p.lng}" target="_blank" rel="noopener">📍 Cómo llegar</a>` : '',
        p.instagram ? `<a href="https://instagram.com/${esc(p.instagram)}" target="_blank" rel="noopener">📸 @${esc(p.instagram)}</a>` : gris('📸 sin IG conocido'),
        p.telefono ? `<a href="https://wa.me/${esc(p.telefono)}" target="_blank" rel="noopener">💬 WhatsApp</a>` : '',
        p.email ? `<a href="mailto:${esc(p.email)}">✉️ Correo</a>` : '',
      ].filter(Boolean).join(' &nbsp;·&nbsp; ');
      const notas = (p.seguimiento || []).slice(-2).map(nn =>
        `<div style="font-size:11px;color:#aab8c5;margin-top:3px">📝 ${esc(nn.texto)} ${gris('· ' + prosHace(nn.en))}</div>`).join('');
      const tags = prosTagsHtml(p, false);
      return `<b style="font-size:13.5px">${esc(p.negocio)}</b><br>
        <span style="color:${color}">●</span> ${PROS_ESTADOS[p.estado] || esc(p.estado)}${p.rubro ? ` · ${gris(esc(p.rubro))}` : ''}${p.comuna ? ` · ${gris(esc(p.comuna))}` : ''}<br>
        ${gris(esc(p.direccion || 'sin dirección exacta'))}
        ${tags ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:6px">${tags}</div>` : ''}
        ${p.notas ? `<div style="color:#8fa0b3;font-size:11px;margin-top:5px">${esc(String(p.notas).slice(0, 130))}</div>` : ''}
        ${historial ? `<div style="margin-top:6px;font-size:11.5px">${historial}</div>` : ''}
        ${p.estado === 'descartado' && p.descartadoMotivo ? `<div style="color:#e0645c;font-size:11.5px;margin-top:4px">🗑 ${esc(p.descartadoMotivo)}</div>` : ''}
        <div style="margin-top:8px;border-top:1px solid rgba(255,255,255,.1);padding-top:7px">${acciones}</div>
        <div style="margin-top:7px">${notas}
          <div style="display:flex;gap:5px;margin-top:5px">
            <input id="nota-${p.id}" placeholder="nota de seguimiento…" autocomplete="off" style="flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:8px;color:#fff;padding:5px 9px;font-size:11.5px">
            <button class="mini" title="Guardar la nota en la ficha" onclick="prosGuardarNota('${p.id}',this)">💾</button>
          </div>
          <div style="display:flex;gap:5px;margin-top:6px">
            <button class="mini" onclick="prosVerEnCartera('${p.id}')">🗂 ver en cartera</button>
            <button class="mini" onclick="prosPrefillReunion('${p.id}')">🤝 agendar reunión</button>
          </div>
        </div>`;
    }

    async function prosGuardarNota(id, btn){
      const inp = document.getElementById('nota-' + id);
      const texto = ((inp && inp.value) || '').trim();
      if (!texto) { alert('Escribe la nota primero.'); return; }
      await prosOcupado(btn, '', async () => {
        try {
          await _fn('prospeccionAccion')({ accion: 'nota', id, texto });
          // La ficha sigue abierta: la nota se refleja al tiro en el ESTADO
          // local y el próximo refresco trae la verdad del servidor.
          const p = ((ESTADO.prospeccion || {}).prospectos || []).find(x => x.id === id);
          if (p) p.seguimiento = [...(p.seguimiento || []), { texto, en: Date.now() }];
          if (inp) inp.value = '';
          if (btn) { btn.textContent = '✅'; setTimeout(() => { try { btn.textContent = '💾'; } catch(_){} }, 1500); }
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    function prosVerEnCartera(id){
      const p = ((ESTADO.prospeccion || {}).prospectos || []).find(x => x.id === id);
      if (!p) return;
      window._prosBusca = p.negocio;
      const inp = document.getElementById('pros-buscar');
      if (inp) inp.value = p.negocio;
      prosAplicarFiltro();
      prosIrA('pros-tabla');
    }
    function prosPrefillReunion(id){
      const p = ((ESTADO.prospeccion || {}).prospectos || []).find(x => x.id === id);
      const inp = document.getElementById('pros-reu-prospecto');
      if (p && inp) inp.value = p.negocio;
      prosIrA('pros-reuniones');
    }

    /** Todo botón que llama al servidor lo DICE: se deshabilita y muestra ⏳
       hasta que la operación termina. Nada de clics al vacío. */
    async function prosOcupado(btn, texto, fn){
      const previo = btn ? btn.innerHTML : null;
      if (btn) { btn.disabled = true; btn.innerHTML = '⏳ ' + texto; }
      try { return await fn(); }
      finally { if (btn && document.body.contains(btn)) { btn.disabled = false; btn.innerHTML = previo; } }
    }

    /** Refresca la cartera. `ligero` (tras una acción) se salta lo caro del
       backend —rendimiento y reactivables— y conserva los últimos valores. */
    async function refrescarProspeccion(ligero){
      const chip = document.getElementById('pros-sync');
      if (chip) chip.style.display = '';
      try {
        const r = await _fn('prospeccionEstado')({ ligero: ligero === true });
        const prev = ESTADO.prospeccion || {};
        const d = (r && r.data) || {};
        ESTADO.prospeccion = {
          ...d,
          rendimiento: d.rendimiento || prev.rendimiento || null,
          reactivables: d.reactivables || prev.reactivables || [],
          reuniones: d.reuniones || prev.reuniones || [],
        };
      } catch(_){}
      prosPintar();
    }
    /** Mutación genérica: acción → refresco parcial ligero (jamás cargar()). */
    async function prosAccion(accion, id, btn){
      let motivo;
      if (accion === 'descartar') {
        motivo = prompt('¿Por qué se descarta? Queda registrado para aprender de la calle (ej: "IG sin DMs activados", "cerró", "ya usa otro sistema").');
        if (motivo === null) return;
      }
      await prosOcupado(btn, '…', async () => {
        try {
          await _fn('prospeccionAccion')({ accion, id, ...(motivo !== undefined ? { motivo } : {}) });
          await refrescarProspeccion(true);
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    async function prosToggle(campo, valor, chk){
      if (chk) chk.disabled = true;
      try { await _fn('prospeccionAccion')({ accion: 'config', patch: { [campo]: !!valor } }); }
      catch(e){ alert('Error: ' + (e.message || e)); }
      await refrescarProspeccion(true);
    }
    function prosCopiarDM(id){
      const P = ESTADO.prospeccion;
      const p = P && (P.prospectos||[]).find(x => x.id === id);
      if (!p || !p.dmBorrador) return;
      navigator.clipboard.writeText(p.dmBorrador.texto).then(() => {
        const b = document.getElementById('cpdm-' + id);
        if (b) { b.textContent = '✅ Copiado'; setTimeout(() => { b.textContent = '📋 Copiar'; }, 1600); }
      }).catch(() => alert('No pude copiar al portapapeles. Selecciona el texto a mano.'));
    }
    async function prosGenerarDMs(btn){
      await prosOcupado(btn, 'redactando 5 DMs…', async () => {
        try {
          const r = await _fn('prospeccionAccion')({ accion: 'generarDMs', cantidad: 5 });
          await refrescarProspeccion(true);
          if (!(r.data && r.data.generados)) alert('No había prospectos fríos con Instagram sin DM redactado.');
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    async function prosGenerarEmails(btn){
      await prosOcupado(btn, 'redactando correos…', async () => {
        try {
          const r = await _fn('prospeccionAccion')({ accion: 'generarEmails', cantidad: 10 });
          await refrescarProspeccion(true);
          if (!((r.data || {}).redactados)) alert('Nadie tenía un correo pendiente que redactar (sin email, ya con borrador, o esperando su día de la secuencia).');
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    async function prosTestEmail(btn){
      if (!confirm('Redacta un correo de prueba con el agente y te lo manda a tu Gmail. ¿Dale?')) return;
      await prosOcupado(btn, 'redactando y enviando…', async () => {
        try {
          const r = await _fn('prospeccionAccion')({ accion: 'testEmail' });
          alert('Enviado a tu correo ✅  Asunto: ' + ((r.data||{}).asunto || ''));
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    async function prosRescatarAhora(btn){
      if (!confirm('Esto manda follow-ups REALES (máx 5) a conversaciones que se enfriaron hace 18–26 h. ¿Seguir?')) return;
      await prosOcupado(btn, 'rescatando…', async () => {
        try {
          const r = await _fn('prospeccionAccion')({ accion: 'rescatarAhora', limite: 5 });
          const rs = ((r.data||{}).resultados||[]).filter(x => x.enviado).length;
          alert(rs ? `Listo: ${rs} follow-up(s) enviados.` : 'No había conversaciones tibias en la ventana de 18–26 h.');
          await refrescarProspeccion(true);
        } catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    async function prosAgregar(btn){
      const v = (i) => (document.getElementById(i) || {}).value || '';
      const datos = {
        negocio: v('pros-negocio'), instagram: v('pros-instagram'), email: v('pros-email'),
        telefono: v('pros-telefono'), comuna: v('pros-comuna'), rubro: v('pros-rubro'),
        direccion: v('pros-direccion'), notas: v('pros-notas'),
      };
      if (!datos.negocio.trim()) { alert('El negocio necesita nombre.'); return; }
      await prosOcupado(btn, 'guardando y ubicando…', async () => {
        try { await _fn('prospeccionAccion')({ accion: 'agregar', datos }); await refrescarProspeccion(false); }
        catch(e){ alert('Error: ' + (e.message || e)); }
      });
    }
    // Los handlers van en onclick de HTML re-generado: se cuelgan de window
    // para sobrevivir a cualquier scope y para el guard de check-ops-panel.
    window.prosAccion = prosAccion; window.prosToggle = prosToggle;
    window.prosCopiarDM = prosCopiarDM; window.prosGenerarDMs = prosGenerarDMs;
    window.prosGenerarEmails = prosGenerarEmails; window.prosTestEmail = prosTestEmail;
    window.prosRescatarAhora = prosRescatarAhora; window.prosAgregar = prosAgregar;
    window.prosMapaComuna = prosMapaComuna; window.prosMapaFullscreen = prosMapaFullscreen;
    window.prosIrA = prosIrA; window.prosFiltrarTabla = prosFiltrarTabla;
    window.prosFiltroEstado = prosFiltroEstado;
    window.prosGuardarNota = prosGuardarNota; window.prosVerEnCartera = prosVerEnCartera;
    window.prosPrefillReunion = prosPrefillReunion;
    window.prosReunionCrear = prosReunionCrear; window.prosReunionCancelar = prosReunionCancelar;
    /* `full` para que la barra de cuenta + botón ocupe la fila completa: desde
       1280px la sección es una grilla y sin eso el botón queda encerrado en la
       primera columna, lejos del borde derecho. */
    function seccionAds(){
      return `<div class="full" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <span class="muted" style="font-size:12px">Cuenta ${(ESTADO.metaAds && ESTADO.metaAds.adAccountId) || '—'}</span>
          <button id="adsRefresh">↻ Refrescar ads</button>
        </div>${metaAdsPanel(ESTADO.metaAds)}`;
    }

    /** Repinta UNA sección sin tocar el resto del DOM: conserva la pestaña
     *  activa, el scroll y cualquier cosa que el operador tenga abierta. */
    function repintar(sec){
      const el = document.querySelector(`.sec[data-sec="${sec}"]`);
      if (!el) return;
      if (sec === 'ventas')   el.innerHTML = seccionVentas();
      if (sec === 'contenido') el.innerHTML = seccionContenido();
      // Prospección NO repinta la sección entera: llena sus cascarones y el
      // mapa solo mueve pines (ver prosPintar).
      if (sec === 'prospeccion') prosPintar();
      if (sec === 'crecimiento') el.innerHTML = seccionCrecimiento();
      if (sec === 'plataforma') el.innerHTML = seccionPlataforma();
      if (sec === 'cobranza') el.innerHTML = seccionCobranza();
      const f = document.getElementById('frescura');
      if (f) f.innerHTML = frescuraHtml();
      // El recuadro "Hoy" del Resumen depende de datos de la ola 2 (bot de
      // ventas, leads y chips) y `repintar` no lo tocaba: quedaba en
      // "consultando…" para siempre porque el resumen se dibuja una sola vez.
      const ph = document.getElementById('panel-hoy');
      if (ph) ph.innerHTML = panelHoy();
      pintarBadges();
    }

    /** Los contadores de las pestañas viven fuera de las secciones, así que un
     *  repintado parcial no los toca. Sin esto, "Ventas · 2" nunca aparecería
     *  en la primera carga: los leads llegan en la ola 2, después del render. */
    function pintarBadges(){
      const set = (tab, txt) => {
        const b = document.querySelector(`.tabs button[data-tab="${tab}"]`);
        if (b) b.textContent = txt;
      };
      const pend = ESTADO.ventas ? (ESTADO.ventas.leads||[]).filter(l => l.estado === 'reunion_solicitada').length : 0;
      set('ventas', `🎯 Ventas${pend ? ' · ' + pend : ''}`);
      const prosPend = prosPendientes();
      set('prospeccion', `🚀 Prospección${prosPend ? ' · ' + prosPend : ''}`);
      const atrasado = ESTADO.cobranza && (ESTADO.cobranza.rows||[]).some(r => r.diasAtraso > 0);
      set('cobranza', `💰 Cobranza${atrasado ? ' · 🔴' : ''}`);
      // Piezas LISTAS para subir de la semana visible: el número que empuja.
      const _cs = typeof contSemana === 'function' ? contSemana() : null;
      const contListas = _cs ? (_cs.items||[]).filter(i => i.estado === 'listo').length : 0;
      set('contenido', `📅 Contenido${contListas ? ' · ' + contListas : ''}`);
    }

    /** Refresca solo los datos de ventas (3 lecturas) y repinta esa sección.
     *  Reemplaza al `cargar()` que disparaban las acciones de leads/bot. */
    async function refrescarVentas(){
      const [rv, rb, ra] = await Promise.all([
        _fn('ventasLeads')({}).catch(() => null),
        _fn('ventasBotConfig')({}).catch(() => null),
        _fn('ventasAgendaVer')({}).catch(() => null),
      ]);
      if (rv) ESTADO.ventas = rv.data;
      if (rb) ESTADO.botCfg = rb.data;
      if (ra) ESTADO.agendaVentas = ra.data;
      repintar('ventas');
    }
    async function refrescarCobranza(){
      const rk = await _fn('cobranzaConfig')({}).catch(() => null);
      if (rk) ESTADO.cobranza = rk.data;
      repintar('cobranza');
    }
    /** Asignar/desvincular chips cambia el mapa local↔chip. Solo se recarga esa
     *  lista: las métricas de los 36 locales no tienen nada que ver. */
    async function refrescarChips(){
      const rc = await _fn('plataformaChips')({}).catch(() => null);
      if (rc) ESTADO.chips = rc.data;
      const w = document.querySelector('.sec[data-sec="whatsapp"]');
      if (w && ESTADO.chips && ESTADO.metrics) {
        w.innerHTML = chipsAdminPanel(ESTADO.chips.chips, ESTADO.chips.locales)
          + ((ESTADO.metrics.barberia && ESTADO.metrics.barberia.chips) || []).map(chipPanel).join('')
          + metaWaPanel(ESTADO.metrics.metaWhatsApp);
      }
    }
    /** Meta Ads se refresca solo: vuelve a pegarle a la Marketing API sin
     *  recalcular los 36 locales, que es lo caro y no tiene nada que ver. */
    async function refrescarAds(btn){
      const txt = btn ? btn.textContent : null;
      if (btn) { btn.textContent = 'Consultando a Meta…'; btn.disabled = true; }
      try {
        const r = await _fn('opsMetaAdsRefrescar')({});
        ESTADO.metaAds = (r.data && r.data.metaAds) || ESTADO.metaAds;
        const el = document.querySelector('.sec[data-sec="ads"]');
        if (el) {
          el.innerHTML = seccionAds();
          const b = document.getElementById('adsRefresh');
          if (b) b.onclick = () => refrescarAds(b);
        }
      } catch(e){
        alert('No pude leer Meta: ' + (e.message || e));
        if (btn) { btn.textContent = txt; btn.disabled = false; }
      }
    }

    /** Ola 2: lo barato. No bloquea el primer pintado. */
    function cargarLivianos(){
      _fn('ventasLeads')({}).then(r => { ESTADO.ventas = r.data; repintar('ventas'); }).catch(() => {});
      _fn('ventasBotConfig')({}).then(r => { ESTADO.botCfg = r.data; repintar('ventas'); }).catch(() => {});
      _fn('ventasAgendaVer')({}).then(r => { ESTADO.agendaVentas = r.data; repintar('ventas'); }).catch(() => {});
      _fn('cobranzaConfig')({}).then(r => { ESTADO.cobranza = r.data; repintar('cobranza'); }).catch(() => {});
      _fn('prospeccionEstado')({}).then(r => { ESTADO.prospeccion = r.data; repintar('prospeccion'); }).catch(() => {});
      _fn('opsContenidoVer')({}).then(r => { ESTADO.contenido = r.data; repintar('contenido'); }).catch(() => {});
      // Los chips viven dentro del render grande (pestaña WhatsApp); si llegan
      // después del primer pintado se dibujan en el siguiente repintado global.
      _fn('plataformaChips')({}).then(r => {
        ESTADO.chips = r.data;
        const w = document.querySelector('.sec[data-sec="whatsapp"]');
        if (w && ESTADO.metrics) {
          w.innerHTML = chipsAdminPanel(ESTADO.chips.chips, ESTADO.chips.locales)
            + ((ESTADO.metrics.barberia && ESTADO.metrics.barberia.chips) || []).map(chipPanel).join('')
            + metaWaPanel(ESTADO.metrics.metaWhatsApp);
        }
        repintar('resumen');   // el contador de chips vive también en "Hoy"
      }).catch(() => {});
    }

    /**
     * @param {boolean} fresco true = recalcular de verdad (botón "Actualizar").
     *   false/omitido = servir el snapshot del cron, que es el caso normal.
     */
    async function cargar(fresco){
      const primeraVez = !ESTADO.metrics;
      if (primeraVez) app.innerHTML = `<div class="login"><p class="muted">Cargando…</p></div>`;
      ESTADO.cargando = true;
      const f = document.getElementById('frescura');
      if (f) f.innerHTML = frescuraHtml();

      try {
        const r = (await _fn('opsSnapshot')({ fresco: !!fresco })).data || {};
        ESTADO.metrics      = r.metrics   || ESTADO.metrics;
        ESTADO.metaAds      = r.metaAds   || ESTADO.metaAds;
        ESTADO.instagram    = r.instagram || ESTADO.instagram;
        ESTADO.edadSegundos = r.edadSegundos || 0;
        ESTADO.parcial      = !!r.parcial;
        ESTADO.cargando     = false;

        if (!ESTADO.metrics) {
          app.innerHTML = `<div class="login"><h2>Sin datos</h2><p class="muted">El snapshot todavía no se ha generado. Pulsa Actualizar.</p>
            <button id="rt" style="margin-top:12px">Actualizar</button></div>`;
          document.getElementById('rt').onclick = () => cargar(true);
          return;
        }
        render(ESTADO.metrics, ESTADO.chips, ESTADO.ventas, ESTADO.botCfg, ESTADO.cobranza);
        if (primeraVez) cargarLivianos();
      } catch(e){
        ESTADO.cargando = false;
        app.innerHTML = `<div class="login"><h2>Sin acceso</h2><div id="err">${e.message||e}</div><button id="out" style="margin-top:12px">Salir</button></div>`;
        const b=document.getElementById('out'); if(b) b.onclick=()=>firebase.auth().signOut();
      }
    }

    firebase.auth().onAuthStateChanged(u => { if(u) cargar(); else loginView(); });
  </script>
</body>
</html>
